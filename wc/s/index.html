<style>
/* Slush line, as on /walletcoach/: black outlines, pastel bands, Anton
   headings, no shadows. Dark mode swaps paper and ink, keeps the pastels. */
:root {
  color-scheme: light;
  --ink: #000; --paper: #fff; --soft: #555; --wash: #fafafa;
  --app: #ffb3d9; --blue: #4da2ff; --mint: #55db9c; --lav: #e9ccff; --sun: #ffd731; --violet: #5c4ade;
  --hero: color-mix(in srgb, var(--app) 55%, #fff);
  --disp: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --line: 1.5px solid var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --ink: #f2f2f2; --paper: #121214; --soft: #b4b4bc; --wash: #19191c; --hero: color-mix(in srgb, var(--app) 26%, #121214); }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); font-weight: 500; font-size: 16px; line-height: 1.5; letter-spacing: -.01em; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.disp { font-family: var(--disp); font-weight: 400; text-transform: uppercase; line-height: .9; letter-spacing: -.005em; }

.marquee { background: var(--ink); color: var(--paper); overflow: hidden; white-space: nowrap; }
.mq { display: inline-flex; gap: 28px; padding: 8px 0; animation: slide 40s linear infinite; }
.mq span { font-weight: 700; font-size: 12px; letter-spacing: .032em; text-transform: uppercase; }
@keyframes slide { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .mq, .sticker { animation: none !important; } }

.bar { display: flex; align-items: center; gap: 8px; padding: 12px 0; }
.logo { width: 42px; height: 42px; border: var(--line); border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-family: var(--disp); font-size: 24px; flex: none; }
.brand { font-weight: 700; font-size: 13px; letter-spacing: .03em; }
.langs { margin-left: auto; min-width: 0; max-width: 46vw; font: inherit; font-weight: 700; font-size: 12px; letter-spacing: .02em; color: var(--ink); background: var(--paper); border: var(--line); border-radius: 999px; padding: 6px 28px 6px 12px; cursor: pointer; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; text-overflow: ellipsis; }
.langs option { color: #000; background: #fff; }

.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: var(--line); border-radius: 999px; background: var(--paper); padding: 14px 22px; font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; transition: transform .15s; }
.pill:hover { transform: translateY(-2px) rotate(-1deg); }
.pill.dark { background: var(--ink); color: var(--paper); }
.pill svg { width: 16px; height: 16px; fill: currentColor; }

.hero { background: var(--hero); border-bottom: var(--line); padding: 26px 0 30px; text-align: center; }
.sticker { width: 92px; height: 92px; margin: 0 auto; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 46px; line-height: 1; background: var(--sun); transform: rotate(-6deg); animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: rotate(4deg) translateY(-6px); } }
.kick { margin-top: 18px; font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
.tag { border: var(--line); border-radius: 999px; padding: 3px 10px; background: var(--paper); }
.hero h1 { font-size: clamp(44px, 13vw, 84px); margin-top: 12px; overflow-wrap: anywhere; }
.hero .upd { margin-top: 10px; font-size: 14px; color: var(--soft); font-weight: 700; }
.hero .pill { margin-top: 20px; }
.hero .hint { margin-top: 10px; font-size: 13px; color: var(--soft); }

.listing { padding: 26px 0 8px; }
.box { border: var(--line); border-radius: 26px; background: var(--paper); overflow: hidden; }
.sum { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; background: var(--mint); color: #000; border-bottom: var(--line); flex-wrap: wrap; }
.sum span { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.sum b { font-family: var(--disp); font-weight: 400; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.sum .side { font-size: 13px; font-weight: 700; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); }
.row:last-child { border-bottom: 0; }
.row .t { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.row .d { color: var(--soft); font-size: 13px; }
.row .a { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row.off .t, .row.off .a { opacity: .45; text-decoration: line-through; }
.st { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
.empty { padding: 18px; color: var(--soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; padding: 16px 18px; }
.tiles i { font-style: normal; border: 1.5px solid var(--ink); border-radius: 12px; padding: 8px 2px; text-align: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tiles i.done { background: var(--sun); color: #000; }
.meter { height: 12px; border: var(--line); border-radius: 999px; overflow: hidden; margin: 0 18px 4px; background: var(--wash); }
.meter b { display: block; height: 100%; background: var(--violet); }

section.how { padding: 34px 0 10px; }
.how h2, .get h2 { font-size: clamp(36px, 10vw, 56px); line-height: .98; }
.cards { display: grid; gap: 12px; margin-top: 18px; }
.card { border: 2px solid var(--ink); border-radius: 26px; padding: 18px 20px; background: var(--c); color: #000; transform: rotate(var(--r)); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.card:hover { transform: rotate(0) scale(1.02); }
.card h3 { font-family: var(--disp); font-weight: 400; font-size: 30px; text-transform: uppercase; line-height: .95; display: flex; gap: 10px; align-items: center; }
.card h3 em { font-style: normal; font-size: 24px; }
.card p { margin-top: 8px; font-size: 15px; }
.card .go { margin-top: 12px; padding: 9px 16px; font-size: 14px; background: #000; color: #fff; border-color: #000; cursor: pointer; font-family: inherit; }
.sheet { margin-top: 14px; border: 2px solid var(--ink); border-radius: 26px; background: var(--paper); padding: 18px; }
.sheet h3 { font-family: var(--disp); font-weight: 400; font-size: 30px; text-transform: uppercase; line-height: .95; }
.sheet .foot { color: var(--soft); font-size: 13px; margin-top: 4px; }
.fld { display: grid; gap: 4px; margin-top: 12px; }
.fld > span { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--soft); }
.fld input, .fld select, .fld textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: var(--line); border-radius: 14px; padding: 11px 13px; width: 100%; min-width: 0; }
.fld textarea { min-height: 70px; resize: vertical; }
.fld input.big { font-family: var(--disp); font-size: 30px; padding: 8px 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chk { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-weight: 700; }
.chk input { width: 22px; height: 22px; accent-color: var(--violet); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.acts .pill { cursor: pointer; font-family: inherit; padding: 12px 20px; }
.msg { margin-top: 12px; font-weight: 700; font-size: 14px; }
.msg.err { color: #d6455d; }
.done { background: var(--mint); color: #000; border-radius: 18px; border: 2px solid #000; padding: 14px 16px; font-weight: 700; margin-top: 14px; }

section.get { margin-top: 30px; padding: 34px 0; background: var(--sun); color: #000; border-top: var(--line); border-bottom: var(--line); --ink: #000; --paper: #fff; }
.get p { margin: 12px 0 18px; font-size: 16px; max-width: 46ch; }
.stores { display: flex; gap: 8px; flex-wrap: wrap; }
.stores .pill { background: #000; color: #fff; border-color: #000; }

footer { padding: 22px 0 36px; color: var(--soft); font-size: 13px; }
footer .priv { margin-bottom: 10px; color: var(--ink); }
.missing { padding: 30px 0 10px; }
@media (max-width: 420px) { .langs button { padding: 4px 7px; font-size: 10px; } .brand { display: none; } }
</style>
</head>

    </div>
  </div>
</section>

<footer class="wrap">

</footer>

      const ps = (p.purchases || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      const bought = ps.filter(x => x.priceOnly !== true), spent = bought.reduce((s, x) => s + (+x.amount || 0), 0);
      const budget = p.project?.budget;
      return sumBar(T.spent, money(spent, sym), budget ? `${T.budget}: ${money(budget, sym)}<br>${T.left}: ${money(Math.max(0, budget - spent), sym)}` : T.items(ps.length))
        + (budget ? `<div style="padding-top:12px"><div class="meter"><b style="width:${Math.min(100, spent / budget * 100)}%"></b></div></div>` : "")
        + (ps.map(x => row(esc(x.name), esc([qty(x) + (x.vendor || ""), day(x.date)].filter(Boolean).join(" · ").replace(/^ · /, "")), money(x.amount, pSym(x)))).join("") || `<p class="empty">${T.empty}</p>`);
    }
    case "priceLog": {
      // Latest price per item, newest first.
      const latest = new Map();
      for (const x of (p.purchases || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date))) {
        const k = String(x.name || "").trim().toLowerCase(); if (!latest.has(k)) latest.set(k, { x, n: 0 }); latest.get(k).n++;
      }
      const items = [...latest.values()];
      return sumBar(T.latest, T.items(items.length))
        + (items.map(({ x, n }) => row(esc(x.name), esc([qty(x) + (x.vendor || ""), day(x.date), n > 1 ? `×${n}` : ""].filter(Boolean).join(" · ").replace(/^ · /, "")), money(x.amount, pSym(x)))).join("") || `<p class="empty">${T.empty}</p>`);
    }
    case "assets": {
      const as = (p.assets || []).slice().sort((a, b) => (b.value || 0) - (a.value || 0));
      return sumBar(T.total, money(as.reduce((s, x) => s + (+x.value || 0), 0), sym), T.items(as.length))
        + (as.map(x => row(esc(x.name), esc(day(x.valuedAt)), money(x.value, sym))).join("") || `<p class="empty">${T.empty}</p>`);
    }
    case "savingsPot": {
      const pot = p.pot || {}, es = (p.savingEntries || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      const unit = pot.unit === "usd" ? "$" : pot.unit === "gold" ? "gr" : pot.unit === "custom" ? (pot.unitLabel || "") : sym;
      const fmtQ = v => pot.unit === "money" || pot.unit === "usd" || !pot.unit ? money(v, unit) : `${nf(v, 3)} ${esc(unit)}`;
      const total = es.reduce((s, x) => s + (+x.quantity || 0), 0);
      return sumBar(T.saved, fmtQ(total), pot.target ? `${T.left}: ${fmtQ(Math.max(0, pot.target - total))}` : T.items(es.length))
        + (pot.target ? `<div style="padding-top:12px"><div class="meter"><b style="width:${Math.min(100, total / pot.target * 100)}%"></b></div></div>` : "")
        + (es.map(x => row(esc(x.note || day(x.date)), esc(x.note ? day(x.date) : ""), fmtQ(x.quantity))).join("") || `<p class="empty">${T.empty}</p>`);
    }
    case "board": {
      const b = p.board || {}, tiles = (b.tiles || []).slice().sort((a, c) => a.id - c.id), done = tiles.filter(t => t.doneAt);
      const bs = b.isCurrency === false ? "" : (b.symbol || sym), saved = done.reduce((s, t) => s + (+t.amount || 0), 0);
      return sumBar(T.saved, money(saved, bs), `${T.tilesDone(done.length, tiles.length)}<br>${T.left}: ${money(Math.max(0, (b.target || 0) - saved), bs)}`)
        + `<div style="padding-top:12px"><div class="meter"><b style="width:${b.target ? Math.min(100, saved / b.target * 100) : 0}%"></b></div></div>`
        + (tiles.length ? `<div class="tiles">${tiles.map(t => `<i class="${t.doneAt ? "done" : ""}">${nf(t.amount, 0)}</i>`).join("")}</div>` : `<p class="empty">${T.empty}</p>`);
    }
    case "wishlist": {
      const order = { pending: 0, bought: 1, skipped: 2 };
      const ws = (p.wishes || []).slice().sort((a, b) => (order[a.decision] ?? 0) - (order[b.decision] ?? 0) || new Date(b.createdAt) - new Date(a.createdAt));
      const pend = ws.filter(x => (x.decision || "pending") === "pending");
      return sumBar(T.total, money(pend.reduce((s, x) => s + (+x.price || 0), 0), sym), `${T.pending}: ${pend.length}`)
        + (ws.map(x => { const d = x.decision || "pending";
          return row(esc(x.name) + (d !== "pending" ? `<span class="st">${d === "bought" ? T.bought : T.skipped}</span>` : ""), "", money(x.price, x.currency || sym), d === "skipped" ? "off" : ""); }).join("") || `<p class="empty">${T.empty}</p>`);
    }
  }
  return `<p class="empty">${T.empty}</p>`;
}

const FB_CFG = { apiKey: "AIzaSyD3N9_z4h2WGT57yUUz_Ip6C0pZINHVQJE", authDomain: "wallet-coach-87336.firebaseapp.com", projectId: "wallet-coach-87336", appId: "1:516767341196:web:ed76884517bcfc3cd4b9a9" };
let fb = null, sgState = "form", sgError = "";
const sgVals = {};
const THROTTLE_KEY = "wc-suggest-" + id;
function categoriesFor(p) {
  const out = [], seen = new Set(), add = r => { r = String(r || "").trim(); if (r && !seen.has(r)) { seen.add(r); out.push(r); } };
  if (p.project) { (PROJECT_CATS[p.project.kind] || PROJECT_CATS.general).forEach(add); (p.project.extraCategories || []).forEach(add); }
  else SHOPPING.forEach(add);
  (p.purchases || []).map(x => x.category).forEach(add);
  add("other");
  return out;
}
const parseNum = raw => {
  let t = String(raw || "").replace(/[\s ']/g, "");
  if (!t) return null;
  const c = t.lastIndexOf(","), d = t.lastIndexOf(".");
  if (c > -1 && d > -1) t = c > d ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (c > -1) t = t.replace(",", ".");
  const n = Number(t);
  return isFinite(n) ? n : null;
};
const isoNoMs = d => d.toISOString().replace(/\.\d{3}Z$/, "Z");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function readVals() { document.querySelectorAll("#sgSheet [data-f]").forEach(el => sgVals[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value); }
function buildSuggest() {
  const T = I18N[lang], S = k => A("s", k), k = payload.kind, isPurchase = k === "project" || k === "priceLog";
  readVals();
  const v = (f, d = "") => sgVals[f] ?? d;
  const sel = (f, opts, label) => `<select data-f="${f}">${opts.map(o => `<option value="${esc(o)}"${v(f, opts[0]) === o ? " selected" : ""}>${esc(label(o))}</option>`).join("")}</select>`;
  const head = `<h3>${esc(T.c3t.toLocaleUpperCase(LOCALE[lang]))}</h3><p class="foot">${esc(S("footer"))}</p>`;
  if (sgState === "sent") {
    $("sgSheet").innerHTML = head + `<div class="done">${esc(T.sgSent)}</div><div class="acts"><button type="button" class="pill" id="sgAgain">${esc(T.sgAnother)}</button></div>`;
    $("sgAgain").onclick = () => { sgState = "form"; for (const f of ["name", "amount", "vendor", "note", "price"]) delete sgVals[f]; buildSuggest(); };
    return;
  }
  const nameLabel = k === "savingsPot" ? S("what_saving") : k === "assets" ? S("what_asset") : S("name");
  const amountLabel = k === "assets" ? S("amount_value") : k === "savingsPot" ? S("amount_saving") : k === "priceLog" ? S("amount_price") : S("amount");
  const sym = esc(payload.currency || "");
  let h = head + `<label class="fld"><span>${esc(nameLabel)}</span><input data-f="name" maxlength="120" value="${esc(v("name"))}"></label>
    <label class="fld"><span>${esc(amountLabel)}${sym ? ` (${sym})` : ""}</span><input data-f="amount" class="big" inputmode="decimal" placeholder="0" value="${esc(v("amount"))}"></label>`;
  if (isPurchase) {
    h += `<div class="two"><label class="fld"><span>${esc(S("purchase_quantity"))}</span><input data-f="qty" inputmode="decimal" value="${esc(v("qty", "1"))}"></label>
      <label class="fld"><span>&nbsp;</span>${sel("unit", UNITS, u => A("unit", u))}</label></div>
      <label class="fld"><span>${esc(S("purchase_category"))}</span>${sel("category", categoriesFor(payload), c => APP.cat[c] ? A("cat", c) : c)}</label>
      <label class="fld"><span>${esc(S("vendor"))}</span><input data-f="vendor" maxlength="80" value="${esc(v("vendor"))}"></label>
      <label class="fld"><span>${esc(S("date"))}</span><input data-f="date" type="date" value="${esc(v("date", today()))}"></label>`;
    if (k === "priceLog") h += `<label class="chk"><input type="checkbox" data-f="bought"${v("bought", true) ? " checked" : ""}> ${esc(S("bought"))}</label>`;
  }
  if (k === "assets") h += `<label class="fld"><span>${esc(S("asset_kind"))}</span>${sel("akind", AKINDS, a => A("akind", a))}</label>
      <label class="fld"><span>${esc(S("asset_cost"))}${sym ? ` (${sym})` : ""}</span><input data-f="cost" inputmode="decimal" value="${esc(v("cost"))}"></label>`;
  if (k === "savingsPot") h += `<label class="fld"><span>${esc(S("date"))}</span><input data-f="date" type="date" value="${esc(v("date", today()))}"></label>`;
  h += `<label class="fld"><span>${esc(S("note"))}</span><textarea data-f="note" maxlength="280">${esc(v("note"))}</textarea></label>
    <div class="acts"><button type="button" class="pill dark" id="sgSend">${esc(sgState === "sending" ? T.sgSending : S("send"))}</button><button type="button" class="pill" id="sgCancel">${esc(S("common_cancel"))}</button></div>
    ${sgError ? `<p class="msg err">${esc(sgError === "failed" ? `${A("s", "share_link_failed")}. ${A("s", "share_link_failed_message")}` : T[sgError])}</p>` : ""}`;
  $("sgSheet").innerHTML = h;
  $("sgSend").disabled = sgState === "sending";

  $("sgCancel").onclick = () => { $("sgSheet").classList.add("hidden"); sgError = ""; };
}
$("sgOpen").onclick = () => {
  if (!payload) return;
  $("sgSheet").classList.remove("hidden"); if (sgState !== "sent") sgState = "form"; buildSuggest();

};
function recent() {
  let list = []; try { list = JSON.parse(localStorage.getItem(THROTTLE_KEY) || "[]"); } catch (e) { }
  return list.filter(t => Date.now() - t < 10 * 6e4);
}
async function sendSuggestion() {
  const T = I18N[lang], k = payload.kind;
  readVals(); sgError = "";
  const name = String(sgVals.name || "").trim(), amount = parseNum(sgVals.amount);
  if ((k !== "savingsPot" && !name) || !(amount > 0)) { sgError = k === "savingsPot" ? "sgNeedAmount" : "sgNeed"; return buildSuggest(); }
  if (recent().length >= 3) { sgError = "sgLimit"; return buildSuggest(); }
  // The app's ShareRequestItem; nil fields are left out, dates as ISO8601 without fractions.
  const item = { name, amount };
  const note = String(sgVals.note || "");
  if (note.trim()) item.note = note.trim();
  const dateOf = () => { const [y, m, d] = String(sgVals.date || today()).split("-").map(Number); const n = new Date(); return isoNoMs(new Date(y, m - 1, d, n.getHours(), n.getMinutes(), n.getSeconds())); };
  if (k === "project" || k === "priceLog") {
    if (String(sgVals.vendor || "").trim()) item.vendor = String(sgVals.vendor).trim();
    item.date = dateOf();
    const q = parseNum(sgVals.qty); if (q > 0) item.quantity = q;
    item.unit = sgVals.unit || "piece";
    item.category = sgVals.category || "other";
    if (k === "priceLog") item.priceOnly = !sgVals.bought;
  } else if (k === "assets") {
    item.assetKind = sgVals.akind || "other";
    const c = parseNum(sgVals.cost); if (c != null) item.purchasePrice = c;
  } else if (k === "savingsPot") item.date = dateOf();
  sgState = "sending"; buildSuggest();
  try {
    if (!fb) {
      const base = "https://www.gstatic.com/firebasejs/10.14.1/";
      const [appM, authM, fsM] = await Promise.all(["firebase-app", "firebase-auth", "firebase-firestore"].map(m => import(base + m + ".js")));
      const app = appM.initializeApp(FB_CFG);
      fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
    }
    const user = fb.auth.currentUser || (await fb.A.signInAnonymously(fb.auth)).user;
    await fb.F.addDoc(fb.F.collection(fb.db, "shares", id, "requests"), {
      from: user.uid, kind: k, item: JSON.stringify(item), note: note.slice(0, 280), createdAt: fb.F.serverTimestamp(),
    });
    const list = recent(); list.push(Date.now()); try { localStorage.setItem(THROTTLE_KEY, JSON.stringify(list)); } catch (e) { }
    sgState = "sent";
  } catch (e) {
    console.warn("suggest", e);
    sgState = "form"; sgError = "failed";
  }
  buildSuggest();
}

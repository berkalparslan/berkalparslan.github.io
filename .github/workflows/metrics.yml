name: Collect app metrics

# App Store Connect satış raporlarını Supabase'e taşır.
# Apple raporları ~1 gün gecikmeli yayınlıyor, o yüzden sabah erken saat yeterli.
on:
  schedule:
    - cron: "17 6 * * *"   # her gün 06:17 UTC
  workflow_dispatch:        # Actions sekmesinden elle de tetiklenebilir

# Bu iş repoya hiçbir şey yazmıyor; sadece dışarı istek atıyor.
permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and upsert
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS_BACK: "5"
        run: node scripts/fetch-metrics.mjs

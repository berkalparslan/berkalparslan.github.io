<style>
/* Yalniz bu panele ait kucuk parcalar; ortak katmanda karsiligi yok. */
.rozet{display:inline-flex;gap:4px;flex-wrap:wrap}
.rozet .pill{font-size:10px;padding:1px 7px}
.pill.pro{background:var(--accent);color:var(--on-accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.sky{background:color-mix(in srgb,var(--sky) 14%,transparent);color:var(--sky)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.err{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
.nokta{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.kisi b{display:block;font-weight:700}
.kisi small{display:block;color:var(--soft);font-size:11px}
.kucukfoto{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--side);display:block}
.buyukfoto{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:var(--side);display:block;margin:4px 0 12px}
.yer-tutucu{display:flex;align-items:center;justify-content:center;font-size:18px}
.buyukfoto.yer-tutucu{height:180px;font-size:42px}
.gun-bas{font-size:12px;font-weight:800;color:var(--soft);margin:12px 0 2px;letter-spacing:.03em}
.ev.pw span:nth-child(2){color:var(--warn);font-weight:600}
.ev.buy span:nth-child(2){color:var(--ok);font-weight:700}
.ev.soc span:nth-child(2){color:var(--sky)}
.yorum{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.yorum div{flex:1;min-width:0;overflow-wrap:anywhere}
.yorum small{color:var(--soft);display:block}
.td-metin{white-space:normal!important;min-width:220px;max-width:420px}
</style>

<script type="module">
import { getFirestore, collection, collectionGroup, getDocs, getDoc, query, orderBy, limit, where, doc, documentId,
  deleteDoc, updateDoc, addDoc, setDoc, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {

  appId: "1:615635545520:web:99c8f154f221367f5e3a75",
  messagingSenderId: "615635545520",
};

const YONETICI = "aberkalparslan@gmail.com";
const SLUG = "leafbook";

/* Leafbook'un kendi renkleri (Leafbook/Theme.swift, android Theme.kt):
   accent 2E9E63, leaf 6FD08C, deep 1B5E3B, forest 0F3D27, soft DDF3E4, cream FBF7EE. */
const TEMA = {
  acik: { accent: "#2e9e63", onAccent: "#ffffff", bg: "#fbf7ee", card: "#ffffff", side: "#ddf3e4", line: "#e6e0d0", ink: "#0f3d27", soft: "#5c6e63" },
  koyu: { accent: "#6fd08c", onAccent: "#0f3d27", bg: "#08140d", card: "#0f2218", side: "#0f3d27", line: "#1d3a2a", ink: "#eef6f0", soft: "#9db5a6" },
};

// ── Sozlukler ─────────────────────────────────────────────────────────────
/* Ekran anahtarlari uygulamada sabit (RootView.tabScreens, RootScreen.kt). */
const EKRAN = {
  plants: "Bitkiler", care: "Bakım", community: "Topluluk", catalog: "Öğren", learn: "Öğren", settings: "Ayarlar",
  plant: "Bitki sayfası", paywall: "Paywall", rescue: "Kurtarma planı", add: "Bitki ekle", camera: "Kamera", closed: "Kapalı",
};
/* PaywallContext (iOS rawValue, Android name.lowercase); sayaclarda kucuk harf. */
const KAYNAK = {
  onboarding: "Tanıtım sonu", identify: "Tanıma limiti", plantlimit: "Bitki limiti", plant_limit: "Bitki limiti",
  reminders: "Hatırlatmalar", rescue: "Kurtarma planı", learn: "Öğren sorgusu", growth: "Büyüme raporu", settings: "Ayarlar", unknown: "Bilinmiyor",
};
const kaynakAdi = k => KAYNAK[String(k || "").toLowerCase()] || k || "Bilinmiyor";
/* Liste fiyati (USD), magazadaki temel fiyat. Gercek odenen tutar ulkeye ve
   denemeye gore degisir; bu yuzden her yerde "tahmini". */
const PLAN = {
  "com.aberk.leafbook.pro.monthly": { ad: "Aylık", usd: 2.99 }, "leafbook_pro_monthly": { ad: "Aylık", usd: 2.99 },
  "com.aberk.leafbook.pro.annual": { ad: "Yıllık", usd: 19.99, deneme: true }, "leafbook_pro_annual": { ad: "Yıllık", usd: 19.99, deneme: true },
  "com.aberk.leafbook.pro.lifetime": { ad: "Ömür boyu", usd: 39.99 }, "leafbook_pro_lifetime": { ad: "Ömür boyu", usd: 39.99 },
};
const planAdi = p => !p ? "" : PLAN[p]?.ad || String(p).split(/[._]/).pop();
const SAYAC = {
  installs_new: "Yeni kurulum", sessions: "Oturum", onboarding_done: "Tanıtım bitti", paywall_views: "Paywall açıldı",
  purchases: "Satın alma", plants_added: "Bitki eklendi", photos_taken: "Fotoğraf", identifications: "Tanıma",
  rescues_started: "Kurtarma planı", waterings: "Sulama", reminder_actions: "Bildirim düğmesi", shares: "Paylaşım",
  ai_requests: "AI isteği", ai_tokens_in: "AI giriş jetonu", ai_tokens_out: "AI çıkış jetonu", ai_blocked: "AI engellendi",
  ai_failed: "AI hatası", posts: "Toplulukta gönderi", nazars: "Nazar", comments: "Yorum", sign_ins: "Giriş",
};
const ALT = {
  water_: { care: "Bakım sekmesi", detail: "Bitki sayfası", notif: "Bildirim" },
  reminder_action_: { watered: "Suladım", damp: "Toprak nemli" },
  lookup_: { photo: "Fotoğrafla", name: "Adıyla" },
  identify_: { ai: "AI", local: "Cihazda" },
  share_link_: { create: "Bağlantı açıldı", stop: "Bağlantı kapatıldı" },
  post_: { plant: "Kendi bitkisi", free: "Serbest" },
  sign_in_: { apple: "Apple", google: "Google", email: "E-posta", email_new: "E-posta (yeni hesap)" },
  post_blocked_: { not_plant: "Bitki değil", person: "İnsan (cihazda)", unsafe: "Uygunsuz", text: "Yazı", error: "Kontrol edilemedi", offline: "Bağlantı yok" },
  comment_blocked_: { comment: "Uygunsuz yazı" },
  post_checked_: { on_device: "Cihazda (AI ulaşılamadı)" },
  rescue_start_: { overwatering: "Fazla su", underwatering: "Az su", lowlight: "Az ışık", dryair: "Kuru hava", pests: "Zararlı" },
  rescue_tailor_: { overwatering: "Fazla su", underwatering: "Az su", lowlight: "Az ışık", dryair: "Kuru hava", pests: "Zararlı" },
  plant_spot_: { indoor: "Ev içi", balcony: "Balkon", terrace: "Teras", garden: "Bahçe", greenhouse: "Sera" },
  push_permission_: { granted: "İzin verdi", denied: "Reddetti", not_now: "Şimdi değil" },
  growth_report_: { ok: "Rapor çıktı" },
};
const DIL = { tr: "Türkçe", en: "İngilizce", de: "Almanca", es: "İspanyolca", fr: "Fransızca", it: "İtalyanca", pt: "Portekizce", nl: "Felemenkçe",
  ru: "Rusça", ja: "Japonca", ko: "Korece", zh: "Çince", ar: "Arapça", pl: "Lehçe", sv: "İsveççe", id: "Endonezce", hi: "Hintçe" };
const ONLINE = 3 * 6e4;

// ── Durum ─────────────────────────────────────────────────────────────────
let db = null, K = null, veri = null;
const demo = new URLSearchParams(location.search).has("demo");
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => Number(v) || 0;
const toast = m => { const t = el("div", "toast"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

// ── Veri ──────────────────────────────────────────────────────────────────
const ZAMAN = ["firstSeen", "lastSeen", "purchasedAt"];
const iso = v => { const t = zaman(v); return t ? t.toISOString() : null; };
const belge = d => ({ id: d.id, ...d.data() });

async function oku(ad, f) { try { return await f(); } catch (e) { veri.hatalar[ad] = e.code || e.message; return []; } }

async function yukle(k) {
  K = k;
  if (!db && k.app) db = getFirestore(k.app);
  veri = { hatalar: {}, okuma: {} };
  if (demo) Object.assign(veri, sahte());
  else {
    const [installs, days, events, sales, posts, comments, nazars, reports, profiles, blocks, items, pushes] = await Promise.all([
      oku("installs", async () => (await getDocs(collection(db, "installs"))).docs.map(belge)),
      oku("stats", async () => (await getDocs(collection(db, "stats"))).docs.map(belge)),
      /* Butun kurulumlarin zaman cizelgesi tek sorguda (kural: {path=**}/events
         yoneticiye okunur). Belgeler kucuk; 90 gunluk TTL Blaze isteyene kadar
         birikiyor, o yuzden ust sinir var. */
      oku("events", async () => (await getDocs(query(collectionGroup(db, "events"), limit(8000)))).docs
        .map(d => ({ iid: d.ref.parent.parent.id, t: ms(d.data().t), e: d.data().e || "", p: d.data().p ?? null, s: d.data().s ?? null }))),
      oku("panel/sales", async () => { const d = await getDoc(doc(db, "panel", "sales")); return d.exists() ? d.data() : null; }),
      oku("posts", async () => (await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(1000)))).docs.map(belge)),
      oku("comments", async () => (await getDocs(query(collectionGroup(db, "comments"), limit(3000)))).docs.map(d => ({ ...belge(d), postId: d.ref.parent.parent.id }))),
      oku("nazar", async () => (await getDocs(query(collectionGroup(db, "nazar"), limit(5000)))).docs.map(d => ({ uid: d.id, postId: d.ref.parent.parent.id, createdAt: d.data().createdAt }))),
      oku("reports", async () => (await getDocs(query(collection(db, "reports"), orderBy("createdAt", "desc"), limit(1000)))).docs.map(belge)),
      oku("profiles", async () => (await getDocs(collection(db, "profiles"))).docs.map(belge)),
      oku("blocks", async () => (await getDocs(query(collectionGroup(db, "blocks"), limit(3000)))).docs.map(d => ({ by: d.ref.parent.parent.id, uid: d.id, createdAt: d.data().createdAt }))),
      oku("notifications", async () => (await getDocs(query(collectionGroup(db, "items"), limit(3000)))).docs.map(d => ({ ...belge(d), to: d.ref.parent.parent.id }))),
      oku("pushes", async () => (await getDocs(query(collection(db, "pushes"), orderBy("at", "desc"), limit(300)))).docs.map(d => ({ pid: d.id, ...d.data() }))),
    ]);
    Object.assign(veri, { installs, days, events, sales: Array.isArray(sales) ? null : sales, posts, comments, nazars, reports, profiles, blocks, items, pushes });
  }
  hazirla();
  const h = Object.keys(veri.hatalar);
  k.durum(`${demo ? "Demo veri · " : ""}${sayi(veri.installs.length)} kurulum, ${sayi(veri.days.length)} gün kaydı, ${sayi(veri.events.length)} olay, ${sayi(veri.posts.length)} gönderi` +
    (h.length ? ` · okunamayan: ${h.map(x => `${x} (${veri.hatalar[x]})`).join(", ")}` : ""));
}

/* Tek bicim: tarih alanlari ISO metin, olaylar ms ve sirali; profiller, kisi
   eslemeleri ve aktif gun kumeleri bir kez kurulur. */
function hazirla() {
  for (const i of veri.installs) {
    for (const a of ZAMAN) i[a] = iso(i[a]);
    i.ev = i.ev && typeof i.ev === "object" ? i.ev : {};
  }
  veri.events = (veri.events || []).filter(e => e.t).sort((a, b) => a.t - b.t);
  veri.days = (veri.days || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.id)).sort((a, b) => a.id < b.id ? -1 : 1);
  for (const a of ["posts", "comments", "nazars", "reports", "profiles", "blocks", "items", "pushes"]) veri[a] = veri[a] || [];
  veri.profil = new Map(veri.profiles.map(p => [p.id, p]));
  veri.kurulum = new Map(veri.installs.map(i => [i.id, i]));
  veri.uidKurulum = new Map();
  for (const i of veri.installs) if (i.uid) { if (!veri.uidKurulum.has(i.uid)) veri.uidKurulum.set(i.uid, []); veri.uidKurulum.get(i.uid).push(i); }
  /* push.js tek kisi secicisi i.handle'a bakar; Butun alanlar'da gorunmesin diye sayilamaz. */
  for (const i of veri.installs) {
    const p = i.uid && veri.profil.get(i.uid);
    Object.defineProperty(i, "handle", { value: p?.handle || "", enumerable: false, configurable: true });
    Object.defineProperty(i, "adSoyad", { value: p?.name || "", enumerable: false, configurable: true });
  }
  veri.olaylar = new Map();
  for (const e of veri.events) { if (!veri.olaylar.has(e.iid)) veri.olaylar.set(e.iid, []); veri.olaylar.get(e.iid).push(e); }
  veri.aktifGun = new Map();
  const ekle = (id, t) => { const g = istGun(t); if (!g) return; if (!veri.aktifGun.has(id)) veri.aktifGun.set(id, new Set()); veri.aktifGun.get(id).add(g); };
  for (const i of veri.installs) { ekle(i.id, i.firstSeen); ekle(i.id, i.lastSeen); }
  for (const e of veri.events) ekle(e.iid, e.t);
  const ilkler = [...veri.installs.map(i => ms(i.firstSeen)), ...veri.days.map(d => Date.parse(d.id + "T00:00:00+03:00"))].filter(Boolean);
  veri.ilk = ilkler.length ? Math.min(...ilkler) : Date.now() - 30 * 864e5;
  veri.raporSayisi = {};
  for (const r of veri.reports) veri.raporSayisi[r.postId] = (veri.raporSayisi[r.postId] || 0) + 1;
}

// ── Donem ve suzme ────────────────────────────────────────────────────────
const D = () => { const d = donem(K.aralik); if (!d.bas) d.bas = istGunBasi(veri.ilk); return d; };
const oncekiVar = d => d.oncekiBas != null;
const icinde = (t, b, s) => { const x = ms(t); return x >= b && x <= s; };
const fk = (simdi, once, ters) => once == null ? undefined : { simdi, once, ters };
const donemAdi = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
/* Kurulum bazli her sey secili surume gore; olaylar da kurulumun surumune gore. */
const I = () => surumSuz(veri.installs, K.surum);
const EV = () => !K.surum ? veri.events : veri.events.filter(e => veri.kurulum.get(e.iid)?.appVersion === K.surum);
const statsArasi = (b, s) => { const x = istGun(b), y = istGun(s); return veri.days.filter(d => d.id >= x && d.id <= y); };
const gP = () => { const d = D(); return statsArasi(d.bas, d.son); };
const gO = () => { const d = D(); return oncekiVar(d) ? statsArasi(d.oncekiBas, d.oncekiSon - 1) : null; };
const topla = (days, k) => (days || []).reduce((a, d) => a + n(d[k]), 0);
const evT = (days, k) => (days || []).reduce((a, d) => a + n(d.ev?.[k]), 0);
function evOnek(kaynak, onek) {
  const out = {};
  for (const d of kaynak || []) for (const [k, v] of Object.entries(d.ev || {})) {
    if (!k.startsWith(onek) || k.endsWith("_sec")) continue;
    const ad = k.slice(onek.length);
    if (!ad) continue;
    out[ad] = (out[ad] || 0) + n(v);
  }
  return out;
}
const adla = (h, onek) => Object.fromEntries(Object.entries(h).map(([k, v]) => [ALT[onek]?.[k] || k, v]));
function gunDizisi(d) { return gunleriDoldur({}, istGun(d.bas), istGun(d.son)).map(x => x.t); }
function statGunluk(alanlar) {
  const d = D(), h = Object.fromEntries(veri.days.map(x => [x.id, x]));
  return gunDizisi(d).map(t => { const o = { t }; for (const [ad, f] of Object.entries(alanlar)) o[ad] = f(h[t] || {}); return o; });
}
const SURUM_NOT = () => K.surum ? el("p", "muted", "Sürüm filtresi bu grafiğe uygulanmaz: günlük kayıtlar (stats) sürüme bölünmüyor.") : null;
const ham = (o, k) => n(o?.[k]);
const iev = (i, k) => n(i.ev?.[k]);
const online = i => i.screen && i.screen !== "closed" && Date.now() - ms(i.lastSeen) < ONLINE;
const ulasir = i => (typeof i.fcm === "string" ? i.fcm.length > 0 : !!i.fcm) && i.notif !== false;
const platAdi = p => p === "android" ? "Android" : p === "ios" ? "iOS" : p || "Bilinmiyor";
const yas = i => i.firstSeen ? Math.floor((Date.now() - ms(i.firstSeen)) / 864e5) : null;
const evet = b => b === true ? "Evet" : b === false ? "Hayır" : "Bilinmiyor";

function kisiAdi(i) {
  if (!i) return "";
  if (i.handle) return "@" + i.handle;
  if (i.adSoyad) return i.adSoyad;
  return i.id.slice(0, 8);
}
function profilAdi(uid) {
  const p = veri.profil.get(uid);
  return p?.handle ? "@" + p.handle : p?.name || (uid ? uid.slice(0, 8) : "");
}
function kisiHucre(i) {
  const k = el("span", "kisi");
  const b = el("b"); b.textContent = kisiAdi(i);
  const s = el("small"); s.textContent = i.handle ? (i.adSoyad || i.id.slice(0, 8)) : i.adSoyad ? i.id.slice(0, 8) : "anonim";
  k.append(b, s);
  return { d: k, s: kisiAdi(i).toLowerCase() };
}
function rozetler(i) {
  const r = el("span", "rozet");
  if (online(i)) r.appendChild(el("span", "pill ok", "Uygulamada"));
  if (i.pro) r.appendChild(el("span", "pill pro", "Pro"));
  if (i.signedIn) r.appendChild(el("span", "pill sky", "Hesap"));
  if (i.notif === true) r.appendChild(el("span", "pill", ulasir(i) ? "Bildirim" : "Bildirim (konu)"));
  if (i.tester) r.appendChild(el("span", "pill warn", "Test"));
  return { d: r, s: (online(i) ? 16 : 0) + (i.pro ? 8 : 0) + (i.signedIn ? 4 : 0) + (i.notif ? 2 : 0) };
}
function sonAralik(i) {
  const t = ms(i.lastSeen);
  if (!t) return "Bilinmiyor";
  if (t >= istGunBasi()) return "Bugün";
  const g = (Date.now() - t) / 864e5;
  return g <= 7 ? "Son 7 gün" : g <= 28 ? "Son 28 gün" : g <= 90 ? "Son 90 gün" : "90+ gün";
}
/* Kutuyu karta koyup DOM'a ekler, sonra cizer (grafik genisligi olcer). */
function gKart(ebeveyn, baslik, ciz, ...alt) {
  const kutu = el("div");
  const k = kart(baslik, kutu, ...alt.filter(Boolean));
  ebeveyn.appendChild(k);
  try { ciz(kutu); } catch (e) { console.error(e); kutu.appendChild(el("p", "muted", "Çizilemedi.")); }
  return k;
}
const izgara = (c, sinif = "izgara2") => { const g = el("div", sinif); c.appendChild(g); return g; };
const hataNotu = ad => veri.hatalar[ad] ? el("div", "note err", `${esc(ad)} okunamadı: ${esc(veri.hatalar[ad])}`) : null;

// ── Olay metni (zaman cizelgesi) ──────────────────────────────────────────
function olayMetni(e) {
  const p = e.p ?? "";
  const alt = (onek) => ALT[onek]?.[String(p).toLowerCase()] || p;
  switch (e.e) {
    case "screen": return `Ekran: ${EKRAN[p] || p}`;
    case "screen_time": return `Ekranda kaldı: ${EKRAN[p] || p}`;
    case "session": return "Oturum bitti";
    case "pw_view": return `Paywall açıldı · ${kaynakAdi(p)}`;
    case "pw_close": return `Paywall kapandı · ${kaynakAdi(p)}`;
    case "pw_close_bought": return `Paywall kapandı (aldı) · ${kaynakAdi(p)}`;

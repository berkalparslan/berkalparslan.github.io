<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="https://bamstudio.dev/assets/lab-icons/leafbook-64.png">
<link rel="apple-touch-icon" href="https://bamstudio.dev/assets/lab-icons/leafbook-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Leafbook Panel</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("bamtech-panel-tema"); } catch (e) { }
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="/lab/assets/panel.css?v=4">
</head>
<body>

<div id="login" class="card">
  <h1>Leafbook</h1>
  <p class="muted" id="loginNote">Panele Google hesabinla gir. Yalnizca yonetici e-postasi okuyabilir.</p>
  <p><button id="send">Google ile gir</button></p>
  <p class="muted" id="loginMsg"></p>
</div>

<div id="app" class="layout hidden">
  <aside>
    <div class="brand">Leafbook</div>
    <div class="sec">ANALIZ</div>
    <a href="#genel" data-p="genel">Genel bakis</a>
    <a href="#canli" data-p="canli">Canli</a>
    <a href="#ekranlar" data-p="ekranlar">Ekranlar</a>
    <a href="#paywall" data-p="paywall">Paywall ve satin alma</a>
    <a href="#kullanim" data-p="kullanim">Kullanim</a>
    <a href="#kullanicilar" data-p="kullanicilar">Kullanicilar</a>
    <a href="#satis" data-p="satis">Satis</a>
    <a href="#ai" data-p="ai">Yapay zeka</a>
    <a href="#analytics" data-p="analytics">Veri sagligı</a>
    <div class="sec">TOPLULUK</div>
    <a href="#topluluk" data-p="topluluk">Gonderiler</a>
    <a href="#raporlar" data-p="raporlar">Raporlar</a>
    <div class="sec">YONET</div>
    <a href="#bildirim" data-p="bildirim">Bildirim gonder</a>
    <a href="#ayarlar" data-p="ayarlar">Ayarlar</a>
    <div style="flex:1"></div>
    <button class="ghost" id="tema">Tema</button>
    <button class="ghost" id="cikis">Cikis</button>
  </aside>

  <main>
    <div class="top">
      <strong id="baslik">Genel bakis</strong>
      <span class="grow"></span>
      <button class="ghost range" data-d="1">Bugun</button>
      <button class="ghost range on" data-d="7">7 gun</button>
      <button class="ghost range" data-d="30">30 gun</button>
      <button class="ghost range" data-d="90">90 gun</button>
      <button class="ghost" id="yenile">Yenile</button>
    </div>
    <div id="icerik"></div>
    <p class="muted" id="durum"></p>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, query, orderBy, limit, where, doc, documentId, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { $, el, sayi, sure, gun, tarih, zaman, ms, yuzde, para, kart, tiles, veriTablo, dagilimTablo }
  from "/lab/assets/panel.js?v=4";
import { pushSayfasi } from "/lab/assets/push.js?v=1";

const firebaseConfig = {
  apiKey: "AIzaSyADKB3iVGvc8DnXRtUAOHKhBQZ6yU77GX8",
  authDomain: "leafbook-bamtech.firebaseapp.com",
  projectId: "leafbook-bamtech",
  appId: "1:615635545520:web:99c8f154f221367f5e3a75",
  messagingSenderId: "615635545520",
};

/* Ekran anahtarlari uygulamada sabit; burada yalnizca etiketleri degisir.
   Yeni ekran eklendiginde bu haritaya da bir satir gir. */
const EKRAN = {
  plants: "Bitkiler", care: "Bakim", catalog: "Ogren", learn: "Ogren", settings: "Ayarlar",
  plant: "Bitki sayfasi", paywall: "Paywall", rescue: "Kurtarma plani",
  add: "Bitki ekle", camera: "Kamera", closed: "Kapali",
};
const PAYWALL_KAYNAK = {
  onboarding: "Tanitim sonu", identify: "Tanima limiti", plantlimit: "Bitki limiti",
  plant_limit: "Bitki limiti", reminders: "Hatirlatmalar", rescue: "Kurtarma plani",
  learn: "Ogren sorgusu", settings: "Ayarlar",
};
const SAYAC = {
  installs_new: "Yeni kurulum", sessions: "Oturum", onboarding_done: "Tanitim bitti",
  paywall_views: "Paywall acildi", purchases: "Satin alma",
  plants_added: "Bitki eklendi", photos_taken: "Fotograf", identifications: "Tanima",
  rescues_started: "Kurtarma plani", waterings: "Sulama", reminder_actions: "Bildirim dugmesi",
  shares: "Paylasim", ai_requests: "AI istegi", ai_tokens_in: "AI giris jetonu",
  ai_tokens_out: "AI cikis jetonu", ai_blocked: "AI engellendi", ai_failed: "AI hatasi",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const demo = new URLSearchParams(location.search).has("demo");



let aralik = 7;
let sayfa = location.hash.slice(1) || "genel";
let veri = null;

// Giris

$("#send").onclick = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    $("#loginMsg").textContent = e.message;
  }
};

/* Asil kapi Firestore kurallari: okuma yalnizca bu e-postaya acik, baska
   hicbir hesap tek bir belge bile okuyamaz. Buradaki kontrol ikinci katman:
   yetkisiz biri giris yaparsa bos/kirik panel yerine acik bir mesaj gorsun. */
const YONETICI = "aberkalparslan@gmail.com";

onAuthStateChanged(auth, user => {
  if (demo) {
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    yukle();
    return;
  }
  if (user && user.email === YONETICI && user.emailVerified) {
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    yukle();
  } else if (user) {
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
    $("#loginMsg").textContent = "Bu panel yalnizca yoneticiye acik.";
    signOut(auth);
  } else {
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
  }
});

$("#cikis").onclick = () => signOut(auth);
$("#tema").onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("bamtech-panel-tema", t);
};
document.querySelectorAll(".range").forEach(b => b.onclick = () => {
  aralik = Number(b.dataset.d);
  document.querySelectorAll(".range").forEach(x => x.classList.toggle("on", x === b));
  yukle();
});
$("#yenile").onclick = () => yukle();
addEventListener("hashchange", () => { sayfa = location.hash.slice(1) || "genel"; ciz(); });

// Veri

/* Firestore zaman alanlari Timestamp nesnesi olarak gelir; `new Date(...)`
   icine girince "Invalid Date" olur ve filtrelerde sessizce NaN'a doner.
   Kapida bir kez ISO metne ceviriyoruz, icerisi tek bir bicim goruyor. */
const ZAMAN_ALANLARI = ["firstSeen", "lastSeen", "purchasedAt"];

async function kurulumlar() {
  const out = [];
  const snap = await getDocs(collection(db, "installs"));
  snap.forEach(d => {
    const kayit = { id: d.id, ...d.data() };
    for (const alan of ZAMAN_ALANLARI) {
      const t = zaman(kayit[alan]);
      kayit[alan] = t ? t.toISOString() : null;
    }
    out.push(kayit);
  });
  return out;
}

async function gunler() {
  const bugun = new Date();
  const ilk = new Date(bugun.getTime() - (aralik - 1) * 86400000);
  const snap = await getDocs(query(collection(db, "stats"),
    where(documentId(), ">=", gun(ilk)), where(documentId(), "<=", gun(bugun)), orderBy(documentId())));
  const out = [];
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

function sahte() {
  const bugun = new Date();
  const days = [...Array(aralik)].map((_, i) => {
    const d = new Date(bugun.getTime() - (aralik - 1 - i) * 86400000);
    return { id: gun(d), installs_new: 2 + (i % 4), sessions: 18 + i * 3, plants_added: 3 + (i % 5),
             photos_taken: 2 + (i % 3), paywall_views: 4 + (i % 3), purchases: i % 5 === 0 ? 1 : 0,
             waterings: 9 + i, rescues_started: i % 4 === 0 ? 1 : 0, identifications: 2 + (i % 3),
             onboarding_done: 1 + (i % 2), shares: i % 3, reminder_actions: i % 4,
             ai_requests: 5 + i, ai_tokens_in: 900 + i * 40, ai_tokens_out: 300 + i * 15, ai_failed: i % 6 === 0 ? 1 : 0,
             ev: { pw_view_onboarding: 3, pw_view_rescue: 2, pw_buy_rescue: i % 5 === 0 ? 1 : 0,
                   screen_plants: 9, screen_care: 4, screen_plant: 6, screen_paywall: 2,
                   screen_plants_sec: 420, screen_care_sec: 160, screen_plant_sec: 300, screen_paywall_sec: 55,
                   screen_time_plants_sec: 420, water_care: 7, water_detail: 3,
                   lookup_photo: 2, lookup_name: 1, identify_ai: 2, identify_local: 1,
                   share_link_create: i % 3 === 0 ? 1 : 0, plant_added_monstera: 2, plant_added_custom: 1,
                   ai_requests: 5 } };
  });
  const now = Date.now();
  const installs = [...Array(26)].map((_, i) => ({
    id: "demo-" + i, platform: i % 3 ? "ios" : "android", region: ["TR", "US", "DE", "GB"][i % 4],
    appVersion: i % 5 ? "1.1" : "1.0", language: i % 2 ? "tr" : "en",
    firstSeen: new Date(now - i * 86400000 * 1.5).toISOString(),
    lastSeen: new Date(now - (i < 4 ? i * 60000 : i * 3600000)).toISOString(),
    screen: i < 4 ? ["plants", "plant", "care", "paywall"][i] : "closed",
    pro: i % 7 === 0, plan: i % 7 === 0 ? "annual" : null, buySource: i % 7 === 0 ? "rescue" : null,
    n_plants: 1 + (i % 6), n_photos: i % 9, n_rescues: i % 5 === 0 ? 1 : 0, n_with_light: i % 3,
    sessions: 3 + i, waterings: i, ev: { screen_plants_sec: 200 + i * 9, screen_care_sec: 60 + i * 3 },
  }));
  return { days, installs };
}

async function yukle() {
  satisBelge = undefined;
  $("#durum").textContent = "Yukleniyor...";
  try {
    veri = demo ? sahte() : { days: await gunler(), installs: await kurulumlar() };
    $("#durum").textContent = demo ? "Demo veri" : `${veri.installs.length} kurulum, ${veri.days.length} gun`;
  } catch (e) {
    $("#durum").textContent = "Hata: " + e.message;
    veri = { days: [], installs: [] };
  }
  ciz();
}

// Yardimcilar

const topla = (days, key) => days.reduce((a, d) => a + (Number(d[key]) || 0), 0);
const evTopla = (days, onek) => {
  const out = {};
  for (const d of days) for (const [k, v] of Object.entries(d.ev || {})) {
    if (k.startsWith(onek)) { const ad = k.slice(onek.length); out[ad] = (out[ad] || 0) + Number(v); }
  }
  return out;
};

// Sayfalar

function ciz() {
  document.querySelectorAll("aside a").forEach(a => a.classList.toggle("on", a.dataset.p === sayfa));
  const c = $("#icerik");
  c.innerHTML = "";
  if (!veri) return;
  const ad = { genel: "Genel bakis", canli: "Canli", ekranlar: "Ekranlar", paywall: "Paywall ve satin alma",
               kullanim: "Kullanim", kullanicilar: "Kullanicilar", satis: "Satis", ai: "Yapay zeka",
               analytics: "Veri sagligi", topluluk: "Gonderiler", raporlar: "Raporlar",
               bildirim: "Bildirim gonder", ayarlar: "Ayarlar" }[sayfa] || "Genel bakis";
  $("#baslik").textContent = ad;
  ({ genel, canli, ekranlar, paywall, kullanim, kullanicilar, satis, ai, analytics,
     topluluk, raporlar, bildirim, ayarlar }[sayfa] || genel)(c);
}

function genel(c) {
  const { days, installs } = veri;
  const now = Date.now();
  const aktif = installs.filter(i => now - ms(i.lastSeen) < aralik * 86400000);
  const pro = installs.filter(i => i.pro).length;
  c.appendChild(tiles([
    ["Kurulum", sayi(installs.length), "toplam"],
    ["Aktif", sayi(aktif.length), `son ${aralik} gun`],
    ["Yeni kurulum", sayi(topla(days, "installs_new")), `son ${aralik} gun`],
    ["Oturum", sayi(topla(days, "sessions"))],
    ["Pro", sayi(pro), installs.length ? `%${Math.round(pro / installs.length * 100)}` : ""],
    ["Bitki eklendi", sayi(topla(days, "plants_added"))],
    ["Sulama", sayi(topla(days, "waterings"))],
    ["Kurtarma plani", sayi(topla(days, "rescues_started"))],
  ]));
  const en = Math.max(1, ...days.map(d => Number(d.sessions) || 0));
  const grafik = el("div");
  days.forEach(d => {
    const satir = el("div");
    satir.style.cssText = "display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;padding:3px 0";
    satir.appendChild(el("span", "muted", d.id.slice(5)));
    const bar = el("div", "bar");
    bar.style.width = `${Math.round((Number(d.sessions) || 0) / en * 100)}%`;
    const kutu = el("div"); kutu.appendChild(bar);
    satir.appendChild(kutu);
    satir.appendChild(el("span", "muted", sayi(d.sessions)));
    grafik.appendChild(satir);
  });
  c.appendChild(kart("Gunluk oturum", grafik));
  /* Elimizde yalnizca ilk ve son gorulme var, gun gun oturum yok. Yani bu
     "kurdu ve N gun sonra hala aciyordu" demek, klasik D1/D7 degil. Yakin
     bir vekil ve arkadaslara dagitirken bakilacak ilk sey. */
  const kal = [1, 7, 30].map(n => {
    const uygun = installs.filter(i => i.firstSeen && Date.now() - ms(i.firstSeen) >= n * 86400000);
    const kalan = uygun.filter(i => ms(i.lastSeen) - ms(i.firstSeen) >= n * 86400000);
    return [`${n}. gun`, uygun.length ? `%${Math.round(kalan.length / uygun.length * 100)}` : "-", `${kalan.length}/${uygun.length}`];
  });
  c.appendChild(kart("Kalicilik", veriTablo(["Kurulumdan sonra", { ad: "Hala acan", num: true }, { ad: "Kurulum", num: true }], kal, { ara: false, kopyala: false })));
  const platform = {};
  installs.forEach(i => platform[i.platform || "?"] = (platform[i.platform || "?"] || 0) + 1);
  const bolge = {};
  installs.forEach(i => bolge[i.region || "?"] = (bolge[i.region || "?"] || 0) + 1);
  const surum = {};
  installs.forEach(i => surum[i.appVersion || "?"] = (surum[i.appVersion || "?"] || 0) + 1);
  /* iOS telemetrisi 1.1 ile geliyor. Magazadaki surum 1.0 oldugu surece
     buradaki herkes Android, ve bu bos bir panel gibi gorunuyor. */
  if (installs.length && !installs.some(i => i.platform === "ios")) {
    c.appendChild(kart(null, el("p", "muted",
      "Hic iOS kurulumu yok. Telemetri iOS'ta 1.1 ile basliyor; App Store'da 1.1 yayilana kadar buradaki herkes Android.")));
  }
  const grid = el("div"); grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px";
  for (const [ad, harita] of [["Platform", platform], ["Bolge", bolge], ["Surum", surum]]) {
    grid.appendChild(kart(ad, dagilimTablo(harita, [ad, "Kurulum"], { kopyala: false })));
  }
  c.appendChild(grid);
}

function canli(c) {
  const now = Date.now();
  const acik = veri.installs
    .filter(i => i.screen && i.screen !== "closed" && now - ms(i.lastSeen) < 3 * 60000)
    .sort((a, b) => ms(b.lastSeen) - ms(a.lastSeen));
  c.appendChild(kart(`Su an uygulamada: ${acik.length}`,
    veriTablo(["Kurulum", { ad: "Ekran", filtre: true }, { ad: "Platform", filtre: true }, { ad: "Bitki", num: true }, "Son"],
      acik.map(i => [i.id.slice(0, 8), EKRAN[i.screen] || i.screen, i.platform || "", sayi(i.n_plants),
                     { d: tarih(i.lastSeen), s: ms(i.lastSeen) }]),
      { sirala: [4, "desc"], bos: "Simdi kimse yok. Son 3 dakikada kalp atisi gonderen kurulum sayiliyor." })));
  const son = veri.installs.slice().sort((a, b) => ms(b.lastSeen) - ms(a.lastSeen)).slice(0, 25);
  c.appendChild(kart("Son gorulenler", veriTablo(
    ["Kurulum", { ad: "Son ekran", filtre: true }, { ad: "Platform", filtre: true }, "Son"],
    son.map(i => [i.id.slice(0, 8), EKRAN[i.lastScreen || i.screen] || i.lastScreen || "", i.platform || "",
                  { d: tarih(i.lastSeen), s: ms(i.lastSeen) }]),
    { sirala: [3, "desc"] })));
}

function ekranlar(c) {
  const sn = {}, giris = {};
  for (const d of veri.days) for (const [k, v] of Object.entries(d.ev || {})) {
    if (k.startsWith("screen_time")) continue;
    let m = k.match(/^screen_(.+)_sec$/);
    if (m) { sn[m[1]] = (sn[m[1]] || 0) + Number(v); continue; }
    m = k.match(/^screen_(.+)$/);
    if (m && !k.endsWith("_sec") && !k.startsWith("screen_time")) giris[m[1]] = (giris[m[1]] || 0) + Number(v);
  }
  const adlar = [...new Set([...Object.keys(sn), ...Object.keys(giris)])]
    .sort((a, b) => (sn[b] || 0) - (sn[a] || 0));
  c.appendChild(kart("Ekranda gecen sure",
    veriTablo(["Ekran", { ad: "Acilis", num: true }, { ad: "Toplam", num: true }, { ad: "Acilis basina", num: true }],
        adlar.map(a => [EKRAN[a] || a, sayi(giris[a]), { d: sure(sn[a]), s: sn[a] || 0 },
                        { d: giris[a] ? sure((sn[a] || 0) / giris[a]) : "", s: giris[a] ? (sn[a] || 0) / giris[a] : 0 }]),
        { sirala: [2, "desc"], bos: "Henuz ekran verisi yok." })));
}

function paywall(c) {
  const kaynak = {}, satin = {}, saniye = {};
  for (const d of veri.days) for (const [k, v] of Object.entries(d.ev || {})) {
    let m = k.match(/^pw_view_(.+?)(_sec)?$/);
    if (m && !m[2]) kaynak[m[1]] = (kaynak[m[1]] || 0) + Number(v);
    m = k.match(/^pw_buy_(.+?)(_sec)?$/);
    if (m && !m[2]) satin[m[1]] = (satin[m[1]] || 0) + Number(v);
    m = k.match(/^pw_close_(.+?)_sec$/);
    if (m) saniye[m[1]] = (saniye[m[1]] || 0) + Number(v);
  }
  const acilis = topla(veri.days, "paywall_views"), alim = topla(veri.days, "purchases");
  c.appendChild(tiles([
    ["Paywall acildi", sayi(acilis)],
    ["Satin alma", sayi(alim)],
    ["Donusum", acilis ? `%${(alim / acilis * 100).toFixed(1)}` : "0"],
  ]));
  const adlar = [...new Set([...Object.keys(kaynak), ...Object.keys(satin)])];
  c.appendChild(kart("Nereden acildi",
    veriTablo(["Kaynak", { ad: "Acilis", num: true }, { ad: "Satin alma", num: true }, { ad: "Donusum", num: true }],
        adlar.map(a => [PAYWALL_KAYNAK[a] || a, sayi(kaynak[a]), sayi(satin[a]),
                        { d: kaynak[a] ? yuzde(satin[a] || 0, kaynak[a], 1) : "", s: kaynak[a] ? (satin[a] || 0) / kaynak[a] : 0 }]),
        { sirala: [1, "desc"], bos: "Henuz paywall verisi yok." })));
  const planlar = {};
  veri.installs.filter(i => i.pro).forEach(i => planlar[i.plan || "?"] = (planlar[i.plan || "?"] || 0) + 1);
  c.appendChild(kart("Pro kurulumlar", dagilimTablo(planlar, ["Plan", "Kurulum"])));
}

function kullanim(c) {
  const satirlar = Object.entries(SAYAC)
    .filter(([k]) => !k.startsWith("ai_"))
    .map(([k, ad]) => [ad, sayi(topla(veri.days, k))]);
  c.appendChild(kart(`Son ${aralik} gun`, veriTablo(["Olay", { ad: "Adet", num: true }], satirlar, { sirala: [1, "desc"] })));
  const toplamBitki = veri.installs.reduce((a, i) => a + (Number(i.n_plants) || 0), 0);
  const isikli = veri.installs.reduce((a, i) => a + (Number(i.n_with_light) || 0), 0);
  c.appendChild(tiles([
    ["Kayitli bitki", sayi(toplamBitki), "tum kurulumlar"],
    ["Fotograf", sayi(veri.installs.reduce((a, i) => a + (Number(i.n_photos) || 0), 0))],
    ["Isigi secilmis bitki", sayi(isikli), toplamBitki ? `%${Math.round(isikli / toplamBitki * 100)}` : ""],
    ["Kurulum basina bitki", veri.installs.length ? (toplamBitki / veri.installs.length).toFixed(1) : "0"],
  ]));
  const dagilim = (onek, baslik, adlar = {}) => {
    const h = evTopla(veri.days, onek);
    const satirlar = Object.entries(h).filter(([k]) => !k.endsWith("_sec") && k)
      .sort((a, b) => b[1] - a[1]).map(([k, v]) => [adlar[k] || k, sayi(v)]);
    c.appendChild(kart(baslik, veriTablo(["Yer", { ad: "Adet", num: true }], satirlar,
      { sirala: [1, "desc"], bos: "Henuz kayit yok." })));
  };
  dagilim("water_", "Sulama nereden", { care: "Bakim sekmesi", detail: "Bitki sayfasi", notif: "Bildirim" });
  dagilim("lookup_", "Ogren sorgulari", { photo: "Fotografla", name: "Adiyla" });
  dagilim("identify_", "Tanima", { ai: "AI", local: "Cihazda" });

/* Kurulum listesi. Kolon filtreleri ve arama tablonun kendi isi; burada
   yalnizca turetilmis iki suzgec kaliyor (Pro, son gorulme). */
const kf = { pro: "", son: "" };
function kSonOk(i, v) {
  if (!v) return true;
  const t = ms(i.lastSeen), d = Number(v);
  if (d < 0) return t < Date.now() - 30 * 86400000;
  if (d === 1) { const g = new Date(); g.setHours(0, 0, 0, 0); return t >= g.getTime(); }
  return t >= Date.now() - d * 86400000;
}
function kullanicilar(c) {
  const hepsi = veri.installs;
  const bar = el("div", "bar2");
  const sabit = (k, html) => {
    const s = el("select");
    s.style.width = "auto";
    s.innerHTML = html;
    s.value = kf[k];
    s.onchange = () => { kf[k] = s.value; ciz2(); };
    bar.appendChild(s);
  };
  sabit("pro", '<option value="">Pro: hepsi</option><option value="1">Pro</option><option value="0">Pro olmayan</option>');
  sabit("son", '<option value="">Son gorulme: hepsi</option><option value="1">Bugun</option><option value="7">Son 7 gun</option><option value="30">Son 30 gun</option><option value="-30">30+ gun sessiz</option>');
  const kutu = el("div");
  c.appendChild(bar);
  c.appendChild(kutu);
  function ciz2() {
    const liste = hepsi.filter(i => (!kf.pro || !!i.pro === (kf.pro === "1")) && kSonOk(i, kf.son));
    kutu.innerHTML = "";
    kutu.appendChild(kart(null, veriTablo(
      ["Kurulum", { ad: "Platform", filtre: true }, { ad: "Surum", filtre: true }, { ad: "Bolge", filtre: true },
       { ad: "Dil", filtre: true }, { ad: "Bitki", num: true }, { ad: "Fotograf", num: true }, "Pro", "Son gorulme"],
      liste.map(i => [i.id.slice(0, 8), i.platform || "", i.appVersion || "", i.region || "", i.language || "",
                      sayi(i.n_plants), sayi(i.n_photos), i.pro ? "evet" : "",
                      { d: tarih(i.lastSeen), s: ms(i.lastSeen) }]),
      { sirala: [8, "desc"], araYazi: "Ara: kurulum, surum, bolge, dil",
        bos: "Bu suzgece uyan kurulum yok.",
        satirTik: satir => {
          const kisa = String(satir[0]);
          const kurulum = liste.find(i => i.id.slice(0, 8) === kisa);
          if (kurulum) cekmece(kurulum);
        } })));
  }
  ciz2();
}

async function cekmece(install) {
  const d = el("div", "drawer");
  const inner = el("div", "inner");
  d.appendChild(inner);
  d.onclick = e => { if (e.target === d) d.remove(); };
  inner.appendChild(el("h1", null, install.id.slice(0, 8)));
  inner.appendChild(el("p", "muted", [install.platform, install.appVersion, install.region, install.language]
    .filter(Boolean).join(" · ")));
  inner.appendChild(tiles([
    ["Bitki", sayi(install.n_plants)], ["Fotograf", sayi(install.n_photos)],
    ["Kurtarma", sayi(install.n_rescues)], ["Oturum", sayi(install.sessions)],
    ["Pro", install.pro ? "evet" : "hayir", install.buySource || ""],
  ]));
  inner.appendChild(el("p", "muted", `Ilk: ${tarih(install.firstSeen)} · Son: ${tarih(install.lastSeen)}`));
  const liste = el("div");
  liste.appendChild(el("p", "muted", "Zaman cizelgesi yukleniyor..."));
  inner.appendChild(kart("Zaman cizelgesi", liste));
  document.body.appendChild(d);
  if (demo) { liste.innerHTML = "<p class='muted'>Demo modunda cizelge yok.</p>"; return; }
  try {
    const snap = await getDocs(query(collection(db, "installs", install.id, "events"), orderBy("t", "desc"), limit(120)));
    liste.innerHTML = "";
    if (snap.empty) liste.appendChild(el("p", "muted", "Kayit yok."));
    snap.forEach(doc => {
      const e = doc.data();
      const satir = el("div", "ev");
      satir.appendChild(el("span", "t", tarih(e.t)));
      satir.appendChild(el("span", null, `${e.e}${e.p ? " · " + (EKRAN[e.p] || PAYWALL_KAYNAK[e.p] || e.p) : ""}`));
      satir.appendChild(el("span", "muted", e.s ? sure(e.s) : ""));
      liste.appendChild(satir);
    });
  } catch (err) {
    liste.innerHTML = `<p class="muted">Hata: ${err.message}</p>`;
  }
}

  }

/* Gonderiler ve raporlar Firestore'dan dogrudan okunur; kurallar yoneticiye
   silme izni veriyor. Gonderiyi silmek nazarlarini, yorumlarini ve iki
   fotograf kopyasini da siler, geri alinamaz. */
async function gonderileriOku(n = 100) {
  const snap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(n)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function gonderiSil(id) {
  for (const alt of ["nazar", "comments"]) {
    const s = await getDocs(query(collection(db, "posts", id, alt), limit(300)));
    await Promise.all(s.docs.map(d => deleteDoc(d.ref)));
  }
  await Promise.all([
    deleteDoc(doc(db, "postPhotos", id)).catch(() => {}),
    deleteDoc(doc(db, "postThumbs", id)).catch(() => {}),
  ]);
  await deleteDoc(doc(db, "posts", id));
}

function topluluk(c) {
  const kutu = el("div");
  c.appendChild(kutu);
  kutu.appendChild(el("p", "muted", "Yukleniyor..."));

  gonderileriOku().then(liste => {
    kutu.textContent = "";
    const nazar = liste.reduce((t, p) => t + (p.nazarCount || 0), 0);
    const yorum = liste.reduce((t, p) => t + (p.commentCount || 0), 0);
    const kisi = new Set(liste.map(p => p.authorUid)).size;
    kutu.appendChild(tiles([
      ["Gonderi", sayi(liste.length)],
      ["Paylasan", sayi(kisi)],
      ["Nazar", sayi(nazar)],
      ["Yorum", sayi(yorum)],
    ]));
    kutu.appendChild(kart("Gonderiler", veriTablo(
      ["Zaman", { ad: "Kisi", filtre: true }, "Bitki", "Metin",
       { ad: "Nazar", num: true }, { ad: "Yorum", num: true }, ""],
      liste.map(p => {
        const t = zaman(p.createdAt) || new Date(0);
        return [
          { d: tarih(t.toISOString()), s: t.getTime() },
          p.authorHandle ? "@" + p.authorHandle : (p.authorName || ""),
          p.speciesName || p.plantName || "",
          (p.text || "").slice(0, 90),
          p.nazarCount || 0,
          p.commentCount || 0,
          silDugmesi(p, () => topluluk(c)),
        ];
      }),
      { sirala: [0, "desc"], bos: "Henuz gonderi yok." },
    )));
  }).catch(e => { kutu.textContent = ""; kutu.appendChild(kart("Gonderiler", el("p", "muted", "Okunamadi: " + e.message))); });
}

function silDugmesi(p, sonra) {
  const b = el("button", "ghost", "Sil");
  b.onclick = async () => {
    if (!confirm("Gonderi, nazarlari, yorumlari ve fotograflari silinsin mi? Geri alinamaz.")) return;
    b.disabled = true; b.textContent = "Siliniyor...";
    try { await gonderiSil(p.id); sonra(); }
    catch (e) { b.disabled = false; b.textContent = "Sil"; alert(e.message); }
  };
  return b;
}

function raporlar(c) {
  const kutu = el("div");
  c.appendChild(kutu);
  kutu.appendChild(el("p", "muted", "Yukleniyor..."));

  Promise.all([
    getDocs(query(collection(db, "reports"), orderBy("createdAt", "desc"), limit(100))),
    gonderileriOku(200),
  ]).then(([snap, gonderiler]) => {
    const harita = new Map(gonderiler.map(p => [p.id, p]));
    const liste = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    kutu.textContent = "";
    kutu.appendChild(el("p", "muted",
      "Bildiren kisi raporu atinca o kisiyi kendisi icin zaten gizliyor. Burasi gonderinin " +
      "herkes icin kalkmasi gerekip gerekmedigine bakilan yer. Silinmis gonderinin raporu " +
      "\"gonderi yok\" der."));
    kutu.appendChild(veriTablo(
      ["Zaman", { ad: "Sebep", filtre: true }, "Gonderi", "Yazar", { ad: "Nazar", num: true }, ""],
      liste.map(r => {
        const t = zaman(r.createdAt) || new Date(0);
        const p = harita.get(r.postId);
        return [
          { d: tarih(t.toISOString()), s: t.getTime() },
          r.reason || "",
          p ? (p.text || p.speciesName || "(fotograf)").slice(0, 70) : "gonderi yok",
          p ? (p.authorHandle ? "@" + p.authorHandle : p.authorName || "") : "",
          p ? (p.nazarCount || 0) : "",
          p ? silDugmesi(p, () => raporlar(c)) : "",
        ];
      }),
      { sirala: [0, "desc"], bos: "Hic rapor gelmemis." },
    ));
  }).catch(e => { kutu.textContent = ""; kutu.appendChild(el("p", "muted", "Okunamadi: " + e.message)); });
}

/* Bildirim sayfasi ortak katmandan gelir; burada yalnizca bu uygulamanin
   adresi, dilleri ve sekmeleri tarif edilir. Diger paneller de ayni modulu
   kullanir, o yuzden kullanimi her yerde aynidir. */
const PUSH_URL = "https://leafbook-push.kittapcom.workers.dev";

function bildirim(c) {
  pushSayfasi(c, {
    worker: PUSH_URL,
    token: () => auth.currentUser.getIdToken(),
    diller: ["en", "tr", "de", "es", "fr", "it", "pt", "nl", "ru", "ja", "ko", "zh", "ar", "pl", "sv", "id"],
    sekmeler: [
      { id: "plants", ad: "Bitkiler" },
      { id: "care", ad: "Bakim" },
      { id: "community", ad: "Topluluk" },
      { id: "learn", ad: "Ogren" },
      { id: "notifications", ad: "Bildirim kutusu" },
    ],
    gecmis: async () => {
      const snap = await getDocs(query(collection(db, "pushes"), orderBy("at", "desc"), limit(50)));
      return snap.docs.map(d => ({ pid: d.id, ...d.data(), at: zamana(d.data().at), sendAt: zamana(d.data().sendAt) }));
    },
  });
}

/* Firestore zaman damgasi -> ISO; tablo ve tarih() ikisini de anliyor. */
function zamana(v) {
  if (!v) return null;
  return typeof v.toDate === "function" ? v.toDate().toISOString() : v;
}

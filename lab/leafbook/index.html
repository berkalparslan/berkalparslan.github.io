<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="https://bamstudio.dev/assets/lab-icons/leafbook-64.png">
<link rel="apple-touch-icon" href="https://bamstudio.dev/assets/lab-icons/leafbook-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Leafbook Panel</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("bamtech-panel-tema"); } catch (e) { }
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root{color-scheme:light;--bg:#f2f6f3;--card:#fff;--ink:#14181a;--soft:#5f6670;--line:#e0e6e2;--accent:#2e9e63;--on-accent:#fff;--rose:#d6455d;--ok:#2e9e63;--warn:#c77d00;--sky:#0a6fe0;--side:#e7f1ea}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0e0c;--card:#151916;--ink:#f1f4f2;--soft:#a0a8a3;--line:#262b27;--accent:#4ade80;--on-accent:#06281a;--rose:#ff6f88;--ok:#4ade80;--warn:#f5b53c;--sky:#5aa8ff;--side:#101512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0e0c;--card:#151916;--ink:#f1f4f2;--soft:#a0a8a3;--line:#262b27;--accent:#4ade80;--on-accent:#06281a;--rose:#ff6f88;--ok:#4ade80;--warn:#f5b53c;--sky:#5aa8ff;--side:#101512}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--soft);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;min-width:0}
input,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line);padding:6px 12px;font-size:12px}
button.ghost.on{color:var(--ink);border-color:var(--accent)}
.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto;padding:22px}
.layout{display:flex;min-height:100vh}
aside{width:210px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
aside .brand{font-weight:800;font-size:17px;margin:0 8px 16px}
aside .sec{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--soft);margin:14px 8px 6px}
aside a{display:block;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px}
aside a.on{background:var(--card);font-weight:700}
main{flex:1;padding:22px;max-width:1150px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top .grow{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-size:24px;line-height:1.2}
.tile span{font-size:12px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--soft);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--side);color:var(--soft)}
.pill.live{background:var(--accent);color:var(--on-accent)}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;justify-content:flex-end;z-index:20}
.drawer .inner{width:min(520px,100%);background:var(--bg);height:100%;overflow:auto;padding:20px}
.ev{display:grid;grid-template-columns:120px 1fr auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ev .t{color:var(--soft);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="login" class="card">
  <h1>Leafbook</h1>
  <p class="muted" id="loginNote">Panele Google hesabinla gir. Yalnizca yonetici e-postasi okuyabilir.</p>
  <p><button id="send">Google ile gir</button></p>
  <p class="muted" id="loginMsg"></p>
</div>

<div id="app" class="layout hidden">
  <aside>
    <div class="brand">Leafbook</div>
    <div class="sec">ANALIZ</div>
    <a href="#genel" data-p="genel">Genel bakis</a>
    <a href="#canli" data-p="canli">Canli</a>
    <a href="#ekranlar" data-p="ekranlar">Ekranlar</a>
    <a href="#paywall" data-p="paywall">Paywall ve satin alma</a>
    <a href="#kullanim" data-p="kullanim">Kullanim</a>
    <a href="#kullanicilar" data-p="kullanicilar">Kullanicilar</a>
    <a href="#ai" data-p="ai">Yapay zeka</a>
    <a href="#analytics" data-p="analytics">Analytics</a>
    <div class="sec">YONET</div>
    <a href="#bildirim" data-p="bildirim">Bildirim gonder</a>
    <a href="#ayarlar" data-p="ayarlar">Ayarlar</a>
    <div style="flex:1"></div>
    <button class="ghost" id="tema">Tema</button>
    <button class="ghost" id="cikis">Cikis</button>
  </aside>

  <main>
    <div class="top">
      <strong id="baslik">Genel bakis</strong>
      <span class="grow"></span>
      <button class="ghost range" data-d="1">Bugun</button>
      <button class="ghost range on" data-d="7">7 gun</button>
      <button class="ghost range" data-d="30">30 gun</button>
      <button class="ghost range" data-d="90">90 gun</button>
      <button class="ghost" id="yenile">Yenile</button>
    </div>
    <div id="icerik"></div>
    <p class="muted" id="durum"></p>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, limit, where, doc, documentId }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADKB3iVGvc8DnXRtUAOHKhBQZ6yU77GX8",
  authDomain: "leafbook-bamtech.firebaseapp.com",
  projectId: "leafbook-bamtech",
  appId: "1:615635545520:web:99c8f154f221367f5e3a75",
  messagingSenderId: "615635545520",
};

/* Ekran anahtarlari uygulamada sabit; burada yalnizca etiketleri degisir.
   Yeni ekran eklendiginde bu haritaya da bir satir gir. */
const EKRAN = {
  plants: "Bitkiler", care: "Bakim", catalog: "Ogren", learn: "Ogren", settings: "Ayarlar",
  plant: "Bitki sayfasi", paywall: "Paywall", rescue: "Kurtarma plani",
  add: "Bitki ekle", camera: "Kamera", closed: "Kapali",
};
const PAYWALL_KAYNAK = {
  onboarding: "Tanitim sonu", identify: "Tanima limiti", plantlimit: "Bitki limiti",
  plant_limit: "Bitki limiti", reminders: "Hatirlatmalar", rescue: "Kurtarma plani",
  learn: "Ogren sorgusu", settings: "Ayarlar",
};
const SAYAC = {
  installs_new: "Yeni kurulum", sessions: "Oturum", onboarding_done: "Tanitim bitti",
  paywall_views: "Paywall acildi", purchases: "Satin alma",
  plants_added: "Bitki eklendi", photos_taken: "Fotograf", identifications: "Tanima",
  rescues_started: "Kurtarma plani", waterings: "Sulama", reminder_actions: "Bildirim dugmesi",
  shares: "Paylasim", ai_requests: "AI istegi", ai_tokens_in: "AI giris jetonu",
  ai_tokens_out: "AI cikis jetonu", ai_blocked: "AI engellendi", ai_failed: "AI hatasi",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const demo = new URLSearchParams(location.search).has("demo");

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const sayi = n => (n == null ? "0" : Number(n).toLocaleString("tr-TR"));
const sure = s => s == null ? "" : s >= 3600 ? `${Math.round(s / 360) / 10} sa` : s >= 60 ? `${Math.round(s / 6) / 10} dk` : `${Math.round(s)} sn`;
const gun = d => d.toISOString().slice(0, 10);
const tarih = v => v ? new Date(v).toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

let aralik = 7;
let sayfa = location.hash.slice(1) || "genel";
let veri = null;

// Giris

$("#send").onclick = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    $("#loginMsg").textContent = e.message;
  }
};

/* Asil kapi Firestore kurallari: okuma yalnizca bu e-postaya acik, baska
   hicbir hesap tek bir belge bile okuyamaz. Buradaki kontrol ikinci katman:
   yetkisiz biri giris yaparsa bos/kirik panel yerine acik bir mesaj gorsun. */
const YONETICI = "aberkalparslan@gmail.com";

onAuthStateChanged(auth, user => {
  if (demo) {
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    yukle();
    return;
  }
  if (user && user.email === YONETICI && user.emailVerified) {
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    yukle();
  } else if (user) {
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
    $("#loginMsg").textContent = "Bu panel yalnizca yoneticiye acik.";
    signOut(auth);
  } else {
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
  }
});

$("#cikis").onclick = () => signOut(auth);
$("#tema").onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("bamtech-panel-tema", t);
};
document.querySelectorAll(".range").forEach(b => b.onclick = () => {
  aralik = Number(b.dataset.d);
  document.querySelectorAll(".range").forEach(x => x.classList.toggle("on", x === b));
  yukle();
});
$("#yenile").onclick = () => yukle();
addEventListener("hashchange", () => { sayfa = location.hash.slice(1) || "genel"; ciz(); });

// Veri

async function kurulumlar() {
  const out = [];
  const snap = await getDocs(collection(db, "installs"));
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

async function gunler() {
  const bugun = new Date();
  const ilk = new Date(bugun.getTime() - (aralik - 1) * 86400000);
  const snap = await getDocs(query(collection(db, "stats"),
    where(documentId(), ">=", gun(ilk)), where(documentId(), "<=", gun(bugun)), orderBy(documentId())));
  const out = [];
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

function sahte() {
  const bugun = new Date();
  const days = [...Array(aralik)].map((_, i) => {
    const d = new Date(bugun.getTime() - (aralik - 1 - i) * 86400000);
    return { id: gun(d), installs_new: 2 + (i % 4), sessions: 18 + i * 3, plants_added: 3 + (i % 5),
             photos_taken: 2 + (i % 3), paywall_views: 4 + (i % 3), purchases: i % 5 === 0 ? 1 : 0,
             waterings: 9 + i, rescues_started: i % 4 === 0 ? 1 : 0, identifications: 2 + (i % 3),
             onboarding_done: 1 + (i % 2), shares: i % 3, reminder_actions: i % 4,
             ai_requests: 5 + i, ai_tokens_in: 900 + i * 40, ai_tokens_out: 300 + i * 15, ai_failed: i % 6 === 0 ? 1 : 0,
             ev: { pw_view_onboarding: 3, pw_view_rescue: 2, pw_buy_rescue: i % 5 === 0 ? 1 : 0,
                   screen_plants: 9, screen_care: 4, screen_plant: 6, screen_paywall: 2,
                   screen_plants_sec: 420, screen_care_sec: 160, screen_plant_sec: 300, screen_paywall_sec: 55,
                   screen_time_plants_sec: 420, water_care: 7, water_detail: 3,
                   lookup_photo: 2, lookup_name: 1, identify_ai: 2, identify_local: 1,
                   share_link_create: i % 3 === 0 ? 1 : 0, plant_added_monstera: 2, plant_added_custom: 1,
                   ai_requests: 5 } };
  });
  const now = Date.now();
  const installs = [...Array(26)].map((_, i) => ({
    id: "demo-" + i, platform: i % 3 ? "ios" : "android", region: ["TR", "US", "DE", "GB"][i % 4],
    appVersion: i % 5 ? "1.1" : "1.0", language: i % 2 ? "tr" : "en",
    firstSeen: new Date(now - i * 86400000 * 1.5).toISOString(),
    lastSeen: new Date(now - (i < 4 ? i * 60000 : i * 3600000)).toISOString(),
    screen: i < 4 ? ["plants", "plant", "care", "paywall"][i] : "closed",
    pro: i % 7 === 0, plan: i % 7 === 0 ? "annual" : null, buySource: i % 7 === 0 ? "rescue" : null,
    n_plants: 1 + (i % 6), n_photos: i % 9, n_rescues: i % 5 === 0 ? 1 : 0, n_with_light: i % 3,
    sessions: 3 + i, waterings: i, ev: { screen_plants_sec: 200 + i * 9, screen_care_sec: 60 + i * 3 },
  }));
  return { days, installs };
}

async function yukle() {
  $("#durum").textContent = "Yukleniyor...";
  try {
    veri = demo ? sahte() : { days: await gunler(), installs: await kurulumlar() };
    $("#durum").textContent = demo ? "Demo veri" : `${veri.installs.length} kurulum, ${veri.days.length} gun`;
  } catch (e) {
    $("#durum").textContent = "Hata: " + e.message;
    veri = { days: [], installs: [] };
  }
  ciz();
}

// Yardimcilar

const topla = (days, key) => days.reduce((a, d) => a + (Number(d[key]) || 0), 0);
const evTopla = (days, onek) => {
  const out = {};
  for (const d of days) for (const [k, v] of Object.entries(d.ev || {})) {
    if (k.startsWith(onek)) { const ad = k.slice(onek.length); out[ad] = (out[ad] || 0) + Number(v); }
  }
  return out;
};

function tablo(basliklar, satirlar) {
  const t = el("table");
  const head = el("tr");
  basliklar.forEach((b, i) => head.appendChild(el("th", i ? "num" : "", b)));
  t.appendChild(head);
  for (const s of satirlar) {
    const tr = el("tr");
    s.forEach((c, i) => tr.appendChild(el("td", i ? "num" : "", c)));
    t.appendChild(tr);
  }
  return t;
}

function kart(baslik, ...cocuklar) {
  const c = el("div", "card");
  if (baslik) c.appendChild(el("h2", null, baslik));
  cocuklar.forEach(x => x && c.appendChild(x));
  return c;
}

function tiles(pairs) {
  const wrap = el("div", "tiles");
  for (const [ad, deger, alt] of pairs) {
    const t = el("div", "tile");
    t.appendChild(el("b", null, deger));
    t.appendChild(el("span", null, alt ? `${ad} · ${alt}` : ad));
    wrap.appendChild(t);
  }
  return wrap;
}

// Sayfalar

function ciz() {
  document.querySelectorAll("aside a").forEach(a => a.classList.toggle("on", a.dataset.p === sayfa));
  const c = $("#icerik");
  c.innerHTML = "";
  if (!veri) return;
  const ad = { genel: "Genel bakis", canli: "Canli", ekranlar: "Ekranlar", paywall: "Paywall ve satin alma",
               kullanim: "Kullanim", kullanicilar: "Kullanicilar", ai: "Yapay zeka", analytics: "Analytics",
               bildirim: "Bildirim gonder", ayarlar: "Ayarlar" }[sayfa] || "Genel bakis";
  $("#baslik").textContent = ad;
  ({ genel, canli, ekranlar, paywall, kullanim, kullanicilar, ai, analytics, bildirim, ayarlar }[sayfa] || genel)(c);
}

function genel(c) {
  const { days, installs } = veri;
  const now = Date.now();
  const aktif = installs.filter(i => now - new Date(i.lastSeen || 0).getTime() < aralik * 86400000);
  const pro = installs.filter(i => i.pro).length;
  c.appendChild(tiles([
    ["Kurulum", sayi(installs.length), "toplam"],
    ["Aktif", sayi(aktif.length), `son ${aralik} gun`],
    ["Yeni kurulum", sayi(topla(days, "installs_new")), `son ${aralik} gun`],
    ["Oturum", sayi(topla(days, "sessions"))],
    ["Pro", sayi(pro), installs.length ? `%${Math.round(pro / installs.length * 100)}` : ""],
    ["Bitki eklendi", sayi(topla(days, "plants_added"))],
    ["Sulama", sayi(topla(days, "waterings"))],
    ["Kurtarma plani", sayi(topla(days, "rescues_started"))],
  ]));
  const en = Math.max(1, ...days.map(d => Number(d.sessions) || 0));
  const grafik = el("div");
  days.forEach(d => {
    const satir = el("div");
    satir.style.cssText = "display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;padding:3px 0";
    satir.appendChild(el("span", "muted", d.id.slice(5)));
    const bar = el("div", "bar");
    bar.style.width = `${Math.round((Number(d.sessions) || 0) / en * 100)}%`;
    const kutu = el("div"); kutu.appendChild(bar);
    satir.appendChild(kutu);
    satir.appendChild(el("span", "muted", sayi(d.sessions)));
    grafik.appendChild(satir);
  });
  c.appendChild(kart("Gunluk oturum", grafik));
  /* Elimizde yalnizca ilk ve son gorulme var, gun gun oturum yok. Yani bu
     "kurdu ve N gun sonra hala aciyordu" demek, klasik D1/D7 degil. Yakin
     bir vekil ve arkadaslara dagitirken bakilacak ilk sey. */
  const kal = [1, 7, 30].map(n => {
    const uygun = installs.filter(i => i.firstSeen && Date.now() - new Date(i.firstSeen).getTime() >= n * 86400000);
    const kalan = uygun.filter(i => new Date(i.lastSeen || 0) - new Date(i.firstSeen) >= n * 86400000);
    return [`${n}. gun`, uygun.length ? `%${Math.round(kalan.length / uygun.length * 100)}` : "-", `${kalan.length}/${uygun.length}`];
  });
  c.appendChild(kart("Kalicilik", tablo(["Kurulumdan sonra", "Hala acan", "Kurulum"], kal)));
  const platform = {};
  installs.forEach(i => platform[i.platform || "?"] = (platform[i.platform || "?"] || 0) + 1);
  const bolge = {};
  installs.forEach(i => bolge[i.region || "?"] = (bolge[i.region || "?"] || 0) + 1);
  const surum = {};
  installs.forEach(i => surum[i.appVersion || "?"] = (surum[i.appVersion || "?"] || 0) + 1);
  /* iOS telemetrisi 1.1 ile geliyor. Magazadaki surum 1.0 oldugu surece
     buradaki herkes Android, ve bu bos bir panel gibi gorunuyor. */
  if (installs.length && !installs.some(i => i.platform === "ios")) {
    c.appendChild(kart(null, el("p", "muted",
      "Hic iOS kurulumu yok. Telemetri iOS'ta 1.1 ile basliyor; App Store'da 1.1 yayilana kadar buradaki herkes Android.")));
  }
  const grid = el("div"); grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px";
  for (const [ad, harita] of [["Platform", platform], ["Bolge", bolge], ["Surum", surum]]) {
    grid.appendChild(kart(ad, tablo([ad, "Kurulum"], Object.entries(harita).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, sayi(v)]))));
  }
  c.appendChild(grid);
}

function canli(c) {
  const now = Date.now();
  const acik = veri.installs
    .filter(i => i.screen && i.screen !== "closed" && now - new Date(i.lastSeen || 0).getTime() < 3 * 60000)
    .sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));
  c.appendChild(kart(`Su an uygulamada: ${acik.length}`,
    acik.length ? tablo(["Kurulum", "Ekran", "Platform", "Bitki", "Son"],
      acik.map(i => [i.id.slice(0, 8), EKRAN[i.screen] || i.screen, i.platform || "", sayi(i.n_plants), tarih(i.lastSeen)]))
      : el("p", "muted", "Simdi kimse yok. Son 3 dakikada kalp atisi gonderen kurulum sayiliyor.")));
  const son = veri.installs.slice().sort((a, b) => new Date(b.lastSeen || 0) - new Date(a.lastSeen || 0)).slice(0, 25);
  c.appendChild(kart("Son gorulenler", tablo(["Kurulum", "Son ekran", "Platform", "Son"],
    son.map(i => [i.id.slice(0, 8), EKRAN[i.lastScreen || i.screen] || i.lastScreen || "", i.platform || "", tarih(i.lastSeen)]))));
}

function ekranlar(c) {
  const sn = {}, giris = {};
  for (const d of veri.days) for (const [k, v] of Object.entries(d.ev || {})) {
    if (k.startsWith("screen_time")) continue;
    let m = k.match(/^screen_(.+)_sec$/);
    if (m) { sn[m[1]] = (sn[m[1]] || 0) + Number(v); continue; }
    m = k.match(/^screen_(.+)$/);
    if (m && !k.endsWith("_sec") && !k.startsWith("screen_time")) giris[m[1]] = (giris[m[1]] || 0) + Number(v);
  }
  const adlar = [...new Set([...Object.keys(sn), ...Object.keys(giris)])]
    .sort((a, b) => (sn[b] || 0) - (sn[a] || 0));
  c.appendChild(kart("Ekranda gecen sure", adlar.length
    ? tablo(["Ekran", "Acilis", "Toplam", "Acilis basina"],
        adlar.map(a => [EKRAN[a] || a, sayi(giris[a]), sure(sn[a]), giris[a] ? sure((sn[a] || 0) / giris[a]) : ""]))
    : el("p", "muted", "Henuz ekran verisi yok.")));
}

function paywall(c) {
  const kaynak = {}, satin = {}, saniye = {};
  for (const d of veri.days) for (const [k, v] of Object.entries(d.ev || {})) {
    let m = k.match(/^pw_view_(.+?)(_sec)?$/);
    if (m && !m[2]) kaynak[m[1]] = (kaynak[m[1]] || 0) + Number(v);
    m = k.match(/^pw_buy_(.+?)(_sec)?$/);
    if (m && !m[2]) satin[m[1]] = (satin[m[1]] || 0) + Number(v);
    m = k.match(/^pw_close_(.+?)_sec$/);
    if (m) saniye[m[1]] = (saniye[m[1]] || 0) + Number(v);
  }
  const acilis = topla(veri.days, "paywall_views"), alim = topla(veri.days, "purchases");
  c.appendChild(tiles([
    ["Paywall acildi", sayi(acilis)],
    ["Satin alma", sayi(alim)],
    ["Donusum", acilis ? `%${(alim / acilis * 100).toFixed(1)}` : "0"],
  ]));
  const adlar = [...new Set([...Object.keys(kaynak), ...Object.keys(satin)])];
  c.appendChild(kart("Nereden acildi", adlar.length
    ? tablo(["Kaynak", "Acilis", "Satin alma", "Donusum"],
        adlar.sort((a, b) => (kaynak[b] || 0) - (kaynak[a] || 0)).map(a =>
          [PAYWALL_KAYNAK[a] || a, sayi(kaynak[a]), sayi(satin[a]),
           kaynak[a] ? `%${((satin[a] || 0) / kaynak[a] * 100).toFixed(1)}` : ""]))
    : el("p", "muted", "Henuz paywall verisi yok.")));
  const planlar = {};
  veri.installs.filter(i => i.pro).forEach(i => planlar[i.plan || "?"] = (planlar[i.plan || "?"] || 0) + 1);
  c.appendChild(kart("Pro kurulumlar", tablo(["Plan", "Kurulum"],
    Object.entries(planlar).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, sayi(v)]))));
}

function kullanim(c) {
  const satirlar = Object.entries(SAYAC)
    .filter(([k]) => !k.startsWith("ai_"))
    .map(([k, ad]) => [ad, sayi(topla(veri.days, k))]);
  c.appendChild(kart(`Son ${aralik} gun`, tablo(["Olay", "Adet"], satirlar)));
  const toplamBitki = veri.installs.reduce((a, i) => a + (Number(i.n_plants) || 0), 0);
  const isikli = veri.installs.reduce((a, i) => a + (Number(i.n_with_light) || 0), 0);
  c.appendChild(tiles([
    ["Kayitli bitki", sayi(toplamBitki), "tum kurulumlar"],
    ["Fotograf", sayi(veri.installs.reduce((a, i) => a + (Number(i.n_photos) || 0), 0))],
    ["Isigi secilmis bitki", sayi(isikli), toplamBitki ? `%${Math.round(isikli / toplamBitki * 100)}` : ""],
    ["Kurulum basina bitki", veri.installs.length ? (toplamBitki / veri.installs.length).toFixed(1) : "0"],
  ]));
  const dagilim = (onek, baslik, adlar = {}) => {
    const h = evTopla(veri.days, onek);
    const satirlar = Object.entries(h).filter(([k]) => !k.endsWith("_sec") && k)
      .sort((a, b) => b[1] - a[1]).map(([k, v]) => [adlar[k] || k, sayi(v)]);
    c.appendChild(kart(baslik, satirlar.length ? tablo(["Yer", "Adet"], satirlar)
      : el("p", "muted", "Henuz kayit yok.")));
  };
  dagilim("water_", "Sulama nereden", { care: "Bakim sekmesi", detail: "Bitki sayfasi", notif: "Bildirim" });
  dagilim("lookup_", "Ogren sorgulari", { photo: "Fotografla", name: "Adiyla" });
  dagilim("identify_", "Tanima", { ai: "AI", local: "Cihazda" });
  dagilim("share_link_", "Paylasim baglantisi", { create: "Olusturuldu", stop: "Durduruldu" });
  /* plant_added'in parametresi tur kimligi; katalog burada yok, kimlik yeterince
     okunur. "custom" katalogda olmayan bitki, "shared" baglantiyla gelen. */
  const turler = evTopla(veri.days, "plant_added_");
  const enCok = Object.entries(turler).filter(([k]) => !k.endsWith("_sec") && k)
    .sort((a, b) => b[1] - a[1]).slice(0, 12);
  c.appendChild(kart("En cok eklenen tur", enCok.length
    ? tablo(["Tur", "Adet"], enCok.map(([k, v]) => [k === "custom" ? "Katalog disi" : k === "shared" ? "Baglantiyla gelen" : k, sayi(v)]))
    : el("p", "muted", "Henuz kayit yok.")));
}

const kf = { q: "", platform: "", appVersion: "", region: "", language: "", pro: "", son: "" };
function kSonOk(i, v) {
  if (!v) return true;
  const t = new Date(i.lastSeen || 0).getTime(), d = Number(v);
  if (d < 0) return t < Date.now() - 30 * 86400000;
  if (d === 1) { const g = new Date(); g.setHours(0, 0, 0, 0); return t >= g.getTime(); }
  return t >= Date.now() - d * 86400000;
}
function kullanicilar(c) {
  const hepsi = veri.installs.slice().sort((a, b) => new Date(b.lastSeen || 0) - new Date(a.lastSeen || 0));
  const bar = el("div", "kfiltre");
  bar.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px";
  const ara = el("input"); ara.placeholder = "Ara: kurulum, surum, bolge, dil"; ara.value = kf.q; ara.style.maxWidth = "260px";
  bar.appendChild(ara);
  const secim = (k, ad, adla = v => v) => {
    const s = el("select"); s.style.width = "auto";
    const say = {}; hepsi.forEach(i => { const v = i[k]; if (v) say[v] = (say[v] || 0) + 1; });
    s.innerHTML = `<option value="">${ad}: hepsi</option>` + Object.entries(say).sort((a, b) => b[1] - a[1])
      .map(([v, n]) => `<option value="${String(v).replace(/"/g, "&quot;")}">${adla(v)} (${n})</option>`).join("");
    if (!say[kf[k]]) kf[k] = "";
    s.value = kf[k]; s.onchange = () => { kf[k] = s.value; ciz2(); };
    bar.appendChild(s);
  };
  secim("platform", "Platform", v => v === "ios" ? "iOS" : v === "android" ? "Android" : v);
  secim("appVersion", "Surum"); secim("region", "Bolge"); secim("language", "Dil");
  const sabit = (k, html) => { const s = el("select"); s.style.width = "auto"; s.innerHTML = html; s.value = kf[k]; s.onchange = () => { kf[k] = s.value; ciz2(); }; bar.appendChild(s); };
  sabit("pro", '<option value="">Pro: hepsi</option><option value="1">Pro</option><option value="0">Pro olmayan</option>');
  sabit("son", '<option value="">Son gorulme: hepsi</option><option value="1">Bugun</option><option value="7">Son 7 gun</option><option value="30">Son 30 gun</option><option value="-30">30+ gun sessiz</option>');
  const kutu = el("div");
  c.appendChild(bar); c.appendChild(kutu);
  ara.oninput = () => { kf.q = ara.value; ciz2(); };
  function ciz2() {
    const q = kf.q.trim().toLowerCase();
    const liste = hepsi.filter(i => (!kf.platform || i.platform === kf.platform) && (!kf.appVersion || i.appVersion === kf.appVersion)
      && (!kf.region || i.region === kf.region) && (!kf.language || i.language === kf.language)
      && (!kf.pro || !!i.pro === (kf.pro === "1")) && kSonOk(i, kf.son)
      && (!q || [i.id, i.platform, i.appVersion, i.region, i.language].join(" ").toLowerCase().includes(q)));
    kutu.innerHTML = "";
    const t = tablo(["Kurulum", "Platform", "Surum", "Bolge", "Bitki", "Pro", "Son gorulme"],
      liste.map(i => [i.id.slice(0, 8), i.platform || "", i.appVersion || "", i.region || "",
                      sayi(i.n_plants), i.pro ? "evet" : "", tarih(i.lastSeen)]));
    [...t.querySelectorAll("tr")].slice(1).forEach((tr, idx) => {
      tr.style.cursor = "pointer";
      tr.onclick = () => cekmece(liste[idx]);
    });
    kutu.appendChild(kart(`${liste.length} / ${hepsi.length} kurulum`, t));

  }
  ciz2();
}

async function cekmece(install) {
  const d = el("div", "drawer");
  const inner = el("div", "inner");
  d.appendChild(inner);
  d.onclick = e => { if (e.target === d) d.remove(); };
  inner.appendChild(el("h1", null, install.id.slice(0, 8)));
  inner.appendChild(el("p", "muted", [install.platform, install.appVersion, install.region, install.language]
    .filter(Boolean).join(" · ")));
  inner.appendChild(tiles([
    ["Bitki", sayi(install.n_plants)], ["Fotograf", sayi(install.n_photos)],
    ["Kurtarma", sayi(install.n_rescues)], ["Oturum", sayi(install.sessions)],
    ["Pro", install.pro ? "evet" : "hayir", install.buySource || ""],
  ]));
  inner.appendChild(el("p", "muted", `Ilk: ${tarih(install.firstSeen)} · Son: ${tarih(install.lastSeen)}`));
  const liste = el("div");
  liste.appendChild(el("p", "muted", "Zaman cizelgesi yukleniyor..."));
  inner.appendChild(kart("Zaman cizelgesi", liste));
  document.body.appendChild(d);
  if (demo) { liste.innerHTML = "<p class='muted'>Demo modunda cizelge yok.</p>"; return; }
  try {
    const snap = await getDocs(query(collection(db, "installs", install.id, "events"), orderBy("t", "desc"), limit(120)));
    liste.innerHTML = "";
    if (snap.empty) liste.appendChild(el("p", "muted", "Kayit yok."));
    snap.forEach(doc => {
      const e = doc.data();
      const satir = el("div", "ev");
      satir.appendChild(el("span", "t", tarih(e.t?.toDate ? e.t.toDate() : e.t)));
      satir.appendChild(el("span", null, `${e.e}${e.p ? " · " + (EKRAN[e.p] || PAYWALL_KAYNAK[e.p] || e.p) : ""}`));
      satir.appendChild(el("span", "muted", e.s ? sure(e.s) : ""));
      liste.appendChild(satir);
    });
  } catch (err) {
    liste.innerHTML = `<p class="muted">Hata: ${err.message}</p>`;
  }
}

function ai(c) {
  const istek = topla(veri.days, "ai_requests");
  c.appendChild(tiles([
    ["AI istegi", sayi(istek)],
    ["Giris jetonu", sayi(topla(veri.days, "ai_tokens_in"))],
    ["Cikis jetonu", sayi(topla(veri.days, "ai_tokens_out"))],
    ["Hata", sayi(topla(veri.days, "ai_failed"))],
  ]));
  const giris = topla(veri.days, "ai_tokens_in"), cikis = topla(veri.days, "ai_tokens_out");
  /* Gemini Flash Lite liste fiyati: 1M giris jetonu 0,10 $, 1M cikis 0,40 $.
     Fiyat degisirse burayi guncelle; panel baska hicbir yerde fiyat tutmuyor. */
  const dolar = giris / 1e6 * 0.10 + cikis / 1e6 * 0.40;
  c.appendChild(tiles([
    ["Tahmini maliyet", "$" + dolar.toFixed(2), `son ${aralik} gun`],
    ["Istek basina", istek ? "$" + (dolar / istek).toFixed(4) : "0"],
    ["Engellendi", sayi(topla(veri.days, "ai_blocked"))],
    ["Hata orani", istek ? `%${(topla(veri.days, "ai_failed") / istek * 100).toFixed(1)}` : "0"],
  ]));
  c.appendChild(kart("Nerede kullaniliyor", tablo(["Yer", "Ne yapiyor"], [
    ["Tanima", "Fotograftan tur onerisi"],
    ["Ogren", "Senin olmayan bir bitki icin saha rehberi sayfasi"],
    ["Bitki sayfasi", "Bilinmesi gerekenler"],
    ["Buyume", "Iki fotografi karsilastiran rapor"],
  ])));
  c.appendChild(kart(null, el("p", "muted",
    "Sayaclar her Gemini cagrisinda artiyor: istek, jeton, engellenen ve hatali. Istemler ve fotograflar gonderilmiyor, yalnizca sayilar.")));
}

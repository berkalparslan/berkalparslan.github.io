  bloodPressure: "blood_pressure", weight: "weight", hydration: "hydration", sleep: "sleep" };
const VARSAYILAN_MODUL = "bloodPressure,medication,moles";
const moduller = i => String(i?.modules || "").split(",").map(s => s.trim()).filter(Boolean);
/* App/Duo.swift Posture; ev anahtarinda kucuk harf (halfopen). */

  hydration_logged: "Su kaydı", sleep_logged: "Uyku kaydı", medication_created: "İlaç eklendi", medication_dosemarked: "Doz işaretlendi",
  coach_started: "Rehber başladı", coach_acted: "Rehberde adım", coach_completed: "Rehber bitti", coach_skipped: "Rehber atlandı",
  health_connected: "Sağlık'a bağlandı", health_imported: "Sağlık'tan aktarım",
};
const SAYAC = {
  installs_new: "Yeni kurulum", sessions: "Oturum", onboarding_done: "Tanıtım bitti", paywall_views: "Paywall açıldı",
  purchases: "Satın alma", entries: "Kayıt (hepsi)", moles_added: "Ben eklendi", mole_photos: "Ben fotoğrafı",
  mole_checks: "ABCDE kontrolü", reports: "PDF rapor", reminder_actions: "Hatırlatmaya cevap", duo_sessions: "Duo açıkken oturum",
};
const DIL = { tr: "Türkçe", en: "İngilizce", de: "Almanca", es: "İspanyolca", fr: "Fransızca", it: "İtalyanca", pt: "Portekizce", nl: "Felemenkçe",
  ru: "Rusça", ja: "Japonca", ko: "Korece", zh: "Çince", ar: "Arapça", pl: "Lehçe", sv: "İsveççe", id: "Endonezce", hi: "Hintçe", uk: "Ukraynaca",
  vi: "Vietnamca", th: "Tayca", da: "Danca", nb: "Norveççe", fi: "Fince", cs: "Çekçe", el: "Yunanca", ro: "Romence", hu: "Macarca" };
const ONLINE = 3 * 6e4;

// ── Durum ─────────────────────────────────────────────────────────────────
let db = null, K = null, veri = null;
const demo = new URLSearchParams(location.search).has("demo");
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => Number(v) || 0;

// ── Veri ──────────────────────────────────────────────────────────────────
const ZAMAN = ["firstSeen", "lastSeen", "purchasedAt"];
const iso = v => { const t = zaman(v); return t ? t.toISOString() : null; };
const belge = d => ({ id: d.id, ...d.data() });

async function oku(ad, f) { try { return await f(); } catch (e) { veri.hatalar[ad] = e.code || e.message; return []; } }

async function yukle(k) {
  K = k;
  if (!db && k.app) db = getFirestore(k.app);
  veri = { hatalar: {} };
  if (demo) Object.assign(veri, sahte());
  else {
    const [installs, days, events] = await Promise.all([
      oku(KOL.installs, async () => (await getDocs(collection(db, KOL.installs))).docs.map(belge)),
      oku(KOL.stats, async () => (await getDocs(collection(db, KOL.stats))).docs.map(belge)),
      /* Butun kurulumlarin zaman cizelgesi tek sorguda (kural {path=**}/bb_events
         yoneticiye okunur). 90 gunluk TTL Blaze istiyor; o zamana dek ust sinir. */
      oku(KOL.events, async () => (await getDocs(query(collectionGroup(db, KOL.events), limit(10000)))).docs
        .map(d => ({ iid: d.ref.parent.parent.id, t: ms(d.data().t), e: d.data().e || "", p: d.data().p ?? null, s: d.data().s ?? null }))),
    ]);
    Object.assign(veri, { installs, days, events });
  }
  hazirla();
  const h = Object.keys(veri.hatalar);
  k.durum(`${demo ? "Demo veri · " : ""}${sayi(veri.installs.length)} kurulum, ${sayi(veri.days.length)} gün kaydı, ${sayi(veri.events.length)} olay` +
    (h.length ? ` · okunamayan: ${h.map(x => `${x} (${veri.hatalar[x]})`).join(", ")}` : ""));
}

function hazirla() {
  for (const i of veri.installs) {
    for (const a of ZAMAN) i[a] = iso(i[a]);
    i.ev = i.ev && typeof i.ev === "object" ? i.ev : {};
  }
  veri.events = (veri.events || []).filter(e => e.t).sort((a, b) => a.t - b.t);
  veri.days = (veri.days || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.id)).sort((a, b) => a.id < b.id ? -1 : 1);
  veri.kurulum = new Map(veri.installs.map(i => [i.id, i]));
  veri.olaylar = new Map();
  for (const e of veri.events) { if (!veri.olaylar.has(e.iid)) veri.olaylar.set(e.iid, []); veri.olaylar.get(e.iid).push(e); }
  veri.aktifGun = new Map();
  const ekle = (id, t) => { const g = istGun(t); if (!g) return; if (!veri.aktifGun.has(id)) veri.aktifGun.set(id, new Set()); veri.aktifGun.get(id).add(g); };
  for (const i of veri.installs) { ekle(i.id, i.firstSeen); ekle(i.id, i.lastSeen); }
  for (const e of veri.events) ekle(e.iid, e.t);
  const ilkler = [...veri.installs.map(i => ms(i.firstSeen)), ...veri.days.map(d => Date.parse(d.id + "T00:00:00+03:00"))].filter(Boolean);
  veri.ilk = ilkler.length ? Math.min(...ilkler) : Date.now() - 30 * 864e5;
  /* Her satin alma: "pw_buy" olayi (kaynak, saniye). Plan: ayni anki pro_purchased
     (urun kimligi) ya da hemen onceki pw_tap_buy; ikisi de yoksa kurulumun plan alani. */
  veri.alimlar = [];
  for (const [iid, l] of veri.olaylar) {
    for (const e of l) {
      if (e.e !== "pw_buy") continue;
      const pp = l.find(x => x.e === "pro_purchased" && Math.abs(x.t - e.t) < 15e3);
      const tap = l.filter(x => x.e === "pw_tap_buy" && x.t <= e.t + 2e3 && e.t - x.t < 30 * 6e4).pop();
      const plan = planKey(pp?.p || tap?.p || veri.kurulum.get(iid)?.plan || "");
      veri.alimlar.push({ iid, t: e.t, plan, kaynak: e.p || "unknown", s: e.s ?? null });
    }
  }
  veri.alimlar.sort((a, b) => b.t - a.t);
}

// ── Donem ve suzme ────────────────────────────────────────────────────────
const D = () => { const d = donem(K.aralik); if (!d.bas) d.bas = istGunBasi(veri.ilk); return d; };
const oncekiVar = d => d.oncekiBas != null;
const icinde = (t, b, s) => { const x = ms(t); return x >= b && x <= s; };
const fk = (simdi, once, ters) => once == null ? undefined : { simdi, once, ters };
const donemAdi = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
const I = () => surumSuz(veri.installs, K.surum);
const EV = () => !K.surum ? veri.events : veri.events.filter(e => veri.kurulum.get(e.iid)?.appVersion === K.surum);
const AL = () => !K.surum ? veri.alimlar : veri.alimlar.filter(a => veri.kurulum.get(a.iid)?.appVersion === K.surum);
const statsArasi = (b, s) => { const x = istGun(b), y = istGun(s); return veri.days.filter(d => d.id >= x && d.id <= y); };
const gP = () => { const d = D(); return statsArasi(d.bas, d.son); };
const gO = () => { const d = D(); return oncekiVar(d) ? statsArasi(d.oncekiBas, d.oncekiSon - 1) : null; };
const topla = (days, k) => (days || []).reduce((a, d) => a + n(d[k]), 0);
const evT = (days, k) => (days || []).reduce((a, d) => a + n(d.ev?.[k]), 0);
/* ev.<onek><ad> sayaclari; `haric` ile ayni oneki paylasan baska olaylar disarida. */
function evOnek(kaynak, onek, haric = []) {
  const out = {};
  for (const d of kaynak || []) for (const [k, v] of Object.entries(d.ev || {})) {
    if (!k.startsWith(onek) || k.endsWith("_sec")) continue;
    const ad = k.slice(onek.length);
    if (!ad || haric.some(h => ad === h || ad.startsWith(h + "_"))) continue;
    out[ad] = (out[ad] || 0) + n(v);
  }
  return out;
}
const adla = (h, sozluk) => Object.fromEntries(Object.entries(h).map(([k, v]) => [sozluk?.[k] || k.replace(/_/g, " "), v]));
function gunDizisi(d) { return gunleriDoldur({}, istGun(d.bas), istGun(d.son)).map(x => x.t); }
function statGunluk(alanlar) {
  const d = D(), h = Object.fromEntries(veri.days.map(x => [x.id, x]));
  return gunDizisi(d).map(t => { const o = { t }; for (const [ad, f] of Object.entries(alanlar)) o[ad] = f(h[t] || {}); return o; });
}
const SURUM_NOT = () => K.surum ? el("p", "muted", "Sürüm filtresi bu grafiğe uygulanmaz: günlük kayıtlar (bb_stats) sürüme bölünmüyor.") : null;
const ham = (o, k) => n(o?.[k]);
const iev = (i, k) => n(i.ev?.[k]);
const online = i => i.screen && i.screen !== "closed" && Date.now() - ms(i.lastSeen) < ONLINE;
const yas = i => i.firstSeen ? Math.floor((Date.now() - ms(i.firstSeen)) / 864e5) : null;
const evet = b => b === true ? "Evet" : b === false ? "Hayır" : "Bilinmiyor";
const izin = b => b === true ? "Açık" : b === false ? "Kapalı" : "Sorulmadı";
const kisiAdi = i => i ? `Kurulum ${i.id.slice(0, 8)}` : "";
function kisiHucre(i) {
  const k = el("span", "kisi");
  const b = el("b"); b.textContent = i.id.slice(0, 8);
  const s = el("small"); s.textContent = [i.region, DIL[i.language] || i.language].filter(Boolean).join(" · ") || "anonim";

  return { d: k, s: i.id };

  const r = el("span", "rozet");

  if (i.pro) r.appendChild(el("span", "pill pro", "Pro"));

}

  const t = ms(i.lastSeen);
  if (!t) return "Bilinmiyor";
  if (t >= istGunBasi()) return "Bugün";
  const g = (Date.now() - t) / 864e5;
  return g <= 7 ? "Son 7 gün" : g <= 28 ? "Son 28 gün" : g <= 90 ? "Son 90 gün" : "90+ gün";
}
function gKart(ebeveyn, baslik, ciz, ...alt) {
  const kutu = el("div");
  const k = kart(baslik, kutu, ...alt.filter(Boolean));
  ebeveyn.appendChild(k);

}
const izgara = (c, sinif = "izgara2") => { const g = el("div", sinif); c.appendChild(g); return g; };
function hataNotu(ad) {
  const h = veri.hatalar[ad];
  if (!h) return null;
  const izinYok = /permission/i.test(h);
  return el("div", "note err", `${esc(ad)} okunamadı: ${esc(h)}` +
    (izinYok ? ". bb_ koleksiyonlarının Firestore kuralları yazıldı ama leafbook-bamtech'e henüz yüklenmedi; <code>firebase deploy --only firestore:rules</code> ile yüklenince açılır." : ""));
}
const ondalik = (a, b) => b ? (a / b).toFixed(1).replace(".", ",") : "0";
const kova = (liste, alan, sinirlar) => {
  const m = {};
  for (const i of liste) { const v = n(typeof alan === "function" ? alan(i) : i[alan]); const s = sinirlar.find(([, u]) => v <= u) || sinirlar[sinirlar.length - 1]; m[s[0]] = (m[s[0]] || 0) + 1; }
  return sinirlar.map(([a]) => [a, m[a] || 0]);
};

// ── Olay metni (zaman cizelgesi) ──────────────────────────────────────────
function olayMetni(e) {
  const p = e.p ?? "";
  const alt = onek => ALT[onek]?.[String(p).toLowerCase().replace(/[^a-z0-9]/g, "_")] || p;
  const ek = p ? ` · ${p}` : "";
  switch (e.e) {
    case "screen": return `Ekran: ${ekranAdi(p)}`;
    case "screen_time": return `Ekrandan çıktı · ${ekranAdi(p)}`;
    case "session": return "Oturum bitti";
    case "pw_view": return `Paywall açıldı · ${kaynakAdi(p)}`;
    case "pw_close": return `Paywall kapandı · ${kaynakAdi(p)}`;
    case "pw_close_bought": return `Paywall kapandı (aldı) · ${kaynakAdi(p)}`;
    case "pw_plan": return `Plan seçti · ${planAdi(p)}`;
    case "pw_tap_buy": return `Satın almaya bastı · ${planAdi(p)}`;
    case "pw_buy": return `Satın aldı · ${kaynakAdi(p)}`;
    case "pro_purchased": return `Pro alındı · ${planAdi(p)}`;
    case "paywall_shown": return "Paywall gösterildi (analitik)";
    case "app_launched": return "Uygulama açıldı";
    case "report_generated": return `PDF rapor oluşturdu${ek}`;
    case "hydration_logged": return "Su kaydetti";
    case "sleep_logged": return "Uyku kaydetti";
    case "medication_created": return "İlaç ya da takviye ekledi";
    case "medication_dosemarked": return "Doz işaretledi";
    case "coach_started": return `Rehber başladı${ek}`;
    case "coach_acted": return `Rehberde adım attı${ek}`;
    case "coach_completed": return `Rehberi bitirdi${ek}`;
    case "coach_skipped": return `Rehberi atladı${ek}`;
    case "health_connected": return "Sağlık uygulamasına bağlandı";
    case "health_imported": return "Sağlık'tan veri aktardı";
    case "duo": return `iPhone Duo duruşu · ${duoAdi(p)}`;
    case "reminder_action": return `Hatırlatma · ${alt("reminder_action_")}`;
    default: return p ? `${ANALITIK[e.e] || e.e} · ${p}` : ANALITIK[e.e] || e.e;
  }
}
const olaySinif = e => e.e === "pw_buy" || e.e === "pw_close_bought" || e.e === "pro_purchased" ? "ev buy" : e.e.startsWith("pw_") || e.e === "paywall_shown" ? "ev pw"
  : (e.e === "screen" && /^(moles|mole_detail|camera)$/.test(e.p || "")) ? "ev mole" : "ev";

// ════════════════════════════════════════════════════════════════════════
// ANALIZ
// ════════════════════════════════════════════════════════════════════════

function genel(c) {
  const d = D(), on = oncekiVar(d), ins = I(), evs = EV();
  const aktifIn = (b, s) => { const k = new Set(); for (const e of evs) if (e.t >= b && e.t <= s) k.add(e.iid); for (const i of ins) if (icinde(i.lastSeen, b, s)) k.add(i.id); return k.size; };
  const yeni = (b, s) => ins.filter(i => icinde(i.firstSeen, b, s)).length;
  const alimSay = (b, s) => AL().filter(a => a.t >= b && a.t <= s).length;
  const p = gP(), o = gO();
  const pro = ins.filter(i => i.pro).length;
  const tStat = (ad, k, alt) => [ad, sayi(topla(p, k)), alt || "günlük kayıt", on ? fk(topla(p, k), topla(o, k)) : undefined];
  const not = hataNotu(KOL.installs); if (not) c.appendChild(not);

        t += s * 1e3; top += s;
      }
      if (r() < 0.12 && mods.includes("medication")) { const a = sec(["taken", "taken", "snooze", "open"]); ekle(t - 6e4, "reminder_action", a); say(t - 6e4, "reminder_actions"); }
      ekle(t + 1e3, "session", null, top);
    }
    if (r() < 0.08) { ekle(son - 3e5, "health_connected"); ekle(son - 2.9e5, "health_imported"); }
    // Satin almalar
    if (j % 6 === 0 || j === 13) {
      const plan = sec(["annual", "annual", "monthly", "lifetime"]);
      const k = sec(["report_bp", "report_trends", "insights", "modules", "pro_card"]);
      const t = ilk + r() * Math.max(1, son - ilk), sn = Math.round(10 + r() * 70);
      ekle(t - sn * 1e3, "pw_view", k); ekle(t - sn * 1e3, "paywall_shown"); ekle(t - 4e3, "pw_plan", plan); ekle(t - 2e3, "pw_tap_buy", plan);
      ekle(t, "pw_buy", k, sn); say(t, "purchases"); say(t, "ev.pw_buy_plan_" + plan);
      ekle(t + 500, "pro_purchased", "com.aberk.bodybook.pro." + plan); ekle(t + 2e3, "pw_close_bought", k, sn + 2);
      const f = fiyat[i.region] || fiyat.US;
      Object.assign(i, { pro: true, plan, buySource: k, purchasedAt: new Date(t), price: f[0] + f[2][plan], currency: f[1] });
    }
    i.n_moles = mods.includes("moles") ? benSay : 0;
    i.n_mole_photos = mods.includes("moles") ? fotoSay : 0;
    i.n_meds = mods.includes("medication") ? 1 + Math.floor(r() * 4) : 0;
    i.n_entries = Math.floor(r() * 40 * (mods.filter(m => ["bloodPressure", "weight", "hydration", "sleep"].includes(m)).length));
    Object.keys(i).forEach(k => i[k] === undefined && delete i[k]);
  }
  events.sort((a, b) => a.t - b.t);
  /* Sayaclar uygulamanin yazdigi gibi: record() ev.<ad>, ev.<ad>_<p>, _sec; ekran suresi
     yalniz ev.screen_<ad>_sec (zaman cizelgesine screen_time). */
  const ins = new Map(installs.map(i => [i.id, i]));
  const gunler = {};
  const gunu = t => { const g = new Date(t).toISOString().slice(0, 10); return gunler[g] ||= { id: g, ev: {} }; };
  const kayit = (o, e) => {
    const ev = o.ev ||= {};
    const art = (k, v = 1) => { ev[k] = (ev[k] || 0) + v; };
    if (e.e === "screen_time") { art(`screen_${slug(e.p)}_sec`, n(e.s)); return; }
    if (e.e === "session") { art("session"); art("session_sec", n(e.s)); return; }
    if (e.e === "pw_view") o.paywall_views = (o.paywall_views || 0) + 1;
    const ad = slug(e.e);
    art(ad);
    if (e.p) art(ad + "_" + slug(e.p));
    if (e.s) { art(ad + "_sec", n(e.s)); if (e.p) art(ad + "_" + slug(e.p) + "_sec", n(e.s)); }
  };
  for (const e of events) { kayit(ins.get(e.iid), e); kayit(gunu(e.t), e); }
  const sayacEkle = (o, x) => { if (x.k.startsWith("ev.")) { const k = x.k.slice(3); o.ev[k] = (o.ev[k] || 0) + x.v; } else o[x.k] = (o[x.k] || 0) + x.v; };
  for (const x of sayaclar) { sayacEkle(ins.get(x.iid), x); sayacEkle(gunu(x.t), x); }
  for (const i of installs) { gunu(ms(i.firstSeen)).installs_new = (gunu(ms(i.firstSeen)).installs_new || 0) + 1; i.installs_new = 1; }
  return { installs, days: Object.values(gunler), events };
}

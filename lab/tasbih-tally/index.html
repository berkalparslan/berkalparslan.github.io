let K = null, db = null;

let olay = { liste: null, hata: "", tavan: false, kaynak: "" };
let notlar = [];

// ── Kucuk yardimcilar ──────────────────────────────────────────────────────

const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const say = (liste, f) => liste.reduce((m, x) => { const k = f(x); if (k != null && k !== "") m[k] = (m[k] || 0) + 1; return m; }, {});
const topla = (liste, f) => liste.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const n = v => Number(v) || 0;
const slug = t => String(t ?? "").toLowerCase().replace(/[^a-z0-9]/g, "_").slice(0, 40);
const platAd = p => p === "ios" ? "iOS" : p === "android" ? "Android" : p ? String(p) : "Bilinmiyor";
const dilAd = l => !l ? "Bilinmiyor" : DIL[l] ? `${DIL[l]} (${l})` : l;
const ulkeAdlari = (() => { try { return new Intl.DisplayNames(["tr"], { type: "region" }); } catch (e) { return null; } })();
const ulke = k => { if (!k) return "Bilinmiyor"; try { return ulkeAdlari?.of(k) || k; } catch (e) { return k; } };

const planAnahtar = p => String(p || "").split(":")[0];

const planFiyat = p => PLAN[planAnahtar(p)]?.usd ?? null;
const evi = (i, k) => n(i?.ev?.[k]);
const kisa = id => String(id || "").slice(0, 8);
const fark = (simdi, once, ters) => once == null ? undefined : { simdi, once, ters };
const gunSay = (a, b) => Math.floor((ms(b) - ms(a)) / 864e5);
const dk = s => s ? sure(s) : "0 sn";
const canliMi = i => i.screen && i.screen !== "closed" && Date.now() - ms(i.lastSeen) < CANLI_MS;
const tokenVar = i => typeof i.fcm === "string" && i.fcm.length > 20;
const surumAd = i => i.appVersion ? `${i.appVersion}${i.build ? ` (${i.build})` : ""}` : "Bilinmiyor";
const surumKey = v => String(v || "").split(/[^\d]+/).filter(Boolean).map(x => x.padStart(4, "0")).join(".");

/* Kart ekle, sonra ciz: grafikler kutunun genisligini olcuyor. */
function grafikKart(ana, baslik, cizici, not) {
  const kutu = el("div");
  const k = kart(baslik, kutu);
  if (not) k.appendChild(el("p", "alt-not", not));
  ana.appendChild(k);
  try { cizici(kutu); } catch (e) { console.error(e); kutu.appendChild(el("p", "muted", "Çizilemedi: " + esc(e.message))); }
  return k;
}
function izgara(c, sinif = "izgara2") { const g = el("div", sinif); c.appendChild(g); return g; }
function notSatir(c, html, sinif = "note") { const d = el("div", sinif, html); c.appendChild(d); return d; }

/* Sayi kovalari: dagilim grafikleri icin. */
function kovala(degerler, sinirlar, bicim) {
  const m = {};
  for (const [ad] of sinirlar) m[ad] = 0;
  for (const v of degerler) {
    const k = sinirlar.find(([, alt, ust]) => v >= alt && v < ust);
    if (k) m[k[0]]++;
  }
  return Object.entries(m).filter(([, v]) => v || !bicim);
}
const SURE_KOVA = [["10 sn altı", 0, 10], ["10-30 sn", 10, 30], ["30-60 sn", 30, 60], ["1-3 dk", 60, 180], ["3-10 dk", 180, 600], ["10-30 dk", 600, 1800], ["30 dk üstü", 1800, 1e9]];
const PW_KOVA = [["3 sn altı", 0, 3], ["3-10 sn", 3, 10], ["10-30 sn", 10, 30], ["30-60 sn", 30, 60], ["1-3 dk", 60, 180], ["3 dk üstü", 180, 1e9]];

// ── Veri ───────────────────────────────────────────────────────────────────

/* Firestore zaman alanlari Timestamp gelir; kapida bir kez ISO metne
   cevrilir, icerisi tek bicim gorur ("Invalid Date" olmasin). */
const ZAMAN_ALANLARI = ["firstSeen", "lastSeen", "purchasedAt"];
function kurulumDuzelt(k) {
  for (const a of ZAMAN_ALANLARI) { const t = zaman(k[a]); k[a] = t ? t.toISOString() : null; }
  if (!k.ev || typeof k.ev !== "object") k.ev = {};
  return k;
}

async function kurulumlariOku() {
  const snap = await getDocs(collection(db, "installs"));
  return snap.docs.map(d => kurulumDuzelt({ id: d.id, ...d.data() }));
}
async function gunleriOku() {
  const snap = await getDocs(collection(db, "stats"));
  return snap.docs.map(d => ({ id: d.id, ...d.data(), ev: d.data().ev || {} })).sort((a, b) => a.id < b.id ? -1 : 1);
}
const olayKaydi = (d, iid) => {
  const x = d.data();
  return { iid: iid || d.ref.parent.parent?.id || "", t: ms(x.t), e: String(x.e || ""), p: x.p != null ? String(x.p) : "", s: n(x.s) };
};
/* Butun kurulumlarin olaylari tek sorguda (collection group, kurallarda
   /{path=**}/events okuma izni ve events.t icin collection group indeksi).
   Indeks hazir degilse ya da sorgu reddedilirse az kurulumda tek tek okunur. */
async function olaylariOku(kurulumlar) {
  const bas = Timestamp.fromMillis(Date.now() - OLAY_GUN * 864e5);
  try {
    const snap = await getDocs(query(collectionGroup(db, "events"), where("t", ">=", bas), orderBy("t", "desc"), limit(OLAY_SINIR)));
    return { liste: snap.docs.map(d => olayKaydi(d)), tavan: snap.size >= OLAY_SINIR, kaynak: "tek sorgu" };
  } catch (e) {
    if (kurulumlar.length > 80) throw e;
    const parca = await Promise.all(kurulumlar.map(k => getDocs(query(collection(db, "installs", k.id, "events"), where("t", ">=", bas), orderBy("t", "desc"), limit(400)))
      .then(s => s.docs.map(d => olayKaydi(d, k.id))).catch(() => [])));
    return { liste: parca.flat().sort((a, b) => b.t - a.t), tavan: false, kaynak: "kurulum kurulum (indeks hazır değil: " + (e.code || e.message) + ")" };
  }
}

async function yukle(k) {
  K = k;
  if (!db && k.app) db = getFirestore(k.app);
  satisBelge = undefined;
  surumNotlari(SLUG).then(l => { notlar = l || []; }).catch(() => { notlar = []; });
  try {
    if (demo) {
      const s = sahte();
      veri = { installs: s.installs, days: s.days, harita: new Map(s.installs.map(i => [i.id, i])) };
      olay = { liste: s.events, hata: "", tavan: false, kaynak: "demo" };
      DEMO_PUSH = s.pushes;
      satisBelge = s.satis;
    } else {
      const [installs, days] = await Promise.all([kurulumlariOku(), gunleriOku()]);
      veri = { installs, days, harita: new Map(installs.map(i => [i.id, i])) };
      try { const o = await olaylariOku(installs); olay = { ...o, hata: "" }; }
      catch (e) { olay = { liste: [], hata: e.code || e.message, tavan: false, kaynak: "" }; }
    }
    notlar = await surumNotlari(SLUG).catch(() => []);
    k.durum(`${demo ? "Demo veri · " : ""}${sayi(veri.installs.length)} kurulum · ${sayi(veri.days.length)} gün kaydı · ${sayi(olay.liste?.length || 0)} olay${olay.tavan ? " (sınır)" : ""}`);
  } catch (e) {
    k.durum("Hata: " + (e.code || e.message));
    veri = { installs: [], days: [], harita: new Map() };
    olay = { liste: [], hata: e.message, tavan: false, kaynak: "" };
  }
}

// ── Donem hesaplari ────────────────────────────────────────────────────────

const kurulumlar = () => surumSuz(veri.installs, K.surum);
function statsGunleri(bas, son) { const a = istGun(bas || 0), b = istGun(son); return veri.days.filter(d => d.id >= a && d.id <= b); }
function olaylar(bas, son, surum = K.surum) {
  return (olay.liste || []).filter(e => e.t >= bas && e.t <= son && (!surum || String(veri.harita.get(e.iid)?.appVersion ?? "") === String(surum)));
}
/* Olaylardan uygulamanin ev haritasini yeniden kurar (InstallTelemetry.record). */
function olayEv(liste) {
  const ev = {};
  const ekle = (k, v) => { ev[k] = (ev[k] || 0) + v; };
  for (const e of liste) {
    const a = slug(e.e), p = e.p ? slug(e.p) : null;
    ekle(a, 1);
    if (p) ekle(`${a}_${p}`, 1);
    if (e.s > 0) { ekle(`${a}_sec`, e.s); if (p) ekle(`${a}_${p}_sec`, e.s); }
    if (a === "screen_time" && p && e.s > 0) ekle(`screen_${p}_sec`, e.s);
  }
  return ev;
}
/* Bir donemin sayaclari. Surum secili degilse gunluk `stats/` toplamlarindan
   (tam, ama surume bolunemez), seciliyse o surumdeki kurulumlarin olaylarindan. */
function donemVeri(bas, son) {
  const ol = olaylar(bas, son);
  if (K.surum) {
    const ev = olayEv(ol);
    return { kaynak: "olay", ev, sayac: { sessions: ev.session || 0, paywall_views: ev.pw_view || 0, purchases: ev.pw_buy || 0 }, olay: ol, gunler: [] };
  }
  const g = statsGunleri(bas, son), ev = {}, sayac = {};
  for (const d of g) {
    for (const [k, v] of Object.entries(d.ev || {})) ev[k] = (ev[k] || 0) + n(v);
    for (const k of Object.keys(SAYAC)) sayac[k] = (sayac[k] || 0) + n(d[k]);
  }
  return { kaynak: "stats", ev, sayac, olay: ol, gunler: g };
}
function ikiDonem() {
  const D = donem(K.aralik);
  return { D, simdi: donemVeri(D.bas, D.son), once: D.oncekiBas != null ? donemVeri(D.oncekiBas, D.oncekiSon - 1) : null };
}
const donemAd = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
const surumNotu = () => K.surum ? `Sürüm ${K.surum} seçili: sayılar o sürümdeki kurulumların olaylarından (son ${OLAY_GUN} gün).` : "";
function gunAraligi(D) {
  const son = istGun(D.son);
  const ilk = [veri.days[0]?.id, ...veri.installs.map(i => istGun(i.firstSeen))].filter(Boolean).sort()[0] || son;
  const bas = D.bas ? istGun(D.bas) : ilk;
  return [bas < son ? bas : son, son];
}
/* Dagitik kurulum sayisi: olaylarda goruneni. */
const kisiSay = liste => new Set(liste.map(e => e.iid)).size;
function aktifSayisi(bas, son) {
  if (olay.liste?.length) return kisiSay(olaylar(bas, son));
  return kurulumlar().filter(i => ms(i.lastSeen) >= bas && ms(i.lastSeen) <= son).length;
}
/* Gun adlarinin altina surum yayini notu (grafik ipucunda gorunur). */
function yayinNotu() {
  const m = {};
  for (const x of notlar) { const g = istGun(x.tarih); if (g) m[g] = [m[g], `${x.surum} ${platAd(x.platform)}`].filter(Boolean).join(", "); }
  return m;
}

// ── Sayfalar: Genel bakis ──────────────────────────────────────────────────

function genel(c) {
  const { D, simdi, once } = ikiDonem();
  const hepsi = kurulumlar();
  const yeni = hepsi.filter(i => ms(i.firstSeen) >= D.bas && ms(i.firstSeen) <= D.son).length;
  const yeniOnce = once ? hepsi.filter(i => ms(i.firstSeen) >= D.oncekiBas && ms(i.firstSeen) < D.oncekiSon).length : null;
  const aktif = aktifSayisi(D.bas, D.son), aktifOnce = once ? aktifSayisi(D.oncekiBas, D.oncekiSon - 1) : null;
  const ses = simdi.sayac.sessions || 0, sesOnce = once?.sayac.sessions ?? null;
  const sesSn = simdi.ev.session_sec || 0, sesAdet = simdi.ev.session || 0;
  const sesOrtOnce = once && once.ev.session ? (once.ev.session_sec || 0) / once.ev.session : null;
  const pro = hepsi.filter(i => i.pro === true).length;
  const izin = hepsi.filter(i => i.notif === true).length, izinBilinen = hepsi.filter(i => typeof i.notif === "boolean").length;
  const pw = simdi.sayac.paywall_views || 0, al = simdi.sayac.purchases || 0;
  const [bg, sg] = gunAraligi(D);

function kaliciTablo(kutu, hepsi) {
  const N = [1, 3, 7, 14, 30];
  const satir = (ad, liste) => [ad, sayi(liste.length), ...N.map(g => {
    const uygun = liste.filter(i => i.firstSeen && Date.now() - ms(i.firstSeen) >= g * 864e5);
    const kal = uygun.filter(i => ms(i.lastSeen) - ms(i.firstSeen) >= g * 864e5).length;
    return { d: uygun.length ? `${yuzde(kal, uygun.length)} (${kal}/${uygun.length})` : "-", s: uygun.length ? kal / uygun.length : -1 };
  })];
  /* Haftalik kohortlar: kurulumun Turkiye haftasinin pazartesisi. */
  const hafta = t => { const g = istGunBasi(ms(t)); const gun = (new Date(g + 3 * 36e5).getUTCDay() + 6) % 7; return istGun(g - gun * 864e5); };
  const kohort = {};
  for (const i of hepsi) if (i.firstSeen) (kohort[hafta(i.firstSeen)] ||= []).push(i);
  const satirlar = [satir("Hepsi", hepsi.filter(i => i.firstSeen)), ...Object.keys(kohort).sort().reverse().slice(0, 12).map(h => satir(`${tarihTam(h)} haftası`, kohort[h]))];
  kutu.appendChild(veriTablo(["Kohort", { ad: "Kurulum", num: true }, ...N.map(g => ({ ad: `${g}. gün`, num: true }))], satirlar, { ara: false, kopyala: true }));
}

function surumTablosu() {
  const gruplar = {};
  for (const i of veri.installs) (gruplar[i.appVersion || "?"] ||= []).push(i);
  const yayin = {};
  for (const x of notlar) if (x.tarih && (x.platform === "ios" || x.platform === "android")) {
    const k = String(x.surum);
    (yayin[k] ||= []).push(`${platAd(x.platform)} ${tarihTam(x.tarih, { saatsiz: true })}`);
  }
  const yedi = Date.now() - 7 * 864e5;
  const kal = (l, g) => { const u = l.filter(i => Date.now() - ms(i.firstSeen) >= g * 864e5); return u.length ? u.filter(i => ms(i.lastSeen) - ms(i.firstSeen) >= g * 864e5).length / u.length : null; };
  const satirlar = Object.entries(gruplar).sort((a, b) => surumKey(b[0]).localeCompare(surumKey(a[0]))).map(([v, l]) => {
    const pro = l.filter(i => i.pro === true).length, akt = l.filter(i => ms(i.lastSeen) >= yedi).length;
    const ses = topla(l, i => i.sessions), sn = topla(l, i => evi(i, "session_sec")), sa = topla(l, i => evi(i, "session"));
    const pw = topla(l, i => evi(i, "pw_view")), al = topla(l, i => evi(i, "pw_buy"));
    const d1 = kal(l, 1), d7 = kal(l, 7);
    const ilk = l.map(i => ms(i.firstSeen)).filter(Boolean), son = l.map(i => ms(i.lastSeen)).filter(Boolean);
    return [
      { d: v === "?" ? "Bilinmiyor" : v, s: surumKey(v) },
      [...new Set(l.map(i => platAd(i.platform)))].join(", "),
      sayi(l.length), { d: yuzde(l.length, veri.installs.length, 0), s: l.length },
      sayi(akt), { d: `${sayi(pro)} (${yuzde(pro, l.length, 0)})`, s: pro / l.length },
      { d: yuzde(l.filter(i => i.notif === true).length, l.length, 0), s: l.filter(i => i.notif === true).length / l.length },
      { d: (ses / l.length).toFixed(1).replace(".", ","), s: ses / l.length },
      { d: dk(sa ? sn / sa : 0), s: sa ? sn / sa : 0 },
      { d: (pw / l.length).toFixed(2).replace(".", ","), s: pw / l.length },
      { d: pw ? yuzde(al, pw, 1) : "-", s: pw ? al / pw : -1 },
      { d: d1 == null ? "-" : yuzde(d1, 1, 0), s: d1 ?? -1 }, { d: d7 == null ? "-" : yuzde(d7, 1, 0), s: d7 ?? -1 },
      ilk.length ? tarihHucre(Math.min(...ilk)) : "-", son.length ? tarihHucre(Math.max(...son)) : "-",
      (yayin[v] || []).join(" · ") || "-",
    ];
  });
  return veriTablo(["Sürüm", { ad: "Platform", filtre: true }, { ad: "Kurulum", num: true }, { ad: "Pay", num: true }, { ad: "7g aktif", num: true },
    { ad: "Pro", num: true }, { ad: "Bildirim izni", num: true }, { ad: "Oturum/kurulum", num: true }, { ad: "Ort. oturum", num: true },
    { ad: "Paywall/kurulum", num: true }, { ad: "Dönüşüm", num: true }, { ad: "D1", num: true }, { ad: "D7", num: true },
    "İlk görülme", "Son görülme", "Mağaza yayını"], satirlar, { sirala: [0, "desc"], ara: false });
}

function ekranOzet(ev) {
  const m = {};
  for (const [k, v] of Object.entries(ev)) {

    let x = k.match(/^screen_(.+)_sec$/);
    if (x) { (m[x[1]] ||= { gir: 0, sn: 0 }).sn += v; continue; }
    x = k.match(/^screen_(.+)$/);
    if (x) (m[x[1]] ||= { gir: 0, sn: 0 }).gir += v;
  }
  return m;
}

}

// ── Paywall ve satin alma ─────────────────────────────────────────────────

function pwOzet(ev) {
  const m = {};
  for (const [k, v] of Object.entries(ev)) {
    let x = k.match(/^pw_view_(.+)$/); if (x && !k.endsWith("_sec")) { (m[x[1]] ||= { ac: 0, al: 0, kap: 0, sn: 0 }).ac += v; continue; }
    x = k.match(/^pw_buy_(.+)$/); if (x && !k.endsWith("_sec")) { (m[x[1]] ||= { ac: 0, al: 0, kap: 0, sn: 0 }).al += v; continue; }
    x = k.match(/^pw_close_(.+)_sec$/); if (x && !x[1].startsWith("bought")) { (m[x[1]] ||= { ac: 0, al: 0, kap: 0, sn: 0 }).sn += v; continue; }
    x = k.match(/^pw_close_(.+)$/); if (x && !x[1].startsWith("bought") && !k.endsWith("_sec")) (m[x[1]] ||= { ac: 0, al: 0, kap: 0, sn: 0 }).kap += v;
  }
  return m;
}

  const satinlar = alimlar(D.bas, D.son), satinOnce = once ? alimlar(D.oncekiBas, D.oncekiSon - 1) : null;

  const m = pwOzet(simdi.ev), mo = once ? pwOzet(once.ev) : {};
  const kisiK = {}, snK = {};

  c.appendChild(kart("Nereden açıldı", veriTablo(
    ["Kaynak", { ad: "Açılış", num: true }, { ad: "Önceki", num: true }, { ad: "Değişim", num: true }, { ad: "Kişi", num: true },
     { ad: "Ort. açık kalma", num: true }, { ad: "Satın alma", num: true }, { ad: "Dönüşüm", num: true }],
    Object.keys(m).map(k => {
      const x = m[k], o = mo[k], f = once ? farkYazi({ simdi: x.ac, once: o?.ac || 0 }) : null;
      return [kaynakAd(k), sayi(x.ac), once ? sayi(o?.ac || 0) : "-", { d: f?.metin || "-", s: o?.ac ? (x.ac - o.ac) / o.ac : 0 }, sayi(kisiK[k]?.size || 0),
        { d: dk(x.kap ? x.sn / x.kap : 0), s: x.kap ? x.sn / x.kap : 0 }, sayi(x.al), { d: x.ac ? yuzde(x.al, x.ac, 1) : "-", s: x.ac ? x.al / x.ac : 0 }];
    }), { sirala: [1, "desc"], bos: "Bu dönemde paywall açılmamış." })));
  const g2 = izgara(c);
  const [bg, sg] = gunAraligi(D);

  grafikKart(g2, "Pro kurulumların planı", kutu => yatayCubuk(kutu, say(kurulumlar().filter(i => i.pro === true), i => i.plan ? planAd(i.plan) : "Plan yazılmamış")),
    "Plan yazılmamış: Pro, satın alma telemetriden önce ya da başka cihazda yapılmış (geri yükleme).");

  const tum = alimlar(0, Date.now());
  c.appendChild(kart(`Satın alanlar (${sayi(tum.length)})`, veriTablo(
    ["Zaman", "Kurulum", { ad: "Plan", filtre: true }, { ad: "Kaynak", filtre: true }, { ad: "Kaç saniyede", num: true }, { ad: "Fiyat (tahmini)", num: true },
     { ad: "Platform", filtre: true }, { ad: "Sürüm", filtre: true }, { ad: "Ülke", filtre: true }, { ad: "Paywall görme", num: true }, { ad: "Kurulumdan sonra", num: true }],
    tum.map(x => [tarihHucre(x.t), kisa(x.i.id), planAd(x.i.plan), kaynakAd(x.i.buySource), { d: x.sn != null ? sure(x.sn) : "-", s: x.sn ?? -1 },
      { d: x.fiyat != null ? para(x.fiyat, "USD") : "-", s: x.fiyat ?? 0 }, platAd(x.i.platform), surumAd(x.i), ulke(x.i.region),
      sayi(evi(x.i, "pw_view")), { d: x.i.firstSeen && x.t ? `${sayi(gunSay(x.i.firstSeen, x.t))} gün` : "-", s: x.i.firstSeen ? gunSay(x.i.firstSeen, x.t) : -1 }]),
    { sirala: [0, "desc"], bos: "Telemetride satın alma yok.", satirTik: (_, k) => cekmece(tum[k].i) })));
  c.lastChild.appendChild(el("p", "alt-not", "Fiyat: plan kimliğinden liste fiyatı (Aylık 1,99 $, Yıllık 9,99 $, Ömür boyu 19,99 $; StoreKit dosyası). Ülkeye göre yerel fiyat ve iade burada yok; gerçek para mağaza raporundan aşağıda."));
  satis(c, satinlar);
}

/* Telemetrideki satin almalar: kurulumun purchasedAt'i, saniyesi pw_buy olayindan. */
function alimlar(bas, son) {
  const buy = {};
  for (const e of olay.liste || []) if (e.e === "pw_buy") (buy[e.iid] ||= []).push(e);
  return kurulumlar().filter(i => i.purchasedAt && ms(i.purchasedAt) >= bas && ms(i.purchasedAt) <= son).map(i => {
    const t = ms(i.purchasedAt);
    const e = (buy[i.id] || []).sort((a, b) => Math.abs(a.t - t) - Math.abs(b.t - t))[0];
    return { i, t, sn: e && Math.abs(e.t - t) < 36e5 ? e.s : null, fiyat: planFiyat(i.plan) };
  }).sort((a, b) => b.t - a.t);
}

/* Magaza parasi panel/sales'tan (scripts/lab/panel-yaz.mjs yaziyor). Yoksa

  ])));

  const anaKod = Object.entries(gelir).sort((a, b) => b[1] - a[1])[0]?.[0] || "USD";
  grafikKart(g, `Gelir, gün gün (${anaKod})`, k => gunlukCubuk(k, gunleriDoldur(Object.fromEntries(gunluk.map(x => [x.tarih, n(x.gelir?.[anaKod])])), bg, sg), { birim: anaKod }));

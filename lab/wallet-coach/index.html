<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wallet Coach · Lab</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/assets/brand/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("bamtech-panel-tema"); } catch (e) { }
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f7; --surface: #fff; --surface-2: #f7f7fa; --text: #14141a; --subtle: #5f6270;
      --faint: #9a9daa; --border: #e2e3ea; --accent: #0f9f6e; --accent-soft: rgba(15, 159, 110, .12);
      --sky: #0a6fe0; --violet: #6d4fe0; --amber: #c77d00; --rose: #d6455d;
      --shadow: 0 1px 2px rgba(20, 20, 40, .05), 0 6px 20px rgba(20, 20, 40, .05);
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0a0d; --surface: #141419; --surface-2: #1a1a21; --text: #f2f2f6; --subtle: #a0a2ae;
      --faint: #6a6c78; --border: #24242c; --accent: #34d399; --accent-soft: rgba(52, 211, 153, .14);
      --sky: #5aa8ff; --violet: #a28cff; --amber: #f5b53c; --rose: #ff6f88;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }

    .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .gate form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 26px; box-shadow: var(--shadow); display: grid; gap: 12px; }
    .gate h1 { font-size: 20px; }
    .gate p { color: var(--subtle); font-size: 14px; }
    .gate input { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); font: inherit; color: var(--text); }
    .gate button { padding: 12px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
    .gate .hata { color: var(--rose); font-size: 13px; min-height: 18px; }

    header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .ust { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .ust h1 { font-size: 17px; display: flex; gap: 8px; align-items: center; }
    .ust h1 img { width: 26px; height: 26px; border-radius: 7px; }
    .ust .bos { flex: 1; }
    .secim { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .secim button { padding: 5px 11px; border-radius: 7px; font-size: 13px; color: var(--subtle); }
    .secim button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    nav.sekme { max-width: 1180px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto; }
    nav.sekme button { padding: 7px 13px; border-radius: 999px; font-size: 14px; color: var(--subtle); white-space: nowrap; }
    nav.sekme button.on { background: var(--text); color: var(--bg); }

    main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 16px; }
    .izgara { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .kart { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
    .kart h2 { font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .kart h2 small { color: var(--faint); font-weight: 400; font-size: 12px; }
    .kpi .ad { color: var(--subtle); font-size: 13px; }
    .kpi .deger { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .kpi .alt { color: var(--faint); font-size: 12px; }
    .iki { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--faint); font-weight: 500; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    td { padding: 7px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    td.sayi, th.sayi { text-align: right; }
    tr:last-child td { border-bottom: 0; }
    .cubuk { height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .cubuk i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
    .grup { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 14px !important; }
    svg { display: block; width: 100%; height: auto; }
    .not { color: var(--subtle); font-size: 13px; }
    .not b { color: var(--text); }
    .etiket { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--subtle); }
    .etiket.yesil { background: var(--accent-soft); color: var(--accent); }
    .etiket.sari { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
    .lejant { display: flex; gap: 14px; font-size: 12px; color: var(--subtle); margin-top: 6px; flex-wrap: wrap; }
    .lejant span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
    input.fiyat { width: 90px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; }
    footer { color: var(--faint); font-size: 12px; text-align: center; padding: 20px; }
  </style>
</head>

<body>
  <div class="gate" id="gate">
    <form id="giris">
      <h1>Wallet Coach</h1>
      <p>Kullanıcılar, kullanım, ekranlar ve yapay zekâ harcaması. Veri Firebase Analytics'ten, dosya şifreli.</p>
      <input type="password" id="pw" placeholder="parola" autocomplete="current-password" autofocus />
      <button type="submit">Aç</button>
      <div class="hata" id="hata"></div>
      <div class="not"><a href="/lab/">← Lab</a></div>
    </form>
  </div>

  <div id="uygulama" hidden>
    <header>
      <div class="ust">
        <h1><img src="/assets/home/walletcoach-icon.webp" alt="" onerror="this.remove()">Wallet Coach</h1>
        <span class="bos"></span>
        <div class="secim" id="aralik"></div>
        <div class="secim" id="platform"></div>
        <button id="tema" class="etiket">tema</button>
      </div>
      <nav class="sekme" id="sekmeler"></nav>
    </header>
    <main id="ana"></main>
    <footer id="alt"></footer>
  </div>

  <script>
    const OTURUM = "bamtech-wc-panel";
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function coz(paket, parola) {
      const temel = await crypto.subtle.importKey("raw", new TextEncoder().encode(parola), "PBKDF2", false, ["deriveKey"]);
      const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(paket.kdf.salt), iterations: paket.kdf.tur, hash: "SHA-256" },
        temel, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const acik = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(paket.iv) }, k, b64(paket.ct));
      return JSON.parse(new TextDecoder().decode(acik));
    }

    /* Olay adları → Türkçe ad ve grup. Listede olmayanlar "Diğer"de çıkar. */
    const OLAY = {
      "Plan": {
        month_created: "Yeni ay", plan_entry_added: "Plan satırı eklendi", plan_entry_toggled: "Ödendi işareti",
        section_added: "Yeni blok", calendar_opened: "Vade takvimi açıldı", reminder_scheduled: "Hatırlatma kuruldu",
        expense_added: "Harcama eklendi",
      },
      "Defterler": {
        party_added: "Kişi/marka eklendi", ledger_entry_added: "Alacak-verecek kaydı", ledger_settled: "Hesap kapandı",
        asset_added: "Varlık eklendi", asset_updated: "Varlık güncellendi", project_created: "Proje açıldı",
        purchase_added: "Alım eklendi", saving_pot_added: "Birikim kabı", saving_added: "Birikim eklendi",
        board_created: "Birikim panosu", board_tile_ticked: "Pano kutusu", board_completed: "Pano bitti",
        item_added: "Listeye eklendi", item_decided: "Listede karar", subscription_added: "Abonelik eklendi",
      },
      "Ekstre ve fiş": {
        statement_shared: "Ekstre paylaşımla geldi", statement_read: "Ekstre okundu", statement_read_failed: "Ekstre okunamadı",
        statement_saved: "Ekstre kaydedildi", statement_plan_linked: "Ekstre plana bağlandı", statement_sector_changed: "Sektör değişti",
        statement_row_edited: "Ekstre satırı düzenlendi", statement_fix_applied: "Ekstre düzeltmesi", statement_deleted: "Ekstre silindi",
        receipt_scanned: "Fiş tarandı", receipt_saved: "Fiş kaydedildi",
      },
      "Araçlar ve paylaşım": {
        calculation_made: "Hesaplayıcı", article_opened: "Okuma açıldı", share_card: "Paylaşım kartı",
        data_exported: "Dışa aktarma", export_started: "Dışa aktarma başladı", export_shared: "Dışa aktarma paylaşıldı",
        data_imported: "İçe aktarma", import_prompt_copied: "İçe aktarma komutu", backup_saved: "Yedek alındı",
        backup_restored: "Yedekten döndü", wallet_reordered: "Cüzdan sıralandı", privacy_toggled: "Tutarları gizle",
      },
      "Para": {
        paywall_shown: "Paywall gösterildi", paywall_dismissed: "Paywall kapatıldı", purchase_completed: "Satın alma",
        in_app_purchase: "Mağaza satın alması", app_store_subscription_renew: "Abonelik yenilendi",
      },
      "Rehber ve başlangıç": {
        onboarding_step: "Tanıtım adımı", onboarding_finished: "Tanıtım bitti", first_run_finished: "İlk kurulum bitti",
        first_run_skipped: "İlk kurulum atlandı", coach_started: "Tur başladı", coach_completed: "Tur bitti",
        coach_skipped: "Tur atlandı", coach_acted: "Turdan işlem", notifications_asked: "Bildirim izni soruldu",
        notifications_on: "Bildirim açık", notifications_off: "Bildirim kapalı",
      },
      "Sistem": {
        first_open: "İlk açılış", session_start: "Oturum", app_update: "Güncelleme", app_remove: "Silindi",
        app_clear_data: "Veri temizlendi", os_update: "iOS/Android güncellemesi", data_cleared: "Uygulamada veri silindi",
        tab_opened: "Sekme değişti", screen_view: "Ekran görüntüleme", user_engagement: "Etkileşim",
      },
    };
    const OLAY_AD = Object.fromEntries(Object.values(OLAY).flatMap(g => Object.entries(g)));
    const AI = { ai_receipt: "Fiş", ai_label: "Etiket", ai_statement: "Ekstre", ai_call: "Eski sürüm (ayrımsız)" };
    const EKRAN = {
      panel: "Panel", month: "Ay", analysis: "Analiz", wallet: "Cüzdan", settings: "Ayarlar", statements: "Ekstreler",
      statement_detail: "Ekstre detayı", ledger: "Alacak-verecek", assets: "Varlıklar", projects: "Projeler",
      savings: "Birikim", price_log: "Fiyat takibi", converter: "Fiyatı saate çevir", wishlist: "Listem",
      time_value: "Şimdi ne kadar", net_salary: "Brütten nete", raise: "Zam", learn: "Öğren", paywall: "Paywall",
    };

    let D = null;
    const durum = { aralik: 30, platform: "hepsi", sekme: "ozet" };
    try { Object.assign(durum, JSON.parse(localStorage.getItem(OTURUM + "-durum") || "{}")); } catch (e) { }
    const kaydet = () => { try { localStorage.setItem(OTURUM + "-durum", JSON.stringify(durum)); } catch (e) { } };

    const sayi = n => new Intl.NumberFormat("tr-TR").format(Math.round(n));
    const sure = sn => sn >= 3600 ? `${(sn / 3600).toFixed(1).replace(".", ",")} sa` : sn >= 60 ? `${Math.round(sn / 60)} dk` : `${Math.round(sn)} sn`;
    const yuzde = x => `%${Math.round(x * 100)}`;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function sinir() {
      const son = D.gunluk.reduce((m, r) => r.t > m ? r.t : m, "");
      const d = new Date(son + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - durum.aralik + 1);
      return d.toISOString().slice(0, 10);
    }
    const pOk = p => durum.platform === "hepsi" || p === durum.platform;

    function cizgi(seriler, gunler, yuk = 160) {
      const g = 640, pad = 26, maks = Math.max(1, ...seriler.flatMap(s => s.d));
      const x = i => pad + (gunler.length < 2 ? 0 : i * (g - pad - 6) / (gunler.length - 1));
      const y = v => yuk - 18 - v * (yuk - 30) / maks;
      let s = `<svg viewBox="0 0 ${g} ${yuk}" role="img">`;
      for (const k of [0, .5, 1]) s += `<line x1="${pad}" x2="${g}" y1="${y(maks * k)}" y2="${y(maks * k)}" stroke="var(--border)"/><text x="0" y="${y(maks * k) + 4}" font-size="10" fill="var(--faint)">${sayi(maks * k)}</text>`;
      for (const sr of seriler) s += `<polyline fill="none" stroke="${sr.c}" stroke-width="2" stroke-linejoin="round" points="${sr.d.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
      const adim = Math.max(1, Math.ceil(gunler.length / 6));
      gunler.forEach((t, i) => { if (i % adim === 0) s += `<text x="${x(i)}" y="${yuk - 2}" font-size="10" fill="var(--faint)" text-anchor="middle">${t.slice(8)}.${t.slice(5, 7)}</text>`; });
      return s + "</svg>";
    }

    function gunlukSeri() {
      const bas = sinir(), m = new Map();
      for (const r of D.gunluk) if (r.t >= bas && pOk(r.p)) {
        const x = m.get(r.t) || { au: 0, nu: 0, os: 0, sure: 0 };
        x.au += r.au; x.nu += r.nu; x.os += r.os; x.sure += r.sure; m.set(r.t, x);
      }
      return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function olayToplam() {
      const bas = sinir(), m = {};
      for (const r of D.olaylar) if (r.t >= bas && pOk(r.p)) {
        const x = m[r.o] ||= { n: 0, kg: 0, v: 0 };
        x.n += r.n; x.kg += r.k; x.v += r.v;
      }
      return m;
    }

    const SEKMELER = { ozet: "Özet", kullanim: "Kullanım", ekranlar: "Ekranlar", ai: "Yapay zekâ", kitle: "Kitle" };

    function ozet() {
      const s = gunlukSeri(), top = s.reduce((a, [, r]) => ({ au: a.au + r.au, nu: a.nu + r.nu, os: a.os + r.os, sure: a.sure + r.sure }), { au: 0, nu: 0, os: 0, sure: 0 });
      const o = olayToplam(), silinen = o.app_remove?.n || 0;
      const kpi = (ad, deger, alt) => `<div class="kart kpi"><div class="ad">${ad}</div><div class="deger">${deger}</div><div class="alt">${alt || ""}</div></div>`;
      return `
        <div class="izgara">
          ${kpi("Bugün aktif", sayi(D.aktif.dau), "son 1 gün")}
          ${kpi("Haftalık aktif", sayi(D.aktif.wau), "son 7 gün")}
          ${kpi("Aylık aktif", sayi(D.aktif.mau), "son 28 gün")}
          ${kpi("Yeni kullanıcı", sayi(top.nu), `son ${durum.aralik} gün`)}
          ${kpi("Oturum başı süre", sure(top.os ? top.sure / top.os : 0), `${sayi(top.os)} oturum`)}
          ${kpi("Silen", sayi(silinen), "app_remove (Android)")}
        </div>
        <div class="kart"><h2>Günlük kullanıcı <small>son ${durum.aralik} gün</small></h2>
          ${cizgi([{ d: s.map(([, r]) => r.au), c: "var(--accent)" }, { d: s.map(([, r]) => r.nu), c: "var(--sky)" }], s.map(([t]) => t))}
          <div class="lejant"><span style="--c:var(--accent)">aktif</span><span style="--c:var(--sky)">yeni</span></div>
        </div>
        <div class="iki">
          <div class="kart"><h2>En çok yapılan <small>kişi sayısı</small></h2>${enCok(o, 10)}</div>
          <div class="kart"><h2>Huni <small>${durum.aralik} gün</small></h2>${huni(o)}</div>
        </div>`;
    }

    function enCok(o, n) {
      const sistem = new Set(Object.keys(OLAY["Sistem"]).concat(Object.keys(OLAY["Rehber ve başlangıç"])));
      const sat = Object.entries(o).filter(([k]) => !sistem.has(k) && !k.startsWith("ai_") && OLAY_AD[k]).sort((a, b) => b[1].n - a[1].n).slice(0, n);
      const maks = Math.max(1, ...sat.map(([, v]) => v.n));
      return `<table>${sat.map(([k, v]) => `<tr><td>${OLAY_AD[k]}<div class="cubuk"><i style="width:${v.n / maks * 100}%"></i></div></td><td class="sayi">${sayi(v.n)}</td></tr>`).join("")}</table>`;
    }

    function huni(o) {
      const adim = [["first_open", "İlk açılış"], ["onboarding_finished", "Tanıtımı bitirdi"], ["plan_entry_added", "Plan satırı ekledi"],
        ["month_created", "Yeni ay açtı"], ["paywall_shown", "Paywall gördü"], ["purchase_completed", "Satın aldı"]];
      const ilk = D.olayKisi.first_open?.k || 1;
      return `<table>${adim.map(([k, ad]) => { const v = D.olayKisi[k]?.k || 0; return `<tr><td>${ad}<div class="cubuk"><i style="width:${Math.min(100, v / ilk * 100)}%"></i></div></td><td class="sayi">${sayi(v)}</td><td class="sayi">${yuzde(v / ilk)}</td></tr>`; }).join("")}</table>
        <p class="not" style="margin-top:8px">Kişi sayıları dönemin tamamı (${D.gun} gün) için, platform filtresi uygulanmaz.</p>`;
    }

    function kullanim() {
      const o = olayToplam();
      const bilinen = new Set(Object.keys(OLAY_AD));
      let h = "";
      for (const [grup, liste] of Object.entries(OLAY)) {
        const sat = Object.keys(liste).filter(k => o[k] || D.olayKisi[k]);
        if (!sat.length) continue;
        h += `<tr><td class="grup" colspan="3">${grup}</td></tr>` + sat.sort((a, b) => (o[b]?.n || 0) - (o[a]?.n || 0)).map(k =>
          `<tr><td>${liste[k]} <span class="not">${k}</span></td><td class="sayi">${sayi(o[k]?.n || 0)}</td><td class="sayi">${sayi(D.olayKisi[k]?.k || 0)}</td></tr>`).join("");
      }
      const diger = Object.keys(o).filter(k => !bilinen.has(k) && !k.startsWith("ai_"));
      if (diger.length) h += `<tr><td class="grup" colspan="3">Diğer</td></tr>` + diger.map(k => `<tr><td>${esc(k)}</td><td class="sayi">${sayi(o[k].n)}</td><td class="sayi">${sayi(D.olayKisi[k]?.k || 0)}</td></tr>`).join("");
      return `<div class="kart"><h2>Ne yapıyorlar <small>olay sayısı son ${durum.aralik} gün · kişi ${D.gun} gün</small></h2>
        <table><tr><th>Olay</th><th class="sayi">Kez</th><th class="sayi">Kişi</th></tr>${h}</table></div>`;
    }

    function ekranlar() {
      const m = {};
      for (const e of D.ekranlar) if (pOk(e.p)) { const x = m[e.ad] ||= { g: 0, sure: 0, k: 0 }; x.g += e.g; x.sure += e.sure; x.k += e.k; }
      const sat = Object.entries(m).filter(([ad]) => ad && ad !== "(not set)").sort((a, b) => b[1].sure - a[1].sure);
      const maks = Math.max(1, ...sat.map(([, v]) => v.sure));
      const bos = !sat.length ? `<p class="not">Ekran adları 2.4 build 16 / vc 14 ile gönderilmeye başlıyor; o sürümden önce hepsi "(not set)". İlk veriler yeni sürüm yayılınca dolacak.</p>` : "";
      return `<div class="kart"><h2>Nerede ne kadar vakit <small>${D.gun} gün, toplam etkileşim süresi</small></h2>${bos}
        <table><tr><th>Ekran</th><th class="sayi">Süre</th><th class="sayi">Görüntüleme</th><th class="sayi">Kişi</th><th class="sayi">Kişi başı</th></tr>
        ${sat.map(([ad, v]) => `<tr><td>${EKRAN[ad] || esc(ad)}<div class="cubuk"><i style="width:${v.sure / maks * 100}%"></i></div></td><td class="sayi">${sure(v.sure)}</td><td class="sayi">${sayi(v.g)}</td><td class="sayi">${sayi(v.k)}</td><td class="sayi">${sure(v.k ? v.sure / v.k : 0)}</td></tr>`).join("")}</table></div>`;
    }

    function ai() {
      const o = olayToplam();
      let fiyat = 0.15;
      try { fiyat = Number(localStorage.getItem(OTURUM + "-fiyat")) || 0.15; } catch (e) { }
      const sat = Object.keys(AI).filter(k => o[k]).map(k => [k, o[k]]);
      const top = sat.reduce((a, [, v]) => ({ n: a.n + v.n, v: a.v + v.v }), { n: 0, v: 0 });
      const bas = sinir(), gun = new Map();
      for (const r of D.olaylar) if (r.t >= bas && pOk(r.p) && AI[r.o]) gun.set(r.t, (gun.get(r.t) || 0) + r.n);
      const gunler = [...gun.keys()].sort();
      return `
        <div class="izgara">
          <div class="kart kpi"><div class="ad">İstek</div><div class="deger">${sayi(top.n)}</div><div class="alt">son ${durum.aralik} gün</div></div>
          <div class="kart kpi"><div class="ad">Token</div><div class="deger">${sayi(top.v)}</div><div class="alt">yeni sürümden itibaren</div></div>
          <div class="kart kpi"><div class="ad">Tahmini maliyet</div><div class="deger">$${(top.v / 1e6 * fiyat).toFixed(2)}</div><div class="alt">faturalandırma kapalıyken ücretsiz katman</div></div>
        </div>
        <div class="kart"><h2>Özelliğe göre</h2>
          <table><tr><th>Özellik</th><th class="sayi">İstek</th><th class="sayi">Token</th><th class="sayi">İstek başı</th></tr>
          ${sat.map(([k, v]) => `<tr><td>${AI[k]}</td><td class="sayi">${sayi(v.n)}</td><td class="sayi">${sayi(v.v)}</td><td class="sayi">${v.v ? sayi(v.v / v.n) : "-"}</td></tr>`).join("") || `<tr><td colspan="4" class="not">Henüz istek yok.</td></tr>`}</table>
          <p class="not" style="margin-top:10px">Milyon token başı fiyat ($): <input class="fiyat" id="fiyat" type="number" step="0.01" value="${fiyat}"> Flash Lite girdi 0,10 / çıktı 0,40; okumalar çoğunlukla girdi, karışık ~0,15.</p>
        </div>
        ${gunler.length > 1 ? `<div class="kart"><h2>Günlük istek</h2>${cizgi([{ d: gunler.map(t => gun.get(t)), c: "var(--violet)" }], gunler, 130)}</div>` : ""}`;
    }

    function kitle() {
      const tablo = (baslik, sat, k1) => `<div class="kart"><h2>${baslik}</h2><table>${sat.slice(0, 12).map(r => `<tr><td>${esc(r[k1])}</td><td class="sayi">${sayi(r.totalUsers ?? r.activeUsers)}</td></tr>`).join("")}</table></div>`;
      const surum = D.surumler.filter(r => pOk(r.platform.toLowerCase())).sort((a, b) => b.activeUsers - a.activeUsers)
        .map(r => ({ ad: `${r.platform} ${r.appVersion}`, activeUsers: r.activeUsers }));
      return `<div class="iki">
        ${tablo("Sürüm <small>aktif, 28 gün</small>", surum, "ad")}
        ${tablo("Ülke", D.ulkeler.sort((a, b) => b.totalUsers - a.totalUsers), "country")}
        ${tablo("Dil", D.diller.sort((a, b) => b.totalUsers - a.totalUsers), "language")}
        <div class="kart"><h2>Geri gelme <small>ilk haftaya göre</small></h2>${kohortTablo()}</div>
      </div>`;
    }

    function kohortTablo() {
      const hafta = t => { const d = new Date(t + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
      const fark = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5 / 7);
      const m = {};
      for (const r of D.kohort) {
        const h = hafta(r.ilk), w = fark(h, hafta(r.t));
        const x = m[h] ||= {}; x[w] = Math.max(x[w] || 0, 0) + r.k;
      }
      const haftalar = Object.keys(m).sort().slice(-8);
      return `<table><tr><th>Hafta</th><th class="sayi">Yeni</th>${[1, 2, 3, 4].map(i => `<th class="sayi">+${i}</th>`).join("")}</tr>
        ${haftalar.map(h => { const x = m[h], y = x[0] || 0; return `<tr><td>${h.slice(8)}.${h.slice(5, 7)}</td><td class="sayi">${sayi(y)}</td>${[1, 2, 3, 4].map(i => `<td class="sayi">${x[i] != null && y ? yuzde(x[i] / y) : ""}</td>`).join("")}</tr>`; }).join("")}</table>
        <p class="not" style="margin-top:8px">Hücre: o haftanın yeni kullanıcılarından kaç kişi n hafta sonra açtı (günlük aktiflerin toplamı, kaba).</p>`;
    }

    function ciz() {
      const secim = (id, ops, anahtar) => {
        document.getElementById(id).innerHTML = ops.map(([v, ad]) => `<button data-v="${v}" class="${String(durum[anahtar]) === String(v) ? "on" : ""}">${ad}</button>`).join("");
        document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { durum[anahtar] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; kaydet(); ciz(); });
      };
      secim("aralik", [[7, "7g"], [30, "30g"], [90, "90g"]], "aralik");
      secim("platform", [["hepsi", "Hepsi"], ["ios", "iOS"], ["android", "Android"]], "platform");
      document.getElementById("sekmeler").innerHTML = Object.entries(SEKMELER).map(([k, ad]) => `<button data-k="${k}" class="${durum.sekme === k ? "on" : ""}">${ad}</button>`).join("");
      document.querySelectorAll("#sekmeler button").forEach(b => b.onclick = () => { durum.sekme = b.dataset.k; kaydet(); ciz(); });
      const f = { ozet, kullanim, ekranlar, ai, kitle }[durum.sekme] || ozet;
      document.getElementById("ana").innerHTML = f();
      const fi = document.getElementById("fiyat");
      if (fi) fi.onchange = () => { try { localStorage.setItem(OTURUM + "-fiyat", fi.value); } catch (e) { } ciz(); };
      document.getElementById("alt").textContent = `Veri: ${new Date(D.uretim).toLocaleString("tr-TR")} · Firebase Analytics, ${D.toplam.totalUsers} kullanıcı / ${D.gun} gün · Tutar, ad ya da metin hiçbir olayda yok.`;
    }

    async function ac(parola) {
      const r = await fetch("data.enc.json", { cache: "no-store" });
      D = await coz(await r.json(), parola);
      try { sessionStorage.setItem(OTURUM, parola); } catch (e) { }
      document.getElementById("gate").hidden = true;
      document.getElementById("uygulama").hidden = false;
      ciz();
    }
    document.getElementById("giris").onsubmit = async e => {
      e.preventDefault();
      try { await ac(document.getElementById("pw").value); }
      catch (err) { document.getElementById("hata").textContent = "Parola yanlış ya da veri okunamadı."; }
    };
    document.getElementById("tema").onclick = () => {
      const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("bamtech-panel-tema", t); } catch (e) { }
    };
    (async () => { let p = null; try { p = sessionStorage.getItem(OTURUM); } catch (e) { } if (p) try { await ac(p); } catch (e) { } })();
  </script>
</body>

</html>

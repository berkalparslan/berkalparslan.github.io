/* Ekran süreleri: ev.screen_<ad>_sec saniye, ev.screen_<ad> açılış.
   screen_time olayı da screen_time* altına düşer, o bir ekran değil. */
function ekranHarita(o) {
  const m = {}, e = o?.ev || {};
  for (const [k, v] of Object.entries(e)) {
    const r = /^screen_(.+)_sec$/.exec(k); if (!r) continue;
    const n = r[1];
    if (n === "time" || (n.startsWith("time_") && e[`screen_${n.slice(5)}_sec`] != null && n !== "time_value")) continue;
    (m[n] ||= { sec: 0, views: 0 }).sec += +v || 0;
  }
  for (const n of Object.keys(m)) m[n].views = +(e[`screen_${n}`] || 0);
  return m;
}
function ekranTopla(l) {
  const m = {};
  for (const x of l || []) for (const [n, v] of Object.entries(ekranHarita(x))) { const t = m[n] ||= { sec: 0, views: 0, kisi: 0 }; t.sec += v.sec; t.views += v.views; if (v.sec > 0) t.kisi++; }
  return m;
}
function evOnek(l, onek, atla = []) {
  const m = {};
  for (const x of l || []) for (const [k, v] of Object.entries(x.ev || {}))
    if (k.startsWith(onek) && !k.endsWith("_sec") && !atla.some(s => k.startsWith(s))) { const n = k.slice(onek.length); m[n] = (m[n] || 0) + (+v || 0); }
  return m;
}

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/lab-icons/bam-sports-64.png">
<link rel="apple-touch-icon" href="/assets/lab-icons/bam-sports-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Bam Sports Panel</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("bamtech-panel-tema"); } catch (e) { }
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  /* Eski sayfa adresleri (#overview, #users ...) yeni kimliklere. */
  var eski = { overview: "genel", live: "canli", screens: "ekranlar", revenue: "paywall", engage: "kullanim", users: "kullanicilar",
    social: "sosyal", leagues: "ligler", ga4: "analytics", official: "resmi", posts: "akis", push: "bildirim", sent: "gonderilenler", settings: "ayarlar" };
  var h = location.hash.slice(1);
  if (eski[h]) history.replaceState(null, "", location.pathname + location.search + "#" + eski[h]);
})();
</script>
<link rel="stylesheet" href="/lab/assets/panel.css?v=6">
<style>
/* Bam Sports'a özel parçalar. Ortak düzen panel.css'te; burada yalnız bu panelin
   etiketleri (uygulama noktası, rozetler, zaman çizelgesi) ve bildirim formu. */
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--soft) 15%,transparent);color:var(--soft)}
.pill.pro{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.sky{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky)}
.pill.err{background:color-mix(in srgb,var(--rose) 16%,transparent);color:var(--rose)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.app{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.app i,.who i,.linkchip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.who b{font-weight:700}.who small{display:block;color:var(--soft);font-size:11px;font-weight:500}
.badges{display:inline-flex;gap:4px;flex-wrap:nowrap;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.tl{font-size:13px;border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{padding:3px 0}.tl time{color:var(--soft);font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.tl .day{color:var(--soft);font-size:11px;font-weight:800;letter-spacing:.05em;margin-top:8px}
.tl .buy{color:var(--warn);font-weight:700}.tl .pw{color:var(--sky)}.tl .match{color:var(--ok);font-weight:600}
.linkchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;cursor:pointer;background:transparent;color:var(--ink);font-weight:600;margin:0 4px 4px 0}
.linkchip:hover{border-color:var(--accent)}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.bar2 select,.bar2 input{width:auto;padding:7px 10px;font-size:13px}
.bar2 input[type=search]{min-width:200px}
.ofacc{display:flex;gap:10px;align-items:center}.ofacc img{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 10px}.chk input{width:auto}
button.second{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.tbtn{padding:5px 10px;font-size:12px}
button.ghost.kirmizi{color:var(--rose)}
.top select.uyg{width:auto;padding:6px 10px;font-size:12px;border-radius:999px}
.top select.uyg.on{border-color:var(--accent);color:var(--ink)}
.demo-serit{background:var(--warn);color:#1b1300;text-align:center;font-size:12px;font-weight:700;padding:5px}
.izgara2>.card,.izgara3>.card{margin:10px 0}
.alt-not{font-size:12px;color:var(--soft);margin:6px 0 0}
.uygulama-ad{display:inline-flex;gap:6px;align-items:center}
.vt td .pill{margin-right:3px}
.kucuk-dl{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;font-size:13px}
.kucuk-dl>div:nth-child(odd){color:var(--soft)}
@media(max-width:480px){.kucuk-dl{grid-template-columns:1fr}.kucuk-dl>div:nth-child(odd){margin-top:6px}}
/* Bildirim formu (bu panelin beş uygulamalı hali) */
.pushgrid{grid-template-areas:"who side" "text side" "send side" "res side" "stats side"}
.pushgrid>*{min-width:0}.pg-who{grid-area:who}.pg-text{grid-area:text}.pg-send{grid-area:send}.pg-res{grid-area:res}.pg-stats{grid-area:stats}
.pg-side{grid-area:side;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
@media(max-width:1060px){.pushgrid{grid-template-areas:"who" "text" "side" "send" "res" "stats"}.pg-side{position:static;max-height:none;overflow:visible}}
.mode{text-align:left;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
.mode b{display:block;font-size:15px}.mode span{display:block;color:var(--soft);font-size:12px;font-weight:500;margin-top:2px;line-height:1.35}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--soft)}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--soft);margin:0 0 4px}
.field label small{font-weight:600;font-variant-numeric:tabular-nums}.field label small.over{color:var(--rose)}
.field.bad input,.field.bad textarea{border-color:var(--rose)}
.lang{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--soft);margin:0 0 8px}
.langs{margin-top:12px}
.langpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}details.more summary{cursor:pointer;font-weight:700;font-size:14px}
.appicons{display:flex;gap:5px}
.appicons button{padding:0;background:transparent;border-radius:9px;border:2px solid transparent;line-height:0}
.appicons button.on{border-color:var(--accent)}
.appicons img{width:26px;height:26px;border-radius:7px}
.screen .bar{position:absolute;z-index:1;bottom:8px;left:50%;transform:translateX(-50%);width:110px;height:4px;border-radius:3px;background:rgba(255,255,255,.9)}
.audbox{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.audbox .row{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--soft)}
.note.err{color:var(--ink);background:color-mix(in srgb,var(--rose) 10%,transparent)}
.note.uyari{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.note.okn{background:color-mix(in srgb,var(--ok) 10%,transparent)}
textarea{resize:vertical;min-height:72px;line-height:1.4}
code{font:12px ui-monospace,Menlo,monospace}
.links a{display:block;padding:6px 0}
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.wrap{white-space:normal;min-width:140px;max-width:320px}
.vt .kaydir{max-width:100%}
</style>
</head>
<body>
<script type="module" src="./panel.js?v=6"></script>
</body>
</html>

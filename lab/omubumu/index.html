<script type="module">
import { getFirestore, connectFirestoreEmulator, collection, collectionGroup, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc,
  addDoc, query, where, orderBy, limit, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { panelKabuk } from "/lab/assets/shell.js?v=2";
import { el, kart, tiles, veriTablo, dagilimTablo, sayi, sure, tarihTam, tarihHucre, yuzde, para, zaman, ms, istGun, istGunBasi,
  donem, farkYazi, surumListesi, surumSuz, surumNotlari, surumNotlariKutu, kullaniciCekmecesi } from "/lab/assets/panel.js?v=6";
import { gunlukCubuk, cizgi, huni, yatayCubuk, saatIsi, saatMatrisi, kivilcim, gunleriDoldur } from "/lab/assets/grafik.js?v=1";
import { pushSayfasi, gonderilenlerSayfasi, kisiyeBildirim, onayKarti } from "/lab/assets/push.js?v=3";
import { dunyaHaritasi } from "/lab/assets/harita.js?v=1";

/* Proje kimligi herkese acik (istemci SDK'si boyle calisir). Asil kapi
   Firestore kurallari: yonetici admins/{uid} belgesiyle taninir. Kabuktaki
   e-posta kontrolu ikinci katman: yetkisiz biri kirik panel yerine mesaj gorur. */
const firebaseConfig = {
  apiKey: "AIzaSyBv0heuN3iPZSBGhg3wCv2Itu5Tsdke2Qc",
  authDomain: "thisone-ba533.firebaseapp.com",
  projectId: "thisone-ba533",
  storageBucket: "thisone-ba533.firebasestorage.app",
  messagingSenderId: "1005769189464",
  appId: "1:1005769189464:web:70e4831bdb45782b3e422d",
};
const YONETICI = "aberkalparslan@gmail.com";
const SLUG = "o-mu-bu-mu";
/* Gorsel yukleme ve bildirim ayni Worker'da (thisOneApp/worker-upload). */
const WORKER = "https://omubumu-upload.kittapcom.workers.dev";

/* Ekran anahtarlari uygulamada sozlesme (Telemetry.swift Screen); burada
   yalniz Turkce etiketleri degisir. */
const EKRAN = { home: "Ana ekran", dilemma: "İkilem", brackets: "Turnuva listesi", size: "Boy seçimi", play: "Turnuva oynanışı",
  result: "Sonuç", mine: "Kendi turnuvalarım", editor: "Turnuva düzenleyici", friends: "Arkadaş", library: "Kitaplık",
  settings: "Ayarlar", paywall: "Paywall", account: "Hesap", closed: "Kapalı", "—": "Ekran arası" };
const ekranAdi = k => EKRAN[k] || k || "";
const KAYNAK = { general: "Ayarlardan", secondTournament: "İkinci turnuva", optionCap: "Seçenek sınırı", afterAd: "Reklamdan sonra",
  afterResult: "Sonuç ekranı teklifi" };
const kaynakAdi = k => KAYNAK[k] || k || "";
const PLATFORM = { ios: "iPhone", android: "Android", watchos: "Apple Watch", wearos: "Wear OS" };
const pAd = p => PLATFORM[p] || p || "bilinmiyor";
const KATMAN = { pro: "Pro", noads: "Reklamsız", free: "Ücretsiz" };
const REKLAM = { tournamentFinished: "Turnuva sonu", dilemmaAdvance: "İkilem geçişi" };
const SEBEP = { inappropriate: "Uygunsuz görsel", wrong: "Yanlış ad ya da foto", copyright: "Telif", other: "Diğer" };
const DURUM = { approved: "Onaylı", pending: "Bekliyor", rejected: "Reddedildi" };
const GORUNUR = { public: "Herkese açık", unlisted: "Bağlantıyla", private: "Gizli" };
const MOD = { knockout: "Eleme", winnerStays: "Kazanan kalır" };
/* Magaza liste fiyatlari (ASC). Satis raporunda tutar yoksa "tahmini". */
const FIYAT = { pro: { ad: "Pro", fiyat: 4.99, para: "USD" }, noads: { ad: "Reklamsız", fiyat: 1.99, para: "USD" } };
const GA_OLAY = { first_open: "İlk açılış", session_start: "Oturum", screen_view: "Ekran görüntüleme", user_engagement: "Etkileşim",
  tournament_start: "Turnuva başladı", tournament_finish: "Turnuva bitti", dilemma_answer: "İkilem oyu", ad_shown: "Reklam",
  paywall_view: "Paywall", app_remove: "Kaldırma", friend_join: "Arkadaş turnuvasına katılma", friend_share: "Arkadaş turnuvası paylaşma",
  own_tournament_create: "Kendi turnuvası", app_clear_data: "Veri silme", app_update: "Güncelleme", in_app_purchase: "Satın alma (mağaza)",
  purchase_done: "Satın alma (uygulama)" };

let K = null, db = null;
const V = {
  brackets: [], questions: [], categories: [], users: [], reports: [], daily: {}, stats: [], friends: [], runs: [], votes: [], events: [],
  pushes: null, sales: undefined, ga4: undefined, sablonOk: false, erisim: {}, yuklendi: null,
};

// ════════════════════════════════════════════════════════════════════════
// Yardimcilar
// ════════════════════════════════════════════════════════════════════════

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = v => { const d = zaman(v); return d ? d.toISOString() : null; };
const sayac = (arr, f) => { const m = {}; for (const x of arr) { const k = f(x); if (k == null || k === "") continue; m[k] = (m[k] || 0) + 1; } return m; };
const topla = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const icinde = (t, D) => { const x = ms(t); return x > 0 && x >= D.bas && x <= D.son; };
const oncede = (t, D) => { if (D.oncekiBas == null) return false; const x = ms(t); return x >= D.oncekiBas && x < D.oncekiSon; };
const fark = (arr, f, D, ters) => ({ simdi: arr.filter(x => icinde(f(x), D)).length, once: D.oncekiBas == null ? null : arr.filter(x => oncede(f(x), D)).length, ters });
const donemAdi = a => a === 0 ? "tüm zamanlar" : a === 1 ? "bugün" : `son ${a} gün`;
const oran = (a, b, n = 1) => b ? `%${(a / b * 100).toFixed(n).replace(".", ",")}` : "-";
const hucre = (n, d) => ({ d: d ?? sayi(n || 0), s: Number(n) || 0 });
const sureH = s => ({ d: s ? sure(s) : "", s: s || 0 });
const kisaId = id => String(id || "").slice(0, 8);
const toast = m => { const t = el("div", "toast"); t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
const uyari = (c, html) => c.appendChild(el("div", "uyari-satir", html));
const not = (c, html) => c.appendChild(el("p", "muted", html));
const ciz = () => K && K.ciz();
function nekadar(t) {
  const x = ms(t); if (!x) return "";
  const dk = Math.round((Date.now() - x) / 6e4);
  if (dk < 1) return "az önce";
  if (dk < 60) return `${dk} dk önce`;
  const sa = Math.round(dk / 60);
  return sa < 24 ? `${sa} saat önce` : `${Math.round(sa / 24)} gün önce`;
}
function dugme(ad, tik, sinif = "ghost") {
  const b = el("button", sinif, esc(ad));
  b.onclick = e => { e.stopPropagation(); tik(e); };
  return b;
}
function grup(...ogeler) { const d = el("div", "hucre-dugme"); ogeler.filter(Boolean).forEach(o => d.appendChild(o)); d.onclick = e => e.stopPropagation(); return d; }
function resim(url, sinif = "k") { const i = el("img", sinif); i.alt = ""; i.loading = "lazy"; if (url) i.src = url; i.onerror = () => { i.removeAttribute("src"); }; return i; }
/* Grafik kutusu: once karta konur (genislik olculsun), sonra cizilir. */
function grafikKart(c, baslik, ciz, altNot) {
  const kutu = el("div");
  const k = kart(baslik, kutu);
  if (altNot) k.appendChild(el("p", "muted", altNot));
  c.appendChild(k);
  try { ciz(kutu); } catch (e) { console.error(e); kutu.appendChild(el("p", "muted", "Grafik çizilemedi.")); }
  return k;
}
function izgara(c, n = 2) { const g = el("div", n === 3 ? "izgara3" : "izgara2"); c.appendChild(g); return g; }
/* Donemin gun dizisi (Turkiye gunleri). Tumu: en eski veriden, en fazla 365 gun. */
function gunAraligi(D, enEski) {
  const son = istGun(Date.now());
  const bas = istGun(D.bas || Math.max(enEski || Date.now(), Date.now() - 365 * 864e5));
  return [bas, son];
}
function gunluk(D, seriler, enEski) {
  const h = {};
  for (const [alan, zamanlar] of Object.entries(seriler)) for (const t of zamanlar) {
    if (!icinde(t, D)) continue;
    const g = istGun(t); (h[g] ||= {})[alan] = (h[g][alan] || 0) + 1;
  }
  const [b, s] = gunAraligi(D, enEski);
  return gunleriDoldur(h, b, s).map(g => { const o = { t: g.t }; for (const a of Object.keys(seriler)) o[a] = g[a] || 0; return o; });
}
const enEskiOf = (...listeler) => Math.min(Date.now(), ...listeler.flat().map(ms).filter(Boolean));

/* Surum filtresi kurulum (kullanici) bazli: secili surumdeki kullanicilarin
   oyunlari, oylari ve olaylari. Katalog sayaclari surume bolunemez. */
function baglam() {
  const D = donem(K.aralik ?? 7);
  const users = surumSuz(V.users, K.surum);
  const filtreli = !!K.surum;
  const uids = new Set(users.map(u => u.id));
  const suz = l => filtreli ? l.filter(x => uids.has(x.uid)) : l;
  return { D, users, filtreli, uids, runs: suz(V.runs), votes: suz(V.votes), events: suz(V.events), friends: filtreli ? V.friends.filter(f => uids.has(f.hostUid)) : V.friends };
}
const surumNotu = (c, b) => { if (b.filtreli) not(c, `Sürüm filtresi açık (<b>${esc(K.surum)}</b>): kurulum bazlı sayılar o sürümdeki kullanıcılardan. Günlük <code>stats/</code> toplamlarına ve katalog sayaçlarına uygulanmaz.`); };

/* users/{uid} belgesinden panelin kullandigi duz alanlar. */
function hesapTuru(u) {
  const p = u.providers || [];
  if (p.includes("apple.com")) return "Apple";
  if (p.includes("google.com")) return "Google";
  if (p.includes("password")) return "E-posta";
  if (p.includes("watch")) return "Saat (anonim)";
  return u.isAnonymous === false ? "Hesaplı" : "Anonim";
}
function kullaniciHazirla(d) {
  const u = { ...d };
  for (const a of ["createdAt", "lastSeenAt", "purchasedAt"]) u[a] = iso(d[a]);
  u.ev = d.ev || {};
  u.hesap = hesapTuru(u);
  u.telemetri = !!(d.lang || d.sessions || u.ev.sessions || d.screen);
  u.oturum = Number(u.ev.sessions || d.sessions || 0);
  u.sure = Number(d.totalSeconds || 0);
  u.tier = d.tier || (u.telemetri ? "free" : "");
  u.odeyen = u.tier === "pro" || u.tier === "noads";
  return u;
}
function aktiflik(u) {
  const x = ms(u.lastSeenAt); if (!x) return "Hiç";
  if (x >= istGunBasi()) return "Bugün";
  const g = (Date.now() - x) / 864e5;
  return g <= 7 ? "7 gün" : g <= 30 ? "30 gün" : "30+ gün sessiz";
}
const canliMi = u => u.screen && u.screen !== "closed" && Date.now() - ms(u.lastSeenAt) < 150e3;
const kullanici = id => V.users.find(u => u.id === id);
const kisiAdi = u => u ? (u.displayName || (u.isAnonymous ? "anonim " + kisaId(u.id) : kisaId(u.id))) : "";
const kisiHucre = id => { const u = kullanici(id); return u ? kisiAdi(u) : kisaId(id); };
/* Push sayfasi icin kurulum bicimi. Uygulama FCM jetonu tutmuyor (yalniz konu). */
const pushKurulumlar = () => V.users.filter(u => u.platform === "ios" || u.platform === "android").map(u => ({
  id: u.id, language: u.lang || "", platform: u.platform, lastSeen: u.lastSeenAt, notif: u.notif === true ? true : u.notif === false ? false : null,
  pro: u.odeyen, signedIn: u.isAnonymous === false, fcm: null, tester: false, ev: u.ev, handle: null, displayName: u.displayName,
}));

/* Oylardan seri: ust uste oy verilen Turkiye gunleri. */
function seriler(votes) {
  const gun = {};
  for (const v of votes) { if (!v.uid || !v.at) continue; (gun[v.uid] ||= new Set()).add(istGun(v.at)); }
  const bugun = istGun(Date.now()), dun = istGun(Date.now() - 864e5);
  const out = {};
  for (const [uid, s] of Object.entries(gun)) {
    const l = [...s].sort();
    let enUzun = 1, cur = 1;
    for (let i = 1; i < l.length; i++) {
      const fark = (Date.parse(l[i]) - Date.parse(l[i - 1])) / 864e5;
      cur = fark === 1 ? cur + 1 : 1; enUzun = Math.max(enUzun, cur);
    }
    const son = l[l.length - 1];
    let simdi = 0;
    if (son === bugun || son === dun) { simdi = 1; for (let i = l.length - 1; i > 0 && (Date.parse(l[i]) - Date.parse(l[i - 1])) / 864e5 === 1; i--) simdi++; }
    out[uid] = { simdi, enUzun, gun: l.length, son };
  }
  return out;
}

// ════════════════════════════════════════════════════════════════════════
// Veri
// ════════════════════════════════════════════════════════════════════════

const tumu = async (q) => (await getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
/* Koleksiyon grubu: once siralı (indeks gerekir), olmazsa sirasiz. Izin yoksa bos. */
async function grupOku(ad, alan, n) {
  try {
    const s = await getDocs(query(collectionGroup(db, ad), orderBy(alan, "desc"), limit(n)));
    V.erisim[ad] = "ok";
    return s.docs.map(d => ({ id: d.id, uid: d.ref.parent.parent?.id, ...d.data() }));
  } catch (e) {
    if (e.code === "permission-denied") { V.erisim[ad] = "izin yok"; return []; }
    try {
      const s = await getDocs(query(collectionGroup(db, ad), limit(n)));
      V.erisim[ad] = "sırasız (indeks yok)";
      return s.docs.map(d => ({ id: d.id, uid: d.ref.parent.parent?.id, ...d.data() }));
    } catch (e2) { V.erisim[ad] = e2.code || e2.message; return []; }
  }
}
const kos = r => ({ ...r, playedAt: iso(r.playedAt) });

async function yukle(k) {
  K = k;
  if (demo) { demoVeri(); k.durum("Demo verisi · Firestore'a dokunulmuyor"); return; }
  if (!db) { db = getFirestore(k.app); if (emu) connectFirestoreEmulator(db, "127.0.0.1", 8080); }
  const [brackets, questions, categories, users, reports, daily, stats, friends] = await Promise.all([
    tumu(collection(db, "brackets")), tumu(collection(db, "questions")),
    tumu(query(collection(db, "categories"), orderBy("order"))).catch(() => tumu(collection(db, "categories"))),
    tumu(query(collection(db, "users"), limit(5000))),
    tumu(query(collection(db, "reports"), orderBy("createdAt", "desc"), limit(1000))).catch(() => tumu(collection(db, "reports"))),

  const gunler = [...Array(14)].map((_, i) => istGun(Date.now() + i * 864e5));

  const g = el("div", "gunler"); c.appendChild(g);
  for (const gun of gunler) {
    const k = el("div", "card");
    k.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${gun === gunler[0] ? "Bugün" : esc(tarihTam(gun))}</b><span class="muted mono">${gun}</span></div>`;
    const sec = (alan, liste, etiket, baslik) => {

      s.innerHTML = `<option value="">otomatik</option>` + liste.map(x => `<option value="${esc(x.id)}" ${V.daily[gun]?.[alan] === x.id ? "selected" : ""}>${esc(etiket(x))}</option>`).join("");
      s.onchange = async () => { const m = { ...(V.daily[gun] || {}) }; if (s.value) m[alan] = s.value; else delete m[alan]; if (Object.keys(m).length) V.daily[gun] = m; else delete V.daily[gun]; await kaydet(`${gun} kaydedildi`); };

    const yb = dugme("+ Yeni ikilem yaz", () => duzenle("questions", null, async id => { V.daily[gun] = { ...(V.daily[gun] || {}), questionId: id }; await kaydet(`${gun}: yeni ikilem güne atandı`); }));

/* Gorsel: tarayicida 1200 px'e kucultulup JPEG'e cevrilir, Worker Firebase
   kimligini ve admins/{uid} belgesini dogrulayip R2'ye yazar. */
async function kucult(dosya, enBuyuk = 1200, kalite = 0.82) {
  const bitmap = await createImageBitmap(dosya);
  const olcek = Math.min(1, enBuyuk / Math.max(bitmap.width, bitmap.height));
  const tuval = document.createElement("canvas");
  tuval.width = Math.round(bitmap.width * olcek); tuval.height = Math.round(bitmap.height * olcek);
  tuval.getContext("2d").drawImage(bitmap, 0, 0, tuval.width, tuval.height);
  bitmap.close?.();
  return new Promise((ok, hata) => tuval.toBlob(b => (b ? ok(b) : hata(new Error("görsel dönüştürülemedi"))), "image/jpeg", kalite));
}
/* Anahtarsiz iki kaynak: Openverse (ticari kullanim ve degisiklige izinli
   lisanslar) ve Wikimedia Commons. Istekler tarayicidan gider. */
async function gorselAra(q) {
  const [ov, wm] = await Promise.allSettled([
    fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=12&license_type=commercial,modification`).then(r => r.json()),
    fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=320&format=json&origin=*`).then(r => r.json()),
  ]);
  const sonuc = [];
  if (ov.status === "fulfilled") for (const r of ov.value?.results || []) sonuc.push({ kucuk: r.thumbnail || r.url, buyuk: r.url, ad: r.title || "", lisans: `${r.license || ""} ${r.license_version || ""}`.trim().toUpperCase(), kaynak: r.source || "openverse" });
  if (wm.status === "fulfilled") for (const s of Object.values(wm.value?.query?.pages || {})) {
    const ii = s.imageinfo?.[0]; if (!ii) continue;
    const kucuk = ii.thumburl || ii.url;
    sonuc.push({ kucuk, buyuk: kucuk.includes("/320px-") ? kucuk.replace("/320px-", "/1200px-") : ii.url, ad: String(s.title).replace(/^File:/, ""), lisans: ii.extmetadata?.LicenseShortName?.value || "Commons", kaynak: "wikimedia" });
  }
  return sonuc;
}
async function gorselAktar(kaynakURL, tur, klasor, ad) {
  const token = await K.token();
  const y = await fetch(`${WORKER}/a/${tur}/${encodeURIComponent(klasor)}/${encodeURIComponent(ad)}`, { method: "PUT", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({ url: kaynakURL }) });
  const v = await y.json().catch(() => ({})); if (!y.ok) throw new Error(v.error || `HTTP ${y.status}`); return v.url;
}
async function gorselYukle(dosya, tur, klasor, ad) {
  const blob = await kucult(dosya);
  const token = await K.token();
  const y = await fetch(`${WORKER}/a/${tur}/${encodeURIComponent(klasor)}/${encodeURIComponent(ad)}`, { method: "PUT", headers: { Authorization: `Bearer ${token}`, "Content-Type": "image/jpeg" }, body: blob });
  const v = await y.json().catch(() => ({})); if (!y.ok) throw new Error(v.error || `HTTP ${y.status}`); return { url: v.url, kb: Math.round(blob.size / 1024) };
}
const slug = t => String(t || "").replace(/[çğıöşüİÇĞÖŞÜ]/g, c => ({ ç: "c", ğ: "g", ı: "i", ö: "o", ş: "s", ü: "u", İ: "i", Ç: "c", Ğ: "g", Ö: "o", Ş: "s", Ü: "u" }[c])).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/&/g, " ve ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
const kapakHesapla = (options, stats) => [...options].sort((x, y) => ((stats[y.id]?.wins || 0) - (stats[x.id]?.wins || 0)) || ((stats[y.id]?.votes || 0) - (stats[x.id]?.votes || 0))).filter(o => o.imageURL).slice(0, 4).map(o => o.imageURL);
const dosyaAlani = (hedef, ad) => `<div class="yukle"><input type="file" accept="image/*" data-hedef="${hedef}" data-ad="${ad}"><button type="button" class="ghost" data-arabul>Görsel ara</button><span class="muted"></span></div>
  <div class="arama kapali"><div class="arac-satir"><input type="search" class="ara-q" placeholder="ör. Fatih Terim"><button type="button" data-ara-git style="padding:6px 12px;font-size:12px">Ara</button><span class="ara-not muted"></span></div><div class="sonuclar"></div></div>`;
const secenekHtml = o => `<div class="secenek"><img src="${esc(o.imageURL || "")}" alt="" loading="lazy"><input name="oid" placeholder="id" value="${esc(o.id)}" class="mono"><input name="oname" placeholder="ad" value="${esc(o.name)}"><input name="onameEn" placeholder="ad (EN)" value="${esc(o.nameEn)}"><input name="oimg" placeholder="görsel URL" value="${esc(o.imageURL)}">${dosyaAlani("oimg", "oname")}</div>`;
const TUR_AD = { questions: "ikilem", brackets: "turnuva", categories: "kategori" };

  const yerlestir = (a, url, n) => { a.urlAlan.value = url; if (a.onizleme) a.onizleme.src = url; a.not.textContent = n; };
  const bagla = () => {
    d.querySelectorAll("input[type=file][data-hedef]").forEach(f => f.onchange = async () => {

    kutu.querySelectorAll("figure").forEach(fig => fig.onclick = async () => {

async function sayaclariYenile() {
  if (!await onayKarti({ baslik: "Sayaçlar yeniden hesaplansın mı?", satirlar: [["Turnuva", sayi(V.brackets.length)], ["Kategori", sayi(V.categories.length)]], not: "Toplamlar seçenek istatistiklerinden yeniden yazılır; saatte biten turnuvalar istatistiğe girmediği için sayılar düşebilir.", evet: "Çalıştır" })) return;
  const ok = await yaz(async () => {
    for (const x of V.brackets) {
      const st = x.stats || {}, o = x.options || [];
      await updateDoc(doc(db, "brackets", x.id), { optionCount: o.length, cover: kapakHesapla(o, st), totalPlays: Object.values(st).reduce((s, y) => s + (y.wins || 0), 0), totalVotes: Object.values(st).reduce((s, y) => s + (y.votes || 0), 0), updatedAt: serverTimestamp() });
    }
    for (const x of V.categories) await updateDoc(doc(db, "categories", x.id), { questionCount: V.questions.filter(q => (q.categories || []).includes(x.name)).length });
  }, `${V.brackets.length} turnuva, ${V.categories.length} kategori güncellendi`);
  if (ok && !demo) await K.yenile();
}
function disaAktar() {
  const veri = { exportedAt: new Date().toISOString(), categories: V.categories, questions: V.questions, brackets: V.brackets };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(veri, null, 2)], { type: "application/json" })); a.download = `omubumu-katalog-${istGun(Date.now())}.json`; a.click();

async function iceAktar(e) {
  const dosya = e.target.files[0]; if (!dosya) return;
  let kayitlar;
  try { kayitlar = JSON.parse(await dosya.text()); } catch (err) { toast("JSON okunamadı"); return; }
  if (!Array.isArray(kayitlar)) { toast("Dizi bekleniyordu"); return; }
  const say2 = sayac(kayitlar, x => x.koleksiyon);
  if (!await onayKarti({ baslik: `${kayitlar.length} kayıt yazılsın mı?`, satirlar: Object.entries(say2).map(([k, v]) => [k, sayi(v)]), not: "Aynı id'nin üzerine birleştirerek yazar.", evet: "Yaz" })) { e.target.value = ""; return; }
  let n = 0;
  const ok = await yaz(async () => {
    let bt = writeBatch(db);
    for (const k of kayitlar) {
      const { koleksiyon, id, ...alan } = k; if (!koleksiyon || !id) continue;
      bt.set(doc(db, koleksiyon, id), { ...alan, updatedAt: serverTimestamp() }, { merge: true });
      if (++n % 400 === 0) { await bt.commit(); bt = writeBatch(db); }
    }
    await bt.commit();
  }, null);
  const s = document.getElementById("iceSonuc"); if (s) s.textContent = ok ? `${n} kayıt yazıldı` : "Yazılamadı";
  e.target.value = "";
  if (ok && !demo) await K.yenile();
}

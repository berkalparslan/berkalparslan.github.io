// ── Kucuk yardimcilar ──────────────────────────────────────────────────────

const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const say = (liste, f) => liste.reduce((m, x) => { const k = f(x); if (k != null && k !== "") m[k] = (m[k] || 0) + 1; return m; }, {});
const topla = (liste, f) => liste.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const n = v => Number(v) || 0;
const ort = (liste, f) => liste.length ? topla(liste, f) / liste.length : 0;
const ondalik = (v, b = 1) => Number(v || 0).toFixed(b).replace(".", ",");
const slug = t => String(t ?? "").toLowerCase().replace(/[^a-z0-9]/g, "_").slice(0, 40);

const ulke = k => { if (!k) return "Bilinmiyor"; try { return ulkeAdlari?.of(k) || k; } catch (e) { return k; } };

const evi = (i, k) => n(i?.ev?.[k]);
const kisa = id => String(id || "").slice(0, 8);

function notSatir(c, html, sinif = "note") { const d = el("div", sinif, html); c.appendChild(d); return d; }

function kovala(degerler, sinirlar, bicim) {
  const m = {};
  for (const [ad] of sinirlar) m[ad] = 0;
  for (const v of degerler) {
    const k = sinirlar.find(([, alt, ust]) => v >= alt && v < ust);
    if (k) m[k[0]]++;
  }
  return Object.entries(m).filter(([, v]) => v || !bicim);
}
const SURE_KOVA = [["10 sn altı", 0, 10], ["10-30 sn", 10, 30], ["30-60 sn", 30, 60], ["1-3 dk", 60, 180], ["3-10 dk", 180, 600], ["10-30 dk", 600, 1800], ["30 dk üstü", 1800, 1e9]];

const onekten = (ev, on, adlar = {}) => Object.fromEntries(Object.entries(ev).filter(([k]) => k.startsWith(on) && !k.endsWith("_sec")).map(([k, v]) => [adlar[k.slice(on.length)] || k.slice(on.length), v]));

// ── Veri ───────────────────────────────────────────────────────────────────

const ZAMAN_ALANLARI = ["firstSeen", "lastSeen", "purchasedAt"];
function kurulumDuzelt(k) {
  for (const a of ZAMAN_ALANLARI) { const t = zaman(k[a]); k[a] = t ? t.toISOString() : null; }
  if (!k.ev || typeof k.ev !== "object") k.ev = {};
  return k;
}
async function kurulumlariOku() {
  const snap = await getDocs(collection(db, "installs"));
  return snap.docs.map(d => kurulumDuzelt({ id: d.id, ...d.data() }));
}
async function gunleriOku() {
  const snap = await getDocs(collection(db, "stats"));
  return snap.docs.map(d => ({ id: d.id, ...d.data(), ev: d.data().ev || {} })).sort((a, b) => a.id < b.id ? -1 : 1);
}
const olayKaydi = (d, iid) => {
  const x = d.data();
  return { iid: iid || d.ref.parent.parent?.id || "", t: ms(x.t), e: String(x.e || ""), p: x.p != null ? String(x.p) : "", s: n(x.s) };
};
async function olaylariOku(kurulumlar) {
  const bas = Timestamp.fromMillis(Date.now() - OLAY_GUN * 864e5);
  try {
    const snap = await getDocs(query(collectionGroup(db, "events"), where("t", ">=", bas), orderBy("t", "desc"), limit(OLAY_SINIR)));
    return { liste: snap.docs.map(d => olayKaydi(d)), tavan: snap.size >= OLAY_SINIR, kaynak: "tek sorgu" };
  } catch (e) {
    if (kurulumlar.length > 80) throw e;
    const parca = await Promise.all(kurulumlar.map(k => getDocs(query(collection(db, "installs", k.id, "events"), where("t", ">=", bas), orderBy("t", "desc"), limit(400)))
      .then(s => s.docs.map(d => olayKaydi(d, k.id))).catch(() => [])));
    return { liste: parca.flat().sort((a, b) => b.t - a.t), tavan: false, kaynak: "kurulum kurulum (indeks hazır değil: " + (e.code || e.message) + ")" };
  }
}

async function yukle(k) {
  K = k;
  if (!db && k.app) db = getFirestore(k.app);
  satisBelge = undefined;
  try {
    if (demo) {
      const s = sahte();
      veri = { installs: s.installs, days: s.days, harita: new Map(s.installs.map(i => [i.id, i])) };
      olay = { liste: s.events, hata: "", tavan: false, kaynak: "demo" };
      satisBelge = s.satis;
    } else {
      const [installs, days] = await Promise.all([kurulumlariOku(), gunleriOku()]);
      veri = { installs, days, harita: new Map(installs.map(i => [i.id, i])) };
      try { const o = await olaylariOku(installs); olay = { ...o, hata: "" }; }
      catch (e) { olay = { liste: [], hata: e.code || e.message, tavan: false, kaynak: "" }; }
    }
    notlar = await surumNotlari(SLUG).catch(() => []);
    k.durum(`${demo ? "Demo veri · " : ""}${sayi(veri.installs.length)} kurulum · ${sayi(veri.days.length)} gün kaydı · ${sayi(olay.liste?.length || 0)} olay${olay.tavan ? " (sınır)" : ""}`);
  } catch (e) {
    k.durum("Hata: " + (e.code || e.message));
    veri = { installs: [], days: [], harita: new Map() };
    olay = { liste: [], hata: e.message, tavan: false, kaynak: "" };
  }
}

// ── Donem hesaplari ────────────────────────────────────────────────────────

const kurulumlar = () => surumSuz(veri.installs, K.surum);
function statsGunleri(bas, son) { const a = istGun(bas || 0), b = istGun(son); return veri.days.filter(d => d.id >= a && d.id <= b); }
function olaylar(bas, son, surum = K.surum) {
  return (olay.liste || []).filter(e => e.t >= bas && e.t <= son && (!surum || String(veri.harita.get(e.iid)?.appVersion ?? "") === String(surum)));
}
/* Olaylardan uygulamanin ev haritasini yeniden kurar (InstallTelemetry.record). */
function olayEv(liste) {
  const ev = {};
  const ekle = (k, v) => { ev[k] = (ev[k] || 0) + v; };
  for (const e of liste) {
    const a = slug(e.e), p = e.p ? slug(e.p) : null;
    if (a === "screen_time") { if (p && e.s > 0) ekle(`screen_${p}_sec`, e.s); continue; }
    ekle(a, 1);
    if (p) ekle(`${a}_${p}`, 1);
    if (e.s > 0) { ekle(`${a}_sec`, e.s); if (p) ekle(`${a}_${p}_sec`, e.s); }
  }
  return ev;
}
/* Bir donemin sayaclari. Surum secili degilse gunluk stats toplamlarindan
   (tam, ama surume bolunemez), seciliyse o surumdeki kurulumlarin olaylarindan. */
function donemVeri(bas, son) {
  const ol = olaylar(bas, son);
  if (K.surum) {
    const ev = olayEv(ol), sayac = {};
    for (const [k, x] of Object.entries(SAYAC)) if (x.olay) sayac[k] = ev[x.olay] || 0;
    return { kaynak: "olay", ev, sayac, olay: ol, gunler: [] };
  }
  const g = statsGunleri(bas, son), ev = {}, sayac = {};
  for (const d of g) {
    for (const [k, v] of Object.entries(d.ev || {})) ev[k] = (ev[k] || 0) + n(v);
    for (const k of Object.keys(SAYAC)) sayac[k] = (sayac[k] || 0) + n(d[k]);
  }
  return { kaynak: "stats", ev, sayac, olay: ol, gunler: g };
}
function ikiDonem() {
  const D = donem(K.aralik);
  return { D, simdi: donemVeri(D.bas, D.son), once: D.oncekiBas != null ? donemVeri(D.oncekiBas, D.oncekiSon - 1) : null };
}
const donemAd = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
const surumNotu = () => K.surum ? `Sürüm ${K.surum} seçili: sayılar o sürümdeki kurulumların olaylarından (son ${OLAY_GUN} gün).` : "";
function gunAraligi(D) {
  const son = istGun(D.son);
  const ilk = [veri.days[0]?.id, ...veri.installs.map(i => istGun(i.firstSeen))].filter(Boolean).sort()[0] || son;
  const bas = D.bas ? istGun(D.bas) : ilk;
  return [bas < son ? bas : son, son];
}
const kisiSay = liste => new Set(liste.map(e => e.iid)).size;

function yayinNotu() {

/* Gun gun bir sayac: surum seciliyse olaydan, degilse stats'tan. */
function gunlukSeri(D, seriler) {
  const h = {};

    for (const e of olaylar(D.bas, D.son)) for (const s of seriler) if (s.olay && e.e === s.olay) { const g = istGun(e.t); (h[g] ||= {})[s.alan] = (h[g]?.[s.alan] || 0) + 1; }

}

function kaliciTablo(kutu, hepsi) {
  const N = [1, 3, 7, 14, 30];
  const satir = (ad, liste) => [ad, sayi(liste.length), ...N.map(g => {
    const uygun = liste.filter(i => i.firstSeen && Date.now() - ms(i.firstSeen) >= g * 864e5);
    const kal = uygun.filter(i => ms(i.lastSeen) - ms(i.firstSeen) >= g * 864e5).length;
    return { d: uygun.length ? `${yuzde(kal, uygun.length)} (${kal}/${uygun.length})` : "-", s: uygun.length ? kal / uygun.length : -1 };
  })];
  const hafta = t => { const g = istGunBasi(ms(t)); const gun = (new Date(g + 3 * 36e5).getUTCDay() + 6) % 7; return istGun(g - gun * 864e5); };
  const kohort = {};
  for (const i of hepsi) if (i.firstSeen) (kohort[hafta(i.firstSeen)] ||= []).push(i);
  const satirlar = [satir("Hepsi", hepsi.filter(i => i.firstSeen)), ...Object.keys(kohort).sort().reverse().slice(0, 12).map(h => satir(`${tarihTam(h)} haftası`, kohort[h]))];
  kutu.appendChild(veriTablo(["Kohort", { ad: "Kurulum", num: true }, ...N.map(g => ({ ad: `${g}. gün`, num: true }))], satirlar, { ara: false, kopyala: true }));
}

function surumTablosu() {
  const gruplar = {};
  for (const i of veri.installs) (gruplar[i.appVersion || "?"] ||= []).push(i);
  const yayin = {};
  for (const x of notlar) if (x.tarih && (x.platform === "ios" || x.platform === "android")) {
    (yayin[String(x.surum)] ||= []).push(`${platAd(x.platform)} ${tarihTam(x.tarih, { saatsiz: true })}`);
  }
  const yedi = Date.now() - 7 * 864e5;
  const kal = (l, g) => { const u = l.filter(i => Date.now() - ms(i.firstSeen) >= g * 864e5); return u.length ? u.filter(i => ms(i.lastSeen) - ms(i.firstSeen) >= g * 864e5).length / u.length : null; };
  const satirlar = Object.entries(gruplar).sort((a, b) => surumKey(b[0]).localeCompare(surumKey(a[0]))).map(([v, l]) => {
    const pro = l.filter(i => i.pro === true).length, akt = l.filter(i => ms(i.lastSeen) >= yedi).length;
    const ses = topla(l, i => i.sessions), sn = topla(l, i => evi(i, "session_sec")), sa = topla(l, i => evi(i, "session"));
    const pw = topla(l, i => evi(i, "pw_view")), al = topla(l, i => evi(i, "pw_buy"));
    const cik = l.filter(i => n(i.n_hatched) === 1);
    const d1 = kal(l, 1), d7 = kal(l, 7);
    const ilk = l.map(i => ms(i.firstSeen)).filter(Boolean), son = l.map(i => ms(i.lastSeen)).filter(Boolean);
    return [
      { d: v === "?" ? "Bilinmiyor" : v, s: surumKey(v) },
      [...new Set(l.map(i => platAd(i.platform)))].join(", "),
      sayi(l.length), { d: yuzde(l.length, veri.installs.length, 0), s: l.length },
      sayi(akt), { d: `${sayi(pro)} (${yuzde(pro, l.length, 0)})`, s: pro / l.length },
      { d: yuzde(cik.length, l.length, 0), s: cik.length / l.length },
      { d: ondalik(ort(cik, i => i.n_level)), s: ort(cik, i => i.n_level) },
      { d: yuzde(l.filter(i => i.notif === true).length, l.length, 0), s: l.filter(i => i.notif === true).length / l.length },
      { d: ondalik(ses / l.length), s: ses / l.length },
      { d: dk(sa ? sn / sa : 0), s: sa ? sn / sa : 0 },
      { d: ondalik(pw / l.length, 2), s: pw / l.length },
      { d: pw ? yuzde(al, pw, 1) : "-", s: pw ? al / pw : -1 },
      { d: d1 == null ? "-" : yuzde(d1, 1, 0), s: d1 ?? -1 }, { d: d7 == null ? "-" : yuzde(d7, 1, 0), s: d7 ?? -1 },
      ilk.length ? tarihHucre(Math.min(...ilk)) : "-", son.length ? tarihHucre(Math.max(...son)) : "-",
      (yayin[v] || []).join(" · ") || "-",
    ];
  });
  return veriTablo(["Sürüm", { ad: "Platform", filtre: true }, { ad: "Kurulum", num: true }, { ad: "Pay", num: true }, { ad: "7g aktif", num: true },
    { ad: "Coin alan", num: true }, { ad: "Çatlatan", num: true }, { ad: "Ort. seviye", num: true }, { ad: "Bildirim izni", num: true },
    { ad: "Oturum/kurulum", num: true }, { ad: "Ort. oturum", num: true }, { ad: "Mağaza/kurulum", num: true }, { ad: "Dönüşüm", num: true },
    { ad: "D1", num: true }, { ad: "D7", num: true }, "İlk görülme", "Son görülme", "Mağaza yayını"], satirlar, { sirala: [0, "desc"], ara: false, bos: "Kurulum yok." });
}

/* Telemetrideki satin almalar: her pw_buy olayi; olay yoksa kurulumun purchasedAt'i. */
function alimlar(bas, son) {
  const liste = [], olanlar = new Set();
  for (const e of olay.liste || []) {
    if (e.e !== "pw_buy" || e.t < bas || e.t > son) continue;
    const i = veri.harita.get(e.iid);
    if (!i || (K.surum && String(i.appVersion) !== String(K.surum))) continue;
    olanlar.add(i.id);
    /* Paket: ayni anda yazilan purchasedAt/plan ile eslesirse plan, yoksa pw_tap'tan. */
    const tap = (olay.liste || []).filter(x => x.iid === e.iid && x.e === "pw_tap" && x.t <= e.t && e.t - x.t < 36e5).sort((a, b) => b.t - a.t)[0];
    const plan = tap ? tap.p.replace("_", ".") : i.plan;
    liste.push({ i, t: e.t, sn: e.s, kaynak: e.p || i.buySource, plan, fiyat: planFiyat(plan) });
  }
  for (const i of kurulumlar()) if (i.purchasedAt && !olanlar.has(i.id) && ms(i.purchasedAt) >= bas && ms(i.purchasedAt) <= son)
    liste.push({ i, t: ms(i.purchasedAt), sn: null, kaynak: i.buySource, plan: i.plan, fiyat: planFiyat(i.plan) });
  return liste.sort((a, b) => b.t - a.t);
}

  grafikKart(g, "Yaş (gün)", kutu => yatayCubuk(kutu, kovala(cikan.map(i => n(i.n_age)), [["0", 0, 1], ["1-2", 1, 3], ["3-4 (bebek)", 3, 5], ["5-11 (çocuk)", 5, 12], ["12-17 (genç)", 12, 18], ["18-29", 18, 30], ["30+", 30, 1e9]], true), { limit: 10 }));

    const ekleH = (k, v) => { i.ev[k] = (i.ev[k] || 0) + v; g.ev[k] = (g.ev[k] || 0) + v; };
    if (e.gizli) {
      const adet = e.adet ?? 1;
      ekleH(e.e, adet);
      if (e.p) ekleH(`${e.e}_${slug(e.p)}`, adet);
      if (e.e === "pet") { i.pets = (i.pets || 0) + 1; g.pets = (g.pets || 0) + 1; }
      continue;
    }
    for (const [k, v] of Object.entries(olayEv([e]))) ekleH(k, v);
    const sy = sayacOlay[e.e];
    if (sy && !(sy === "shares" && e.p === "watchface")) { i[sy] = (i[sy] || 0) + 1; g[sy] = (g[sy] || 0) + 1; }
    if (e.e === "pw_buy") { const pk = (yeniEv.find(x => x.iid === e.iid && x.e === "pw_tap" && x.t <= e.t && e.t - x.t < 36e5)?.p || "coins_100").replace("_", "."); g.coins_bought = (g.coins_bought || 0) + (PLAN[pk]?.coin || 0); }
  }
  for (const i of installs) { i.installs_new = 1; const g = (gunler[utcGun(ms(i.firstSeen))] ||= { ev: {} }); g.installs_new = (g.installs_new || 0) + 1; }
  const days = Object.entries(gunler).map(([id, d]) => ({ id, ...d })).sort((a, b) => a.id < b.id ? -1 : 1);
  const satisGun = days.slice(-60).map(d => ({ tarih: d.id, indirme: n(d.installs_new) + Math.floor(r() * 3), guncelleme: Math.floor(r() * 5), iap: n(d.purchases),
    gelir: n(d.purchases) ? (r() < 0.6 ? { USD: Math.round(n(d.purchases) * 3.2 * 100) / 100 } : { TRY: Math.round(n(d.purchases) * 89.99 * 100) / 100 }) : {} }));
  const gelirTop = {};
  for (const x of satisGun) for (const [kod, t] of Object.entries(x.gelir)) gelirTop[kod] = (gelirTop[kod] || 0) + t;
  const satis = { uretim: new Date(now - 5 * 36e5).toISOString(), gun: satisGun.length, indirme: topla(satisGun, x => x.indirme), guncelleme: topla(satisGun, x => x.guncelleme),
    iap: topla(satisGun, x => x.iap), gelir: gelirTop, ulkeler: say(installs, i => i.region), gunluk: satisGun };
  return { installs, days, events: yeniEv.filter(e => !e.gizli).map(({ gizli, adet, ...e }) => e), satis };
}

/* Daily Whisper "Still": krem kağıt, mürekkep, bordo; yazı Poppins (uygulamadaki gibi). */
body{font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
h1,h2{font-weight:500;letter-spacing:-.01em}
.tile b{font-weight:600}
aside .brand img{border-radius:9px}
.dw-key{font:12px ui-monospace,Menlo,monospace;color:var(--soft);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.dw-lang{font-size:11px;font-weight:700;color:var(--soft);margin:0 0 3px;letter-spacing:.04em}
.dw-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.dw-row{grid-template-columns:1fr}}
textarea.changed{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
textarea{min-height:58px}
.dw-badge{font-size:11px;color:var(--accent);font-weight:700}
.dw-eksik{font-size:11px;color:var(--rose);font-weight:700}
.dw-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dw-tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:500}
.dw-tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dw-bar{position:sticky;bottom:0;z-index:4;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin:16px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px)}
.dw-bar .muted{margin-right:auto}
.dw-tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.dw-tool input,.dw-tool select{width:auto;min-width:180px}
.dw-photos{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.dw-photos div{position:relative}.dw-photos img{width:96px;height:120px;object-fit:cover;border-radius:14px;display:block;border:1px solid var(--line)}
.dw-photos button{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:11px}
.dw-up{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--soft)}
.dw-tl{font-size:13px;border-left:2px solid var(--line);margin:4px 0 0 6px;padding-left:12px;max-height:420px;overflow:auto}
.dw-tl div{padding:3px 0}.dw-tl time{color:var(--soft);font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.dw-story{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.dw-rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.dw-rates label{font-size:12px;color:var(--soft);display:block;margin-bottom:4px}
.dw-check{display:flex;gap:10px;align-items:flex-start}.dw-check input{width:auto;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dw-not{font-size:12px;color:var(--soft);margin:6px 0 0}

<script type="module">

import { gunlukCubuk, cizgi, huni, yatayCubuk, saatIsi, saatMatrisi, gunleriDoldur } from "/lab/assets/grafik.js?v=1";

const firebaseConfig = {

  projectId: "kit-app-a91b5",
  appId: "1:817653304901:web:c3f47d05ce251cea3b9d2c",
  messagingSenderId: "817653304901",

};
/* Asıl kapı Firestore kuralları (admins/{uid}); kabuktaki e-posta kontrolü ikinci katman. */
const YONETICI = "aberkalparslan@gmail.com";
const PUSH_URL = "https://daily-whisper-push.kittapcom.workers.dev";
const SLUG = "daily-whisper";
const GUN = 864e5;

// ── Etiketler (uygulamadaki anahtarlar sabit; burada yalnız Türkçe adları) ──
const ADIMLAR = ["welcome", "introa", "introb", "introc", "name", "city", "birth", "gender", "work", "workfeel", "lifefeel", "relationship", "people", "change", "reflectchange", "why", "reflectwhy", "obstacle", "reflectobstacle", "priorities", "selfdescription", "dreama", "dreamgate", "dreamb", "dreamplace", "dreamhome", "dreamperson", "dream", "reminder", "notifications", "building"];
const ADIM = { welcome: "Karşılama", introa: "Hoş geldin", introb: "Kendinden bahset", introc: "Gizlilik", name: "İsim", city: "Şehir", birth: "Doğum tarihi", gender: "Cinsiyet", work: "İş", workfeel: "İşi nasıl hissettiriyor", lifefeel: "Hayatı nasıl gidiyor", relationship: "İlişki durumu", people: "Değer verdiği kişiler", change: "Değiştirmek istediği", reflectchange: "AI cevabı: değişim", why: "Neden istiyor", reflectwhy: "AI cevabı: neden", obstacle: "Engel", reflectobstacle: "AI cevabı: engel", priorities: "Öncelikler", selfdescription: "Kendini tarif", dreama: "Hayal girişi", dreamgate: "Nefes ve geçiş", dreamb: "Hayaldeki sabah", dreamplace: "Hayaldeki yer", dreamhome: "Hayaldeki ev", dreamperson: "Hayaldeki kişi", dream: "Hayalini anlat", reminder: "Hatırlatma saati", notifications: "Bildirim izni", building: "Hazırlanıyor (son ekran)" };
const KAYNAK = { onboarding: "Onboarding sonu", launch: "Açılışta (sonraki girişler)", locked: "Kilitli hikaye kartı", teaser: "Hikaye önizlemesi", new_story: "Yeni manifest kartı", board_share: "Vision board paylaş", board_wallpaper: "Vision board duvar kağıdı", board_screenshot: "Vision board ekran görüntüsü", voice: "Anlatıcı sesi seçimi", hz: "Hz sesi", me: "Ben sekmesi Premium kartı", unknown: "Bilinmiyor" };
const EKRAN = { today: "Bugün", stories: "Hikayeler", affirmations: "Olumlamalar", board: "Vision board", me: "Ben", player: "Oynatıcı (dinliyor)", read: "Hikayeyi okuyor", zodiac: "Burç detayı", new_story: "Yeni hikaye yazıyor", gratitude: "Şükran", manifest: "Manifest", profile_edit: "Profil düzenleme", sign_in: "Giriş", paywall: "Paywall", settings: "Ayarlar", widgets: "Widget'lar", share: "Paylaşım", closed: "Kapalı" };
const NOTIF = { on: "Açık", off: "Kapalı", quiet: "Sessiz", unasked: "Sorulmadı" };
const NOTIF_TUR = { story: "Günlük hikaye (Premium)", back: "Geri dön (Premium olmayan)", gift: "Hediye hikaye", zodiac: "Akşam burç notu", grat: "Şükran hatırlatması", push: "Panelden gönderilen" };
const OZELLIK = { story_new: "Hikaye yazıldı", read_open: "Hikayeyi okudu", story_fav: "Hikaye favorileme", story_share: "Hikaye paylaşma", grat_add: "Şükran yazma", aff_fav: "Olumlama favorileme", aff_share: "Olumlama paylaşma", board_add: "Vision board'a ekleme", board_wallpaper: "Vision board duvar kağıdı", board_share: "Vision board paylaşma", board_clear: "Vision board temizleme", avatar_set: "Profil fotoğrafı", sign_in: "Hesapla giriş", open_link: "Bağlantıdan açma", ambient: "Arka plan sesi değiştirme", voice: "Anlatıcı değiştirme", speed: "Hız değiştirme", language: "Dil değiştirme" };
const AMBIENT = { rain: "Yağmur", ocean: "Okyanus", night: "Gece", hz528: "528 Hz", hz432: "432 Hz", none: "Sessiz" };
const PLAN_AD = { weekly: "Haftalık", monthly: "Aylık", yearly: "Yıllık", lifetime: "Ömür boyu" };
const DIL = { en: "İngilizce", tr: "Türkçe", es: "İspanyolca", de: "Almanca", fr: "Fransızca", it: "İtalyanca", pt: "Portekizce", ru: "Rusça", ja: "Japonca", zh: "Çince", "zh-Hant": "Çince (Geleneksel)", ko: "Korece", id: "Endonezce", kk: "Kazakça", az: "Azerice", nl: "Felemenkçe", pl: "Lehçe", sv: "İsveççe", uk: "Ukraynaca", ro: "Romence", vi: "Vietnamca", th: "Tayca", hi: "Hintçe", ms: "Malayca" };
const PUSH_DILLER = ["en", "tr", "es", "de", "fr", "it", "pt", "ru", "ja", "zh", "ko", "id", "kk", "az", "nl", "pl", "sv", "uk", "ro", "vi", "th", "hi", "ms"];
const MODEL_AD = k => k.replace(/^model_/, "").replace(/_(\d)_(\d)_/g, "-$1.$2-").replace(/_/g, "-");

// ── Durum ──
let K = null, db = null, veri = null;
const demo = new URLSearchParams(location.search).has("demo");
let DEMO = null;
const ciz = () => K && K.ciz();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "_");
const depo = { al: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, yaz: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
function toast(m) { const t = el("div", "toast"); t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const ZAMAN = ["firstSeen", "lastSeen", "purchasedAt"];

// ── Veri ──
async function yukle(k) {
  K = k;
  if (!db && k.app) db = F.getFirestore(k.app);
  try {
    if (demo) {
      if (!DEMO) DEMO = (await import("./demo.js")).sahteVeri();
      veri = { installs: DEMO.installs, stats: DEMO.stats, pushes: DEMO.pushes, sales: DEMO.sales, ai: DEMO.ai, ga4: DEMO.ga4, testers: DEMO.testers.slice() };
      if (!metin.yuklendi) configAc(DEMO.config);
      if (!af.kirli) { af.liste = JSON.parse(JSON.stringify((await import("./seed-affirmations.js")).SEED_AFFIRMATIONS.slice(0, 8))); af.surum = 4; af.tarih = new Date(Date.now() - 2 * GUN).toISOString(); }
      foto.slotlar = JSON.parse(JSON.stringify(DEMO.photos.slots)); foto.surum = DEMO.photos.version;
      k.durum(`Demo veri · ${veri.installs.length} kurulum, ${veri.stats.length} gün`);
      return;
    }
    const tek = async yol => { try { const s = await F.getDoc(F.doc(db, ...yol)); return s.exists() ? s.data() : null; } catch (e) { return null; } };
    const [iS, sS, pS, sales, ai, ga4, tst, cfg, afd, ph] = await Promise.all([
      F.getDocs(F.collection(db, "installs")),
      F.getDocs(F.collection(db, "stats")),
      F.getDocs(F.query(F.collection(db, "pushes"), F.limit(300))).catch(() => ({ docs: [] })),
      tek(["panel", "sales"]), tek(["panel", "ai"]), tek(["panel", "ga4"]), tek(["panel", "testers"]),
      tek(["config", "app"]), tek(["content", "affirmations"]), tek(["content", "photos"]),
    ]);
    const installs = iS.docs.map(d => {
      const x = { id: d.id, ...d.data() };
      for (const a of ZAMAN) { const t = zaman(x[a]); x[a] = t ? t.toISOString() : null; }
      return x;
    }).filter(i => i.platform !== "test" && i.lastSeen);
    const stats = sS.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
    const js = d => { try { return d?.json ? JSON.parse(d.json) : null; } catch (e) { return null; } };
    veri = { installs, stats, pushes: pS.docs.map(d => ({ id: d.id, ...d.data() })), sales, ai: js(ai), ga4: js(ga4), testers: tst?.ids || [] };
    if (!metin.kirli) configAc(cfg || {}, !!cfg);
    if (!af.kirli) { af.liste = afd?.items ? JSON.parse(afd.items) : []; af.surum = afd?.version || 0; af.tarih = zaman(afd?.updatedAt)?.toISOString() || null; af.var = !!afd; }
    foto.slotlar = ph?.slots ? JSON.parse(ph.slots) : {}; foto.surum = ph?.version || 0;
    k.durum(`${installs.length} kurulum, ${stats.length} gün · ${tarihTam(new Date())}`);
  } catch (e) {
    k.durum("Hata: " + (e.code || e.message));
    veri = veri || { installs: [], stats: [], pushes: [], sales: null, ai: null, ga4: null, testers: [] };
  }
}

// ── Yardımcılar ──
const D = () => donem(K.aralik);
const kur = () => surumSuz(veri.installs, K.surum);
const ev = (o, k) => +(o?.ev?.[k] || 0);
const sayac = (o, k) => +(o?.[k] || 0);
const topla = (l, f) => l.reduce((a, x) => a + (+f(x) || 0), 0);
function gunAraligi(bas, son) { return [bas ? istGun(bas) : (veri.stats[0]?.id || istGun(Date.now())), istGun(son)]; }
function statlar(bas, son) { const [b, e] = gunAraligi(bas, son); return veri.stats.filter(s => s.id >= b && s.id <= e); }
const S = () => statlar(D().bas, D().son);
const SO = () => D().oncekiBas == null ? null : statlar(D().oncekiBas, D().oncekiSon - 1);
/** Günlük sayaç: dönemdeki toplam ve önceki döneme göre fark nesnesi. */
function st(f, ters) { const a = topla(S(), f), o = SO(); return { n: a, fark: o ? { simdi: a, once: topla(o, f), ters } : undefined }; }
const evT = (k, ters) => st(s => ev(s, k), ters);
const ctT = (k, ters) => st(s => sayac(s, k), ters);
function evOnek(liste, onek) {
  const m = {};
  for (const x of liste) for (const [k, v] of Object.entries(x.ev || {})) if (k.startsWith(onek) && !k.endsWith("_sec")) { const n = k.slice(onek.length); if (n) m[n] = (m[n] || 0) + (+v || 0); }
  return m;
}
function seri(alanlar) {
  const d = D(), [b, e] = gunAraligi(d.bas, d.son), h = {};
  for (const s of veri.stats) if (s.id >= b && s.id <= e) { const o = {}; for (const [ad, f] of Object.entries(alanlar)) o[ad] = f(s); h[s.id] = o; }
  return gunleriDoldur(h, b, e).map(g => { for (const ad of Object.keys(alanlar)) g[ad] = g[ad] || 0; return g; });
}
const donemdeKurulan = (l = kur()) => { const d = D(); return l.filter(i => ms(i.firstSeen) >= d.bas && ms(i.firstSeen) <= d.son); };
const oncekiKurulan = (l = kur()) => { const d = D(); return d.oncekiBas == null ? null : l.filter(i => ms(i.firstSeen) >= d.oncekiBas && ms(i.firstSeen) < d.oncekiSon); };
const online = i => ms(i.lastSeen) > Date.now() - 150e3 && i.screen && i.screen !== "closed";
const bitirdi = i => i.onboarded === true || ev(i, "onb_done") > 0;
const ulasir = i => !!(i.fcm || i.apns) && i.notif !== "off";
const testMi = i => (veri.testers || []).includes(i.id);
const platAd = p => p === "ios" ? "iOS" : p === "android" ? "Android" : (p || "?");
const kisi = i => i.email || `anonim · ${i.id.slice(0, 8)}`;
const donemAd = () => K.aralik === 0 ? "tümü" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
const surumNot = "sürüm filtresi bu günlük sayaçlara uygulanmaz";
function izgara(c, n = 2) { const g = el("div", n === 3 ? "izgara3" : "izgara2"); c.appendChild(g); return g; }
function grafik(kok, baslik, f, not) { const k = el("div"); const kk = kart(baslik, k); if (not) kk.appendChild(el("p", "dw-not", esc(not))); kok.appendChild(kk); f(k); return kk; }
const notKart = (c, html) => c.appendChild(kart(null, el("p", "muted", html)));
function ekranAd(sc) {
  if (!sc) return "-";
  if (sc.startsWith("onb_")) return "Onboarding: " + (ADIM[slug(sc.slice(4))] || sc.slice(4));
  return EKRAN[sc] || sc;
}
function nerede(i) {
  if (i.screen === "closed") return "Kapattı · " + ekranAd(i.lastScreen);
  if (i.screen) return ekranAd(i.screen);
  if (!bitirdi(i) && i.onbStep) return "Onboarding: " + (ADIM[slug(i.onbStep)] || i.onbStep);
  return "-";
}
function planTur(p) {
  const s = String(p || "").toLowerCase();
  if (/week|_w$|^w$/.test(s)) return "weekly";
  if (/annual|year|_y$|^y$/.test(s)) return "yearly";
  if (/month|_m$|^m$/.test(s)) return "monthly";
  if (/life/.test(s)) return "lifetime";
  return s ? "other" : "";
}
const planAd = p => PLAN_AD[planTur(p)] || p || "";

/* Plan fiyatları: mağaza raporu (Elif hesabında satış raporu yok) gelmediği için
   satın almanın tutarı plan fiyatından tahmin edilir. Ayarlar'dan değişir. */
const FIYAT_ANAHTAR = "dw-panel-fiyat";
const FIYAT_VARSAYILAN = { weekly: { USD: 6.99, TRY: 149.99, deneme: 7 }, monthly: { USD: 14.99, TRY: 299.99, deneme: 0 }, yearly: { USD: 79.99, TRY: 1499.99, deneme: 7 } };
const fiyatlar = (() => { try { return { ...FIYAT_VARSAYILAN, ...JSON.parse(depo.al(FIYAT_ANAHTAR) || "{}") }; } catch (e) { return { ...FIYAT_VARSAYILAN }; } })();
const paraKod = i => i.region === "TR" ? "TRY" : "USD";
/** Satın almanın deneme durumu ve tahmini ödenen (ilk dönem). */
function satin(i) {
  const tur = planTur(i.plan), f = fiyatlar[tur] || {}, t = ms(i.purchasedAt), deneme = +f.deneme || 0;
  const kod = paraKod(i), tutar = f[kod] ?? f.USD ?? null;
  if (!i.plan) return null;
  if (!deneme) return { tur, durum: "Doğrudan ödedi", odedi: true, tutar, kod, deneme: false };
  if (!t || Date.now() - t < deneme * GUN) return { tur, durum: "Denemede", odedi: false, tutar: 0, kod, deneme: true, bitis: t + deneme * GUN };
  return i.premium ? { tur, durum: "Denemeden döndü (ödüyor)", odedi: true, tutar, kod, deneme: true, donustu: true }
    : { tur, durum: "Denemede bıraktı", odedi: false, tutar: 0, kod, deneme: true, birakti: true };
}
const alicilar = (l = kur()) => l.filter(i => i.plan || i.purchasedAt);

/* AI fiyatları (USD), bu tarayıcıda. */
const ORAN_ANAHTAR = "dw_rates";
const oranlar = (() => { try { return { in: 0.30, out: 2.50, tts: 0.015, ...JSON.parse(depo.al(ORAN_ANAHTAR) || "{}") }; } catch (e) { return { in: 0.30, out: 2.50, tts: 0.015 }; } })();
const maliyet = s => sayac(s, "ai_text_tokens_in") / 1e6 * oranlar.in + sayac(s, "ai_text_tokens_out") / 1e6 * oranlar.out + sayac(s, "ai_tts_seconds") / 60 * oranlar.tts;
const usd = n => "$" + (n || 0).toFixed(n && n < 1 ? 3 : 2);

// ════════════════════════════════════════════════════════════════════════
// ANALİZ
// ════════════════════════════════════════════════════════════════════════

function genel(c) {
  const l = kur(), now = Date.now(), d = D();
  const aktif = gun => l.filter(i => ms(i.lastSeen) > now - gun * GUN).length;
  const yeni = st(s => sayac(s, "installs_new")), ot = ctT("sessions"), ob = ctT("onboarding_done"), pw = ctT("paywall_views"), al = ctT("purchases");
  const hk = st(s => sayac(s, "stories_moment") + sayac(s, "stories_custom")), dn = ctT("listens"), mal = st(maliyet, true);
  const kurulan = donemdeKurulan(l), once = oncekiKurulan(l);
  c.appendChild(tiles([
    ["Yeni kurulum", sayi(yeni.n), donemAd(), yeni.fark],
    ["Oturum", sayi(ot.n), "", ot.fark],
    ["Onboarding biten", sayi(ob.n), "", ob.fark],
    ["Paywall gösterimi", sayi(pw.n), "", pw.fark],
    ["Satın alma / deneme", sayi(al.n), "", al.fark],
    ["Hikaye", sayi(hk.n), "yazılan", hk.fark],
    ["Dinleme", sayi(dn.n), "", dn.fark],

      if (!await onayKarti({ baslik: "Bu fotoğraf kaldırılsın mı?", satirlar: [["Alan", esc(ad)]], not: "Telefonlar bir sonraki açılışta günceller.", evet: "Kaldır", tehlike: true })) return;

      foto.slotlar[k].splice(n, 1); if (!foto.slotlar[k].length) delete foto.slotlar[k];
      try { await fotoKaydet(); yaz("Kaldırıldı. Telefonlar bir sonraki açılışta günceller."); ciz(); const s = await storage(); await s.deleteObject(s.ref(s.s, decodeURIComponent(new URL(url).pathname.split("/o/")[1]))).catch(() => { }); }
      catch (e) { yaz("Kaydedilemedi: " + (e.code || e.message)); }
    });
    card.querySelector("input[type=file]").onchange = async e => {
      const files = [...e.target.files]; if (!files.length) return;
      if (demo) { toast("Demo: yüklenmedi"); return; }
      yaz(`${files.length} fotoğraf yükleniyor...`);
      try {
        const s = await storage();
        for (const f of files) {
          const blob = await kucult(f);
          const r = s.ref(s.s, `photos/${k}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`);
          await s.uploadBytes(r, blob, { contentType: "image/jpeg", cacheControl: "public, max-age=31536000" });
          (foto.slotlar[k] = foto.slotlar[k] || []).push(await s.getDownloadURL(r));
        }
        await fotoKaydet(); yaz("Yüklendi. Telefonlar bir sonraki açılışta indirir."); ciz();
      } catch (er) { yaz("Yüklenemedi: " + (er.code || er.message)); }
    };
    c.appendChild(card);
  }
}

// ── Olumlamalar ──
const DILLER_AF = { en: "English", tr: "Türkçe", es: "Español", de: "Deutsch", fr: "Français", it: "Italiano", pt: "Português", ru: "Русский", ja: "日本語", zh: "简体中文", ko: "한국어", id: "Bahasa Indonesia", kk: "Қазақша", az: "Azərbaycanca", nl: "Nederlands", pl: "Polski", sv: "Svenska", uk: "Українська", ro: "Română", vi: "Tiếng Việt", th: "ไทย", hi: "हिन्दी", ms: "Bahasa Melayu", "zh-Hant": "繁體中文" };
const AF_DIL = Object.keys(DILLER_AF);
const AF_EN = { en: "English", tr: "Turkish", es: "Spanish", de: "German", fr: "French", it: "Italian", pt: "Brazilian Portuguese", ru: "Russian", ja: "Japanese", zh: "Simplified Chinese", ko: "Korean", id: "Indonesian", kk: "Kazakh", az: "Azerbaijani", nl: "Dutch", pl: "Polish", sv: "Swedish", uk: "Ukrainian", ro: "Romanian", vi: "Vietnamese", th: "Thai", hi: "Hindi", ms: "Malaysian Malay", "zh-Hant": "Traditional Chinese (Taiwan)" };
const af = { liste: [], surum: 0, tarih: null, var: false, kirli: false, ara: "", ham: "", json: "", sayfa: 0 };
const yeniId = () => "a-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const AF_KOMUT = girdi => `You are preparing affirmation cards for Daily Whisper, a calm manifestation and affirmation app.
Take the affirmations below (they may be in any language) and return each one in all ${AF_DIL.length} app languages: ${AF_DIL.map(l => `${AF_EN[l]} (${l})`).join(", ")}.

Rules for every language:
- First person, present tense, as if already true ("I am", "Ben ...yım").
- One or two short sentences, at most 25 words.
- Warm, simple and natural, written as a native speaker would say it, never a word-for-word translation.
- No emojis, no quotation marks, no hashtags, and never use dashes of any kind (no em dash, no en dash); use commas or full stops.
- In Spanish, French and Italian, prefer wording that avoids grammatical gender; if impossible, use the feminine form.
- Portuguese is Brazilian Portuguese, Chinese is Simplified Chinese, Kazakh is in Cyrillic, Azerbaijani is in Latin script (real Azerbaijani, not Turkish).
- Keep the meaning of the original; do not add new ideas.

Return ONLY a JSON array, no explanation, in exactly this shape:
[{"text":{${AF_DIL.map(l => `"${l}":"..."`).join(",")}}}]

Affirmations:
${girdi}`;
function olumlamalar(c) {
  c.appendChild(el("p", "muted", af.var || demo ? `${sayi(af.liste.length)} olumlama · sürüm ${af.surum}${af.tarih ? " · " + esc(tarihTam(af.tarih)) : ""}` : "Veritabanında liste yok; uygulama kendi içindeki 91 olumlamayı gösteriyor. \"Uygulamadaki listeyi yükle\" ile başla."));
  c.appendChild(el("p", "muted", "Uygulamanın Olumlamalar sekmesindeki kartlar. Her kart uygulamanın dillerinde tutulur; uygulama kullanıcının dilini gösterir, eksikse İngilizceyi. Kaydedince uygulama bir sonraki açılışta yeni listeyi alır."));
  const ai = el("div", "card");
  ai.innerHTML = `<h2>AI ile toplu ekle</h2><p class="muted">1. Eklemek istediğin olumlamaları herhangi bir dilde, her satıra bir tane yaz. 2. "Komutu kopyala"ya bas ve ChatGPT, Gemini ya da Claude'a yapıştır. 3. Gelen JSON'u alttaki kutuya yapıştırıp "İçe aktar"a bas.</p>
    <textarea id="afHam" placeholder="Her satıra bir olumlama, örn. Bugün kendime nazik davranıyorum."></textarea>
    <p><button class="ghost" id="afKomut">Komutu kopyala</button> <span class="muted" id="afKomutM"></span></p>
    <textarea id="afJson" placeholder='[{"text":{"en":"...","tr":"..."}}]' style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>
    <p><button class="ghost" id="afAl">İçe aktar</button> <span class="muted" id="afAlM"></span></p>`;
  c.appendChild(ai);
  const $a = id => ai.querySelector("#" + id);
  $a("afHam").value = af.ham; $a("afJson").value = af.json;
  $a("afHam").oninput = e => af.ham = e.target.value; $a("afJson").oninput = e => af.json = e.target.value;
  $a("afKomut").onclick = async () => {
    const ham = af.ham.trim(); if (!ham) { $a("afKomutM").textContent = "Önce olumlamaları yaz."; return; }
    const t = AF_KOMUT(ham);
    try { await navigator.clipboard.writeText(t); $a("afKomutM").textContent = "Kopyalandı. AI'a yapıştır."; }
    catch (e) { af.json = t; $a("afJson").value = t; $a("afKomutM").textContent = "Kopyalanamadı; komut alttaki kutuda, oradan kopyala."; }
  };
  $a("afAl").onclick = () => {
    let arr;
    try { arr = JSON.parse(af.json.trim().replace(/^```(json)?/i, "").replace(/```$/, "")); } catch (e) { $a("afAlM").textContent = "JSON okunamadı: " + e.message; return; }
    if (!Array.isArray(arr)) { $a("afAlM").textContent = "Bir liste ([ ... ]) bekleniyordu."; return; }
    let n = 0, kotu = 0;
    for (const x of arr) { const t = x?.text; if (!t || !t.en) { kotu++; continue; } af.liste.unshift({ id: yeniId(), text: Object.fromEntries(AF_DIL.map(l => [l, String(t[l] || "").replace(/\s*[—–]\s*/g, ", ").trim()])) }); n++; }
    af.kirli = true; af.json = ""; toast(`${n} olumlama eklendi${kotu ? `, ${kotu} atlandı (en metni yok)` : ""}. Kontrol edip kaydet.`); ciz();
  };
  const arac = el("div", "dw-tool");
  arac.innerHTML = `<input type="search" id="afAra" placeholder="Ara"><button class="ghost" id="afTek">+ Tek olumlama ekle</button><button class="ghost" id="afTohum">Uygulamadaki listeyi yükle</button><button id="afKaydet">Olumlamaları kaydet</button><span class="muted">${af.kirli ? "kaydedilmedi" : ""}</span>`;
  c.appendChild(arac);
  const liste = el("div"); c.appendChild(liste);
  arac.querySelector("#afAra").value = af.ara;
  arac.querySelector("#afAra").oninput = e => { af.ara = e.target.value; listeCiz(); };
  arac.querySelector("#afTek").onclick = () => { af.liste.unshift({ id: yeniId(), text: Object.fromEntries(AF_DIL.map(l => [l, ""])) }); af.kirli = true; ciz(); };
  arac.querySelector("#afTohum").onclick = async () => {
    const { SEED_AFFIRMATIONS } = await import("./seed-affirmations.js");
    const bilinen = new Set(af.liste.map(a => a.id)); let n = 0;
    for (const a of SEED_AFFIRMATIONS) if (!bilinen.has(a.id)) { af.liste.push(JSON.parse(JSON.stringify(a))); n++; }
    af.kirli = true; toast(`${n} olumlama eklendi, kaydetmeyi unutma.`); ciz();
  };
  arac.querySelector("#afKaydet").onclick = async () => {
    const items = af.liste.filter(a => (a.text.en || "").trim());
    if (!await onayKarti({ baslik: "Olumlamalar kaydedilsin mi?", satirlar: [["Olumlama", sayi(items.length)], ["Atlanacak", sayi(af.liste.length - items.length) + " (İngilizcesi boş)"], ["Sürüm", `${af.surum} → ${af.surum + 1}`]], evet: "Kaydet" })) return;
    if (demo) { af.kirli = false; toast("Demo: kaydedilmedi"); ciz(); return; }
    try {
      await F.setDoc(F.doc(db, "content", "affirmations"), { items: JSON.stringify(items), version: af.surum + 1, updatedAt: F.serverTimestamp() });
      af.liste = items; af.surum += 1; af.tarih = new Date().toISOString(); af.var = true; af.kirli = false; toast("Kaydedildi."); ciz();
    } catch (e) { toast("Kaydedilemedi: " + (e.code || e.message)); }
  };
  function listeCiz() {
    liste.textContent = "";
    const q = af.ara.trim().toLowerCase();
    const gor = af.liste.map((a, n) => [a, n]).filter(([a]) => !q || Object.values(a.text).join(" ").toLowerCase().includes(q));
    for (const [a, n] of gor.slice(0, 60)) {
      const card = el("div", "card");
      const eksik = AF_DIL.filter(l => !(a.text[l] || "").trim());
      card.innerHTML = `<div class="dw-key"><span>#${n + 1}${a.background ? " · görsel: " + esc(a.background) : ""}${eksik.length ? ` · <span class="dw-eksik">eksik: ${esc(eksik.join(", "))}</span>` : ""}</span><span><button class="ghost" data-yukari>↑</button> <button class="ghost" data-sil>Sil</button></span></div><div class="dw-row"></div>`;
      const row = card.querySelector(".dw-row");
      for (const l of AF_DIL) {
        const box = el("div", null, `<p class="dw-lang">${esc(DILLER_AF[l])}</p>`);
        const ta = el("textarea"); ta.value = a.text[l] || ""; ta.style.minHeight = "50px";
        ta.oninput = () => { a.text[l] = ta.value; af.kirli = true; };
        box.appendChild(ta); row.appendChild(box);
      }
      card.querySelector("[data-sil]").onclick = () => { af.liste.splice(n, 1); af.kirli = true; ciz(); };
      card.querySelector("[data-yukari]").onclick = () => { if (n > 0) { [af.liste[n - 1], af.liste[n]] = [af.liste[n], af.liste[n - 1]]; af.kirli = true; ciz(); } };
      liste.appendChild(card);
    }
    if (gor.length > 60) liste.appendChild(el("p", "muted", `İlk 60 kart gösteriliyor (${sayi(gor.length)}). Aramayla daralt.`));
    if (!gor.length) liste.appendChild(el("p", "muted", af.liste.length ? "Eşleşen olumlama yok." : "Liste boş."));
  }
  listeCiz();
}

// ── Burçlar ──
const BURC = [["aries", "Koç"], ["taurus", "Boğa"], ["gemini", "İkizler"], ["cancer", "Yengeç"], ["leo", "Aslan"], ["virgo", "Başak"], ["libra", "Terazi"], ["scorpio", "Akrep"], ["sagittarius", "Yay"], ["capricorn", "Oğlak"], ["aquarius", "Kova"], ["pisces", "Balık"]];
const BURC_DIL = ["tr", "en", "es", "de", "fr", "it", "pt", "ru", "ja", "zh", "ko", "id", "kk", "az", "nl", "pl", "sv", "uk", "ro", "vi", "th", "hi", "ms", "zh-Hant"];
const burc = { gun: null, dil: "tr", belge: null, durum: "", yuklenen: null };
async function burcYukle() {
  const id = `${burc.gun}_${burc.dil}`;
  burc.durum = "Yükleniyor..."; burc.belge = null;
  try {
    if (demo) burc.belge = burc.gun === istGun(Date.now()) ? { ...DEMO.zodiac } : null;
    else { const sn = await F.getDoc(F.doc(db, "zodiac", id)); burc.belge = sn.exists() ? JSON.parse(sn.data().signs) : null; }
    burc.durum = burc.belge ? "" : "O gün bu dilde henüz yazılmadı; uygulama o dilde ilk açılışta yazar.";
  } catch (e) { burc.durum = "Okunamadı: " + (e.code || e.message); }
  burc.yuklenen = id;
  if (K.sayfa === "burclar") ciz();
}
function burclar(c) {
  if (!burc.gun) burc.gun = istGun(Date.now());
  c.appendChild(el("p", "muted", "Her gün, her dilde, her burç için tek bir mesaj. O gün uygulamayı ilk açan kişinin telefonu 12 mesajı yazar, aynı burçtaki herkes aynı metni görür. Buradan okuyup düzeltebilirsin."));
  const arac = el("div", "dw-tool");
  arac.innerHTML = `<input type="date" id="zG" value="${esc(burc.gun)}"><select id="zD">${BURC_DIL.map(l => `<option value="${l}"${l === burc.dil ? " selected" : ""}>${esc(DIL[l] || l)} (${l})</option>`).join("")}</select><button class="ghost" id="zY">Getir</button><button id="zK">Kaydet</button><span class="muted">${esc(burc.durum)}</span>`;
  c.appendChild(arac);
  arac.querySelector("#zG").onchange = e => { burc.gun = e.target.value; burcYukle(); };
  arac.querySelector("#zD").onchange = e => { burc.dil = e.target.value; burcYukle(); };
  arac.querySelector("#zY").onclick = burcYukle;
  const liste = el("div"); c.appendChild(liste);
  if (burc.belge) for (const [k, ad] of BURC) {
    const card = el("div", "card", `<div class="dw-key"><span>${esc(ad)}</span></div>`);
    const ta = el("textarea"); ta.value = burc.belge[k] || ""; ta.oninput = () => { burc.belge[k] = ta.value; };
    card.appendChild(ta); liste.appendChild(card);
  }
  arac.querySelector("#zK").onclick = async () => {
    if (!burc.belge) return;
    if (!await onayKarti({ baslik: "Burç mesajları kaydedilsin mi?", satirlar: [["Gün", esc(tarihTam(burc.gun))], ["Dil", esc(burc.dil)]], not: "Bugünü önceden açmış telefonlar eski metni görmeye devam eder.", evet: "Kaydet" })) return;
    for (const k of Object.keys(burc.belge)) burc.belge[k] = String(burc.belge[k] || "").trim();
    if (demo) { toast("Demo: kaydedilmedi"); return; }
    try { await F.setDoc(F.doc(db, "zodiac", `${burc.gun}_${burc.dil}`), { signs: JSON.stringify(burc.belge), createdAt: F.serverTimestamp() }); toast("Kaydedildi."); }
    catch (e) { toast("Kaydedilemedi: " + (e.code || e.message)); }
  };
  if (burc.yuklenen !== `${burc.gun}_${burc.dil}`) burcYukle();
}

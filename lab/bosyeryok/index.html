async function belgeOku(ad) {
  try {
    const d = await getDoc(doc(db, "panel", ad));
    if (!d.exists()) return null;
    const x = d.data();
    return x.json ? { ...JSON.parse(x.json), _uretim: x.uretim } : x;
  } catch (e) { veri.hatalar["panel/" + ad] = e.code || e.message; return null; }
}

async function yukle(k) {
  K = k;
  veri = { hatalar: {} };
  if (demo) Object.assign(veri, sahte());
  else {
    if (!db && k.app) db = getFirestore(k.app);
    const [ga, magaza, sales] = await Promise.all([belgeOku("ga4"), belgeOku("magaza"), belgeOku("sales")]);
    Object.assign(veri, { ga, magaza, sales });
  }
  veri.notlar = await surumNotlari(SLUG).catch(() => []);
  hazirla();
  const h = Object.keys(veri.hatalar);
  k.durum(`${demo ? "Demo veri · " : ""}Analytics ${veri.ga.uretim ? tarihTam(veri.ga.uretim) : "yok"} · mağaza ${veri.magaza?.uretim ? tarihTam(veri.magaza.uretim) : "yok"}` +
    (h.length ? ` · okunamayan: ${h.map(x => `${x} (${veri.hatalar[x]})`).join(", ")}` : ""));
}

function hazirla() {
  const ga = veri.ga ||= {};
  for (const a of ["gunluk", "surumGunluk", "olaylar", "surumler", "surum7", "surum28", "kohort", "kohortHepsi", "gelir", "cokme"]) if (!Array.isArray(ga[a])) ga[a] = [];
  for (const a of ["donemToplam", "ekranlar", "ulkeler", "diller", "cihazlar", "isletim", "kaynaklar", "saatGun", "parametreler", "kisiOzellik", "aktif"]) if (!ga[a] || typeof ga[a] !== "object") ga[a] = {};
  ga.ozelBoyut ||= { olay: [], kisi: [] };
  ga.hatalar ||= [];
  veri.ilkGun = ga.gunluk[0]?.t || istGun(Date.now() - 90 * 864e5);
  /* Surum yayini gunleri: gunluk grafiklerin ipucunda "iOS 1.0 yayında". */
  veri.yayin = {};
  for (const x of veri.notlar || []) { const t = istGun(x.tarih); if (t) (veri.yayin[t] ||= []).push(`${PLAT[x.platform] || x.platform} ${x.surum} yayında`); }
  const m = veri.magaza;
  if (m && !Array.isArray(m.gunluk)) m.gunluk = [];
}

// ── Donem ve suzme ────────────────────────────────────────────────────────

const donemAdi = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;

const P = alan => VS(veri.ga[alan]?.[G()] || []);
const topla = (l, k) => (l || []).reduce((a, r) => a + n(r[k]), 0);
function grupla(l, anahtar, deger = "k") {
  const o = {};
  for (const r of l || []) { const a = typeof anahtar === "function" ? anahtar(r) : r[anahtar]; if (a == null || a === "") continue; o[a] = (o[a] || 0) + n(r[deger]); }
  return o;
}
const fk = (simdi, once, ters) => once == null ? undefined : { simdi, once, ters };
function gunAraligi() {
  const d = donem(K.aralik);
  const son = istGun(d.son);
  let bas = K.aralik === 0 ? veri.ilkGun : istGun(d.bas);
  if (bas < veri.ilkGun && K.aralik === 0) bas = veri.ilkGun;
  return [bas, son];
}
const gunKaynak = () => K.surum ? VS(veri.ga.surumGunluk) : veri.ga.gunluk;
/* Gunluk seri: alanlar { ad: satir => sayi }; ayni gunun satirlari toplanir. */
function gunSeri(kaynak, alanlar) {
  const [bas, son] = gunAraligi();
  const h = {};
  for (const r of kaynak) {
    if (r.t < bas || r.t > son) continue;
    const g = h[r.t] ||= {};
    for (const [ad, f] of Object.entries(alanlar)) g[ad] = (g[ad] || 0) + n(f(r));
  }
  return gunleriDoldur(h, bas, son).map(g => { for (const ad of Object.keys(alanlar)) g[ad] = n(g[ad]); if (veri.yayin[g.t]) g.not = veri.yayin[g.t].join(", "); return g; });
}
/* Donem toplamlari: surum secili degilse GA4'un tekil sayisi, seciliyse o surumun satirlari. */
function toplam() {
  const t = veri.ga.donemToplam?.[G()] || {};
  const tekil = x => x && Object.keys(x).length ? { tu: n(x.totalUsers), au: n(x.activeUsers), nu: n(x.newUsers), os: n(x.sessions), eos: n(x.engagedSessions),
    sure: n(x.userEngagementDuration), olay: n(x.eventCount) } : null;
  const satir = l => l ? { tu: topla(l, "tu"), au: topla(l, "au"), nu: topla(l, "nu"), os: topla(l, "os"), eos: topla(l, "eos"), sure: topla(l, "sure"), olay: topla(l, "olay") } : null;
  if (K.surum) return { simdi: satir(VS(t.simdi || [])) || satir([]), once: t.once ? satir(VS(t.once)) : null, satirlar: VS(t.simdi || []) };
  return { simdi: tekil(t.hepsi) || satir(t.simdi || []), once: tekil(t.onceHepsi), satirlar: t.simdi || [] };
}
/* Olay basina donemde sayi ve tekil kisi; once yalniz surum secili degilken. */
function olayKisi() {
  const t = veri.ga.donemToplam?.[G()] || {};
  const simdi = {}, once = {};
  const kaynak = K.surum ? VS(t.olayKisi || []) : (t.olayKisiHepsi || []);
  for (const r of kaynak) { const x = simdi[r.o] ||= { n: 0, k: 0 }; x.n += n(r.n); x.k += n(r.k); }
  if (!K.surum && t.olayKisiOnce) for (const r of t.olayKisiOnce) once[r.o] = { n: n(r.n), k: n(r.k) };
  return { simdi, once: K.surum || !t.olayKisiOnce ? null : once };
}
const oS = (ok, o, a = "n") => n(ok.simdi[o]?.[a]);
const oO = (ok, o, a = "n") => ok.once ? n(ok.once[o]?.[a]) : null;
const olayGunluk = adlar => gunSeri(VS(veri.ga.olaylar), Object.fromEntries(adlar.map(o => [o, r => r.o === o ? r.n : 0])));

}

  const tn = TOPLAM_NOT(); if (tn) c.appendChild(tn);

  const g1 = izgara(c);

function parametreKartlari(c, olaylar) {
  const p = veri.ga.parametreler || {};
  const kartlar = [];
  for (const [param, haritalar] of Object.entries(PARAM)) {
    for (const [o, baslik] of Object.entries(haritalar)) {
      if (!olaylar.includes(o) || !p[param]) continue;
      const l = VS(p[param][G()] || []).filter(r => r.o === o);
      if (!l.length) continue;
      kartlar.push([`${baslik} (${olayAdi(o)})`, grupla(l, r => degerAdi(String(r.v)), "n")]);
    }
  }
  if (kartlar.length) {
    const g = izgara(c, "izgara3");
    for (const [b, h] of kartlar) gKart(g, b, k => yatayCubuk(k, h, { limit: 10 }));
    return;
  }
  const eksik = [...new Set(Object.entries(PARAM).filter(([, h]) => Object.keys(h).some(o => olaylar.includes(o))).map(([x]) => x))];
  c.appendChild(el("div", "bilgi", `<b>Olay parametreleri henüz görünmüyor.</b> Uygulama gönderiyor (${eksik.map(x => `<code>${x}</code>`).join(", ")}) ama Analytics Data API bunları ancak özel boyut olarak kayıtlıysa veriyor. Kayıt sonrası gelen veri dolar, geçmiş dolmaz. Ayrıntı: Ayarlar.`));

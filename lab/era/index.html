.rozet .pill{font-size:10px;padding:1px 7px}
.pill.pro{background:var(--accent);color:var(--on-accent)}

.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.err{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose)}
.nokta{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.kisi b{display:block;font-weight:700}
.kisi small{display:block;color:var(--soft);font-size:11px}
.gun-bas{font-size:12px;font-weight:800;color:var(--soft);margin:12px 0 2px;letter-spacing:.03em}
.ev.pw span:nth-child(2){color:var(--warn);font-weight:600}
.ev.buy span:nth-child(2){color:var(--ok);font-weight:700}

<script type="module">
import { getFirestore, collection, collectionGroup, getDocs, getDoc, query, orderBy, limit, doc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { panelKabuk } from "/lab/assets/shell.js?v=3";
import { el, kart, tiles, veriTablo, sayi, sure, tarihTam, tarihHucre, yuzde, para, zaman, ms, istGun, istGunBasi,
         donem, farkYazi, surumListesi, surumSuz, surumNotlari, surumNotlariKutu, kullaniciCekmecesi } from "/lab/assets/panel.js?v=6";
import { gunlukCubuk, cizgi, huni, yatayCubuk, saatIsi, saatMatrisi, gunleriDoldur } from "/lab/assets/grafik.js?v=1";
import { dunyaHaritasi } from "/lab/assets/harita.js?v=1";

const firebaseConfig = {
  apiKey: "AIzaSyA8bv5SClUC-TB4ApPX4rssbsB4K4xoS3A",
  authDomain: "era-bamstudio.firebaseapp.com",
  projectId: "era-bamstudio",
  storageBucket: "era-bamstudio.firebasestorage.app",
  messagingSenderId: "66847996225",
  appId: "1:66847996225:web:ca9397ef7e708cf74689c0",
};
/* Asil kapi Firestore kurallari: okuma yalniz bu e-postaya acik. */
const YONETICI = "aberkalparslan@gmail.com";
const SLUG = "era";

/* Era renkleri: moss 345E50, paper FAF4E6, coral C65E49, ink 2F382F. */
const TEMA = {
  acik: { accent: "#345e50", onAccent: "#faf4e6", bg: "#faf4e6", card: "#fffdf7", side: "#efe7d4", line: "#e4dac4", ink: "#2f382f", soft: "#6a7268", rose: "#c65e49" },
  koyu: { accent: "#8fbfa9", onAccent: "#1b231d", bg: "#161b17", card: "#1f2620", side: "#1a201b", line: "#2f3a31", ink: "#f3eee2", soft: "#a8b0a5", rose: "#e58a76" },
};

// ── Sozlukler ─────────────────────────────────────────────────────────────
const EKRAN = {
  journal: "Anı Defteri", trips: "Yolculuklar", memory: "Anı detayı", editor: "Anı yazıyor", trip: "Yolculuk sayfası",
  trip_editor: "Yolculuk ekliyor", route_studio: "Rota videosu", card_studio: "Kart stüdyosu", reader: "Defter gibi okuyor",
  import: "Eski notları getiriyor", me: "Ayarlar", cards: "Kartlarım", add: "Ekle menüsü", paywall: "Paywall", onboarding: "Tanıtım", closed: "Kapalı",
};
const KAYNAK = {
  theme: "Pro tema", book: "Yeni defter", photos: "Fotoğraf sınırı", pdf: "PDF", importlines: "İçe aktarım sınırı", import_lines: "İçe aktarım sınırı",
  signature: "İmza kaldırma", general: "Ayarlar", trips: "6. yolculuk", ai: "Yapay zeka kotası", unknown: "Bilinmiyor",
};
const kaynakAdi = k => KAYNAK[String(k || "").toLowerCase()] || k || "Bilinmiyor";
/* Liste fiyati (USD); gercek odenen tutar ulkeye gore degisir, her yerde "tahmini". */
const PLAN = {
  "com.aberk.iz.pro.monthly": { ad: "Aylık", usd: 4.99 },
  "com.aberk.iz.pro.yearly": { ad: "Yıllık", usd: 34.99 },
};
const planAdi = p => !p ? "" : PLAN[p]?.ad || String(p).split(/[._]/).pop();
const SAYAC = {
  installs_new: "Yeni kurulum", sessions: "Oturum", onboarding_done: "Tanıtım bitti", paywall_views: "Paywall açıldı", purchases: "Satın alma",
  ai_requests: "Yapay zeka isteği", ai_blocked: "Yapay zeka kotası doldu", ai_failed: "Yapay zeka hatası",
  memories_added: "Anı eklendi", trips_added: "Yolculuk eklendi", cards_exported: "Kart dışa aktarıldı", videos_exported: "Rota videosu",
  imports_done: "İçe aktarım", books_read: "Defter okundu",
};
const STIL = { paper: "Kağıt", dark: "Koyu", satellite: "Uydu" };
const DIL = { tr: "Türkçe", en: "İngilizce", de: "Almanca", es: "İspanyolca", fr: "Fransızca", it: "İtalyanca", pt: "Portekizce", nl: "Felemenkçe",
  ru: "Rusça", ja: "Japonca", ko: "Korece", zh: "Çince", ar: "Arapça", pl: "Lehçe", sv: "İsveççe", id: "Endonezce", hi: "Hintçe" };
const ONLINE = 3 * 6e4;

// ── Durum ─────────────────────────────────────────────────────────────────
let db = null, K = null, veri = null;
const demo = new URLSearchParams(location.search).has("demo");
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => Number(v) || 0;

// ── Veri ──────────────────────────────────────────────────────────────────
const ZAMAN = ["firstSeen", "lastSeen", "purchasedAt"];
const iso = v => { const t = zaman(v); return t ? t.toISOString() : null; };
const belge = d => ({ id: d.id, ...d.data() });

async function oku(ad, f) { try { return await f(); } catch (e) { veri.hatalar[ad] = e.code || e.message; return []; } }

async function yukle(k) {
  K = k;
  if (!db && k.app) db = getFirestore(k.app);
  veri = { hatalar: {}, okuma: {} };
  if (demo) Object.assign(veri, sahte());
  else {
    const [installs, days, events, sales] = await Promise.all([
      oku("installs", async () => (await getDocs(collection(db, "installs"))).docs.map(belge)),
      oku("stats", async () => (await getDocs(collection(db, "stats"))).docs.map(belge)),
      oku("events", async () => (await getDocs(query(collectionGroup(db, "events"), limit(8000)))).docs
        .map(d => ({ iid: d.ref.parent.parent.id, t: ms(d.data().t), e: d.data().e || "", p: d.data().p ?? null, s: d.data().s ?? null }))),
      oku("panel/sales", async () => { const d = await getDoc(doc(db, "panel", "sales")); return d.exists() ? d.data() : null; }),
    ]);
    Object.assign(veri, { installs, days, events, sales: Array.isArray(sales) ? null : sales });
  }
  hazirla();
  const h = Object.keys(veri.hatalar);
  k.durum(`${demo ? "Demo veri · " : ""}${sayi(veri.installs.length)} kurulum, ${sayi(veri.days.length)} gün kaydı, ${sayi(veri.events.length)} olay` +
    (h.length ? ` · okunamayan: ${h.map(x => `${x} (${veri.hatalar[x]})`).join(", ")}` : ""));
}

function hazirla() {
  for (const i of veri.installs) {
    for (const a of ZAMAN) i[a] = iso(i[a]);
    i.ev = i.ev && typeof i.ev === "object" ? i.ev : {};
  }
  veri.events = (veri.events || []).filter(e => e.t).sort((a, b) => a.t - b.t);
  veri.days = (veri.days || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.id)).sort((a, b) => a.id < b.id ? -1 : 1);
  veri.kurulum = new Map(veri.installs.map(i => [i.id, i]));
  veri.olaylar = new Map();
  for (const e of veri.events) { if (!veri.olaylar.has(e.iid)) veri.olaylar.set(e.iid, []); veri.olaylar.get(e.iid).push(e); }
  veri.aktifGun = new Map();
  const ekle = (id, t) => { const g = istGun(t); if (!g) return; if (!veri.aktifGun.has(id)) veri.aktifGun.set(id, new Set()); veri.aktifGun.get(id).add(g); };
  for (const i of veri.installs) { ekle(i.id, i.firstSeen); ekle(i.id, i.lastSeen); }
  for (const e of veri.events) ekle(e.iid, e.t);
  const ilkler = [...veri.installs.map(i => ms(i.firstSeen)), ...veri.days.map(d => Date.parse(d.id + "T00:00:00+03:00"))].filter(Boolean);
  veri.ilk = ilkler.length ? Math.min(...ilkler) : Date.now() - 30 * 864e5;
}

// ── Donem ve suzme ────────────────────────────────────────────────────────
const D = () => { const d = donem(K.aralik); if (!d.bas) d.bas = istGunBasi(veri.ilk); return d; };
const oncekiVar = d => d.oncekiBas != null;
const icinde = (t, b, s) => { const x = ms(t); return x >= b && x <= s; };
const fk = (simdi, once, ters) => once == null ? undefined : { simdi, once, ters };
const donemAdi = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
/* Kurulum bazli her sey secili surume gore; olaylar da kurulumun surumune gore. */
const I = () => surumSuz(veri.installs, K.surum);
const EV = () => !K.surum ? veri.events : veri.events.filter(e => veri.kurulum.get(e.iid)?.appVersion === K.surum);
const statsArasi = (b, s) => { const x = istGun(b), y = istGun(s); return veri.days.filter(d => d.id >= x && d.id <= y); };
const gP = () => { const d = D(); return statsArasi(d.bas, d.son); };
const gO = () => { const d = D(); return oncekiVar(d) ? statsArasi(d.oncekiBas, d.oncekiSon - 1) : null; };
const topla = (days, k) => (days || []).reduce((a, d) => a + n(d[k]), 0);
const evT = (days, k) => (days || []).reduce((a, d) => a + n(d.ev?.[k]), 0);
function evOnek(kaynak, onek) {
  const out = {};
  for (const d of kaynak || []) for (const [k, v] of Object.entries(d.ev || {})) {
    if (!k.startsWith(onek) || k.endsWith("_sec")) continue;
    const ad = k.slice(onek.length);
    if (!ad) continue;
    out[ad] = (out[ad] || 0) + n(v);
  }
  return out;
}
const adla = (h, onek) => Object.fromEntries(Object.entries(h).map(([k, v]) => [ALT[onek]?.[k] || k, v]));
function gunDizisi(d) { return gunleriDoldur({}, istGun(d.bas), istGun(d.son)).map(x => x.t); }
function statGunluk(alanlar) {
  const d = D(), h = Object.fromEntries(veri.days.map(x => [x.id, x]));
  return gunDizisi(d).map(t => { const o = { t }; for (const [ad, f] of Object.entries(alanlar)) o[ad] = f(h[t] || {}); return o; });
}
const SURUM_NOT = () => K.surum ? el("p", "muted", "Sürüm filtresi bu grafiğe uygulanmaz: günlük kayıtlar (stats) sürüme bölünmüyor.") : null;
const ham = (o, k) => n(o?.[k]);
const iev = (i, k) => n(i.ev?.[k]);
const online = i => i.screen && i.screen !== "closed" && Date.now() - ms(i.lastSeen) < ONLINE;
const platAdi = p => p === "android" ? "Android" : p === "ios" ? "iOS" : p || "Bilinmiyor";
const yas = i => i.firstSeen ? Math.floor((Date.now() - ms(i.firstSeen)) / 864e5) : null;
const evet = b => b === true ? "Evet" : b === false ? "Hayır" : "Bilinmiyor";


const kisiAdi = i => i ? i.id.slice(0, 8) : "";
function kisiHucre(i) {
  const k = el("span", "kisi");
  const b = el("b"); b.textContent = kisiAdi(i);
  const s = el("small"); s.textContent = [platAdi(i.platform), i.region].filter(Boolean).join(" · ") || "anonim";
  k.append(b, s);
  return { d: k, s: kisiAdi(i).toLowerCase() };
}
function rozetler(i) {
  const r = el("span", "rozet");
  if (online(i)) r.appendChild(el("span", "pill ok", "Uygulamada"));
  if (i.pro) r.appendChild(el("span", "pill pro", "Pro"));
  if (i.shared) r.appendChild(el("span", "pill sky", "Ortak defter"));
  if (i.lock) r.appendChild(el("span", "pill", "Face ID"));
  if (i.tester) r.appendChild(el("span", "pill warn", "Test"));
  return { d: r, s: (online(i) ? 16 : 0) + (i.pro ? 8 : 0) + (i.shared ? 4 : 0) + (i.lock ? 2 : 0) };
}
function sonAralik(i) {
  const t = ms(i.lastSeen);
  if (!t) return "Bilinmiyor";
  if (t >= istGunBasi()) return "Bugün";
  const g = (Date.now() - t) / 864e5;
  return g <= 7 ? "Son 7 gün" : g <= 28 ? "Son 28 gün" : g <= 90 ? "Son 90 gün" : "90+ gün";
}
/* Kutuyu karta koyup DOM'a ekler, sonra cizer (grafik genisligi olcer). */
function gKart(ebeveyn, baslik, ciz, ...alt) {
  const kutu = el("div");
  const k = kart(baslik, kutu, ...alt.filter(Boolean));
  ebeveyn.appendChild(k);
  try { ciz(kutu); } catch (e) { console.error(e); kutu.appendChild(el("p", "muted", "Çizilemedi.")); }
  return k;
}
const izgara = (c, sinif = "izgara2") => { const g = el("div", sinif); c.appendChild(g); return g; };
const hataNotu = ad => veri.hatalar[ad] ? el("div", "note err", `${esc(ad)} okunamadı: ${esc(veri.hatalar[ad])}`) : null;

// ── Olay metni (zaman cizelgesi) ──────────────────────────────────────────
const AI_YER = { trip_draft: "Yolculuk taslağı", notes: "Not toparlama", memory: "Anı yazımı", caption: "Başlık önerisi", import: "İçe aktarım" };
function aiHata(p) {
  const m = String(p || "").match(/^(.+?)_(\d{3})$/);
  if (!m) return p || "bilinmiyor";
  const kod = m[2] === "429" ? "429 (sınır)" : m[2] === "500" ? "500 (sunucu)" : m[2];
  return `${AI_YER[m[1]] || m[1]} · ${kod}`;
}
function olayMetni(e) {
  const p = e.p ?? "";
  switch (e.e) {
    case "screen": return `Ekran: ${EKRAN[p] || p}`;
    case "screen_time": return `Ekranda kaldı: ${EKRAN[p] || p}`;
    case "session": return "Oturum bitti";
    case "pw_view": return `Paywall açıldı · ${kaynakAdi(p)}`;
    case "pw_close": return `Paywall kapandı · ${kaynakAdi(p)}`;
    case "pw_close_bought": return `Paywall kapandı (aldı) · ${kaynakAdi(p)}`;
    case "pw_buy": return `Satın aldı · ${kaynakAdi(p)}`;
    case "onboarding_done": return "Tanıtımı bitirdi";
    case "onboarding_kind": return `Defter türü · ${p === "shared" ? "ortak (çift)" : p === "solo" ? "tek kişilik" : p}`;
    case "memory_added": return "Anı ekledi";
    case "trip_added": return "Yolculuk ekledi";
    case "card_export": return `Kart dışa aktardı · ${String(p).replace(/_/g, " ")}`;
    case "route_video": return `Rota videosu · ${STIL[p] || p}`;
    case "import_lines": return `Eski notları getirdi · ${sayi(n(p))} satır`;
    case "book_read": return "Defteri baştan sona okudu";
    case "ai_request": return `Yapay zeka isteği${p ? " · " + (AI_YER[p] || p) : ""}`;
    case "ai_blocked": return "Ücretsiz yapay zeka kotası doldu";
    case "ai_error": return `Yapay zeka hatası · ${aiHata(p)}`;
    default: return p ? `${e.e} · ${p}` : e.e;
  }
}
const olaySinif = e => e.e === "pw_buy" || e.e === "pw_close_bought" ? "ev buy" : e.e.startsWith("pw_") || e.e === "ai_error" ? "ev pw" : "ev";

// ════════════════════════════════════════════════════════════════════════
// ANALIZ
// ════════════════════════════════════════════════════════════════════════

function genel(c) {
  const d = D(), on = oncekiVar(d), ins = I(), evs = EV();
  const aktifIn = (b, s) => { const k = new Set(); for (const e of evs) if (e.t >= b && e.t <= s) k.add(e.iid); for (const i of ins) if (icinde(i.lastSeen, b, s)) k.add(i.id); return k.size; };
  const yeni = (b, s) => ins.filter(i => icinde(i.firstSeen, b, s)).length;
  const alim = (b, s) => ins.filter(i => icinde(i.purchasedAt, b, s)).length;
  const p = gP(), o = gO();
  const pro = ins.filter(i => i.pro).length;
  const st = (ad, k) => [ad, sayi(topla(p, k)), "günlük kayıt", on ? fk(topla(p, k), topla(o, k)) : undefined];
  c.appendChild(hataNotu("installs") || el("span"));
  c.appendChild(tiles([
    ["Aktif kurulum", sayi(aktifIn(d.bas, d.son)), donemAdi(), on ? fk(aktifIn(d.bas, d.son), aktifIn(d.oncekiBas, d.oncekiSon)) : undefined],
    ["Yeni kurulum", sayi(yeni(d.bas, d.son)), donemAdi(), on ? fk(yeni(d.bas, d.son), yeni(d.oncekiBas, d.oncekiSon)) : undefined],
    st("Oturum", "sessions"),
    ["Satın alma", sayi(alim(d.bas, d.son)), "kurulum", on ? fk(alim(d.bas, d.son), alim(d.oncekiBas, d.oncekiSon)) : undefined],
    ["Toplam kurulum", sayi(ins.length), K.surum ? `sürüm ${K.surum}` : "hepsi"],
    ["Pro", sayi(pro), yuzde(pro, ins.length)],
    st("Anı eklendi", "memories_added"), st("Yolculuk eklendi", "trips_added"),
    ["Ortak defter", sayi(ins.filter(i => i.shared).length), yuzde(ins.filter(i => i.shared).length, ins.length)],
    ["Şu an uygulamada", sayi(ins.filter(online).length), "son 3 dakika"],
  ]));

  const gunler = gunDizisi(d);
  const aktifGun = Object.fromEntries(gunler.map(t => [t, new Set()]));
  for (const e of evs) { const g = istGun(e.t); if (aktifGun[g]) aktifGun[g].add(e.iid); }
  for (const i of ins) { const g = istGun(i.lastSeen); if (aktifGun[g]) aktifGun[g].add(i.id); }
  const yeniGun = {};
  for (const i of ins) { const g = istGun(i.firstSeen); if (aktifGun[g]) yeniGun[g] = (yeniGun[g] || 0) + 1; }
  const g1 = izgara(c);
  gKart(g1, "Günlük aktif ve yeni kurulum", k => cizgi(k, gunler.map(t => ({ t, aktif: aktifGun[t].size, yeni: yeniGun[t] || 0 })),
    { seriler: [{ ad: "Aktif kurulum", alan: "aktif" }, { ad: "Yeni kurulum", alan: "yeni" }] }),
    el("p", "muted", "Aktif: o gün olay yazan ya da son görülmesi o gün olan kurulum. Türkiye günü."));
  gKart(g1, "Oturum (günlük kayıt)", k => gunlukCubuk(k, statGunluk({ v: x => ham(x, "sessions") }), { birim: "oturum" }), SURUM_NOT());
  const g2 = izgara(c);
  gKart(g2, "Anı ve yolculuk (günlük kayıt)", k => gunlukCubuk(k, statGunluk({ a: x => ham(x, "memories_added"), y: x => ham(x, "trips_added") }),
    { seriler: [{ ad: "Anı eklendi", alan: "a" }, { ad: "Yolculuk eklendi", alan: "y" }] }), SURUM_NOT());
  gKart(g2, "Kart ve rota videosu (günlük kayıt)", k => gunlukCubuk(k, statGunluk({ k: x => ham(x, "cards_exported"), v: x => ham(x, "videos_exported") }),
    { seriler: [{ ad: "Kart", alan: "k" }, { ad: "Rota videosu", alan: "v" }] }), SURUM_NOT());

  tutmaKart(c, ins);

  const g3 = izgara(c);
  const ulke = {}; for (const i of ins) ulke[i.region || "?"] = (ulke[i.region || "?"] || 0) + 1;
  const hk = el("div"); g3.appendChild(kart("Ülkeler", hk));
  dunyaHaritasi(hk, Object.fromEntries(Object.entries(ulke).filter(([k]) => k !== "?")), { birim: "kurulum" });
  const sn = el("div"); sn.textContent = "Yükleniyor...";
  const snK = kart("Son sürüm notları", sn);
  const snB = el("button", "ghost", "Bütün notlar"); snB.onclick = () => K.surumCekmecesi?.();
  snK.appendChild(snB); g3.appendChild(snK);
  surumNotlari(SLUG).then(l => { sn.textContent = ""; sn.appendChild(surumNotlariKutu(l, { limit: 4 })); });

  const g4 = izgara(c, "izgara3");
  const say = f => { const m = {}; for (const i of ins) { const k = f(i) || "Bilinmiyor"; m[k] = (m[k] || 0) + 1; } return m; };

function tutma(liste, N) {
  const uygun = liste.filter(i => i.firstSeen && Date.now() - ms(i.firstSeen) >= N * 864e5);
  const kalan = uygun.filter(i => {
    const ilk = istGunBasi(ms(i.firstSeen));
    if (ms(i.lastSeen) - ilk >= N * 864e5) return true;
    for (const g of veri.aktifGun.get(i.id) || []) if (Date.parse(g + "T00:00:00+03:00") - ilk >= N * 864e5) return true;
    return false;
  });

function sahte() {
  let tohum = 7;
  const r = () => { tohum = (tohum * 1664525 + 1013904223) % 4294967296; return tohum / 4294967296; };
  const sec = l => l[Math.floor(r() * l.length)];
  const now = Date.now(), G = 864e5;
  const hex = k => Array.from({ length: k }, () => "0123456789ABCDEF"[Math.floor(r() * 16)]).join("");
  const installs = [], events = [];
  const ekran = ["journal", "journal", "memory", "editor", "trips", "trip", "trip_editor", "reader", "card_studio", "route_studio", "cards", "add", "me", "import"];
  const kaynaklar = ["theme", "book", "photos", "pdf", "importLines", "signature", "general", "trips", "ai"];
  for (let j = 0; j < 58; j++) {
    const ilk = now - Math.pow(r(), 1.5) * 75 * G;
    const omur = r() < 0.3 ? r() * 2 * G : r() * (now - ilk);
    const son = Math.min(now - (j < 3 ? 40e3 : r() * 3 * 36e5), ilk + omur);
    const surum = ilk > now - 10 * G ? "1.1" : sec(["1.0", "1.1"]);
    const pro = j % 8 === 0 || j === 3;
    const shared = r() < 0.3;
    const i = {
      id: hex(8) + "-" + hex(4) + "-" + hex(4) + "-" + hex(4) + "-" + hex(12),
      platform: "ios", appVersion: surum, build: { "1.0": "12", "1.1": "18" }[surum],
      language: sec(["tr", "tr", "en", "en", "en", "de", "es"]), region: sec(["TR", "TR", "US", "US", "GB", "DE", "NL", "ES", "CA"]),
      tz: sec(["Europe/Istanbul", "America/New_York", "Europe/London", "Europe/Berlin"]),
      device: sec(["iPhone17,2", "iPhone16,1", "iPhone15,3", "iPhone14,7"]), os: sec(["26.6.1", "26.6.2", "27.0.1"]),
      firstSeen: new Date(ilk), lastSeen: new Date(son), screen: j < 3 ? sec(["journal", "editor", "trip"]) : "closed", lastScreen: sec(ekran),
      pro, plan: pro ? sec(["com.aberk.iz.pro.yearly", "com.aberk.iz.pro.monthly"]) : undefined,
      buySource: pro ? sec(kaynaklar) : undefined, purchasedAt: pro ? new Date(ilk + r() * Math.max(1, son - ilk)) : undefined,
      notif: r() < 0.5, onboarded: r() < 0.75, tester: j === 1 ? true : undefined, lock: r() < 0.22, shared,
      n_books: 1 + (r() < 0.25 ? 1 : 0), n_memories: Math.floor(Math.pow(r(), 2) * 60), n_photos: 0, n_trips: Math.floor(r() * r() * 7), n_stops: 0, n_cards: Math.floor(r() * 4), ev: {},
    };
    i.n_photos = Math.floor(i.n_memories * (0.5 + r() * 2)); i.n_stops = i.n_trips * Math.floor(2 + r() * 5);
    Object.keys(i).forEach(k => i[k] === undefined && delete i[k]);
    installs.push(i);
    const oturum = Math.max(1, Math.round((son - ilk) / G * (0.3 + r())) + 1);
    const ekle = (t, e, p, s) => events.push({ iid: i.id, t: Math.round(t), e, p: p ?? null, s: s ?? null });
    ekle(ilk + 3e4, "screen", "onboarding");
    if (i.onboarded) { ekle(ilk + 8e4, "onboarding_kind", shared ? "shared" : "solo"); ekle(ilk + 9e4, "onboarding_done"); }
    for (let o = 0; o < Math.min(oturum, 35); o++) {
      let t = o === 0 ? ilk + 1e5 : ilk + r() * (son - ilk);
      const ekr = 2 + Math.floor(r() * 5);
      let top = 0;
      for (let e = 0; e < ekr; e++) { const s = Math.round(4 + r() * 120); const ad = e === 0 ? "journal" : sec(ekran); ekle(t, "screen", ad); ekle(t + s * 1e3, "screen_time", ad, s); t += s * 1e3; top += s; }
      if (r() < 0.45) ekle(t, "memory_added");
      if (r() < 0.12) ekle(t, "trip_added");
      if (r() < 0.1) ekle(t, "card_export", sec(["paper_story", "paper_square", "dark_story", "film_square"]));
      if (r() < 0.06) ekle(t, "route_video", sec(["paper", "paper", "dark", "satellite"]));
      if (r() < 0.04) ekle(t, "import_lines", String(Math.floor(5 + r() * r() * 700)));
      if (r() < 0.05) ekle(t, "book_read");
      if (r() < 0.15) { ekle(t, "ai_request", sec(["trip_draft", "notes"])); if (r() < 0.1) ekle(t + 1e3, "ai_error", sec(["trip_draft_500", "notes_429", "trip_draft_429"])); if (!pro && r() < 0.1) ekle(t + 2e3, "ai_blocked"); }
      if (r() < 0.12) { const k = sec(kaynaklar); ekle(t, "pw_view", k); ekle(t + 2e4, "pw_close", k, Math.round(4 + r() * 50)); }
      ekle(t + 1e3, "session", null, top);
    }
    if (pro) { const t = ms(i.purchasedAt); ekle(t - 3e4, "pw_view", i.buySource); ekle(t, "pw_buy", i.buySource, Math.round(8 + r() * 60)); ekle(t + 1e3, "pw_close_bought", i.buySource, Math.round(10 + r() * 60)); }
  }
  events.sort((a, b) => a.t - b.t);
  const sayacOlay = { session: "sessions", pw_view: "paywall_views", pw_buy: "purchases", onboarding_done: "onboarding_done", memory_added: "memories_added",
    trip_added: "trips_added", card_export: "cards_exported", route_video: "videos_exported", import_lines: "imports_done", book_read: "books_read",
    ai_request: "ai_requests", ai_error: "ai_failed", ai_blocked: "ai_blocked" };
  const slug = x => String(x).toLowerCase().replace(/[^a-z0-9]/g, "_").slice(0, 40);
  const kayit = (o, e) => {
    const ad = slug(e.e), ev = o.ev ||= {};
    if (e.e === "screen_time") ev["screen_" + slug(e.p) + "_sec"] = (ev["screen_" + slug(e.p) + "_sec"] || 0) + n(e.s);
    if (e.e === "ai_request") return void (o.ai_requests = (o.ai_requests || 0) + 1);
    ev[ad] = (ev[ad] || 0) + 1;
    if (e.p && e.e !== "import_lines") ev[ad + "_" + slug(e.p)] = (ev[ad + "_" + slug(e.p)] || 0) + 1;
    if (e.s) { ev[ad + "_sec"] = (ev[ad + "_sec"] || 0) + n(e.s); if (e.p) ev[ad + "_" + slug(e.p) + "_sec"] = (ev[ad + "_" + slug(e.p) + "_sec"] || 0) + n(e.s); }
    const s = sayacOlay[e.e]; if (s) o[s] = (o[s] || 0) + 1;
  };
  const ins = new Map(installs.map(i => [i.id, i]));
  const gunler = {};
  for (const e of events) { kayit(ins.get(e.iid), e); const g = new Date(e.t).toISOString().slice(0, 10); kayit(gunler[g] ||= { id: g, ev: {} }, e); }
  for (const i of installs) { const g = new Date(ms(i.firstSeen)).toISOString().slice(0, 10); (gunler[g] ||= { id: g, ev: {} }).installs_new = (gunler[g].installs_new || 0) + 1; i.installs_new = 1; }
  const sales = { uretim: new Date(now - 4 * 36e5).toISOString(), gun: 60, ulkeler: { TR: 30, US: 22, GB: 8, DE: 6, NL: 3 }, gunluk: [] };
  for (let g = 59; g >= 0; g--) { const t = new Date(now - g * G).toISOString().slice(0, 10); const sat = r() < 0.12 ? 1 : 0; sales.gunluk.push({ tarih: t, indirme: Math.floor(r() * 6), guncelleme: Math.floor(r() * 3), iap: sat, gelir: sat ? { USD: 24.49 } : {} }); }
  return { installs, days: Object.values(gunler), events, sales };
}

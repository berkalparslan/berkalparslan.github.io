const DIL = typeof Intl.DisplayNames === "function" ? new Intl.DisplayNames(["tr"], { type: "language" }) : null;
const ulkeAd = r => { if (!r) return "Bilinmiyor"; try { return ULKE?.of(String(r).toUpperCase()) || r; } catch (e) { return r; } };
const dilAd = l => { if (!l) return "Bilinmiyor"; try { return DIL?.of(String(l)) || l; } catch (e) { return l; } };
const kisa = id => String(id || "").slice(0, 8);
const bayt = b => { b = +b || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return `${b.toLocaleString("tr-TR", { maximumFractionDigits: b < 10 && i ? 1 : 0 })} ${u[i]}`; };
const sureY = s => (s ? sure(s) : "-");

const DAY = 864e5;

// ---------- Durum ----------
let K = null;          // kabuk
let veri = null;       // hazirla() ciktisi
let taban = (() => { try { const v = localStorage.getItem("nika-panel-api"); return TABANLAR.includes(v) ? v : TABANLAR[0]; } catch (e) { return TABANLAR[0]; } })();
let canliSaat = null;

// ---------- API ----------
async function api(yol, { method = "GET", body, oturum } = {}) {
  if (K?.demo) return demoApi(yol, method, body);
  const headers = {};
  if (body) headers["content-type"] = "application/json";
  const s = oturum === false ? null : oturum || K?.oturum?.session;
  if (s) headers.authorization = "Bearer " + s;
  let r = null, son = null;
  for (const b of [taban, ...TABANLAR.filter(x => x !== taban)]) {
    try {
      r = await fetch(b + yol, { method, headers, body: body ? JSON.stringify(body) : undefined });
      if (b !== taban) { taban = b; try { localStorage.setItem("nika-panel-api", b); } catch (e) { } }
      break;
    } catch (e) { son = e; }
  }
  if (!r) throw new Error("Sunucuya ulaşılamadı: " + (son?.message || ""));
  const j = await r.json().catch(() => null);
  if (!r.ok) {
    const e = new Error(typeof j?.error === "string" ? j.error : j?.error?.code || `HTTP ${r.status}`);
    e.status = r.status; e.code = j?.error?.code;
    throw e;
  }
  return j;
}

async function girisDogrula(idToken) {
  const g = await api("/v1/auth/google", { method: "POST", body: { idToken }, oturum: false });
  try {
    const me = await api("/v1/admin/me", { oturum: g.session });
    return { session: g.session, email: me.email };
  } catch (e) {
    api("/v1/auth/logout", { method: "POST", oturum: g.session }).catch(() => { });
    if (e.status === 403) throw new Error("Bu Google hesabı Nika sunucusunda yönetici değil.");
    throw e;
  }
}

// ---------- Veri ----------
async function yukle(k) {
  K = k;
  let ham;
  try { ham = k.demo ? demoVeri() : await api("/v1/admin/panel"); }
  catch (e) {
    if (e.status === 401) { k.durum("Oturum bitti, yeniden giriş yap."); k.cikis(); return; }
    throw e;
  }
  veri = hazirla(ham);
  k.durum(`${k.demo ? "Demo veri · " : ""}${sayi(veri.I.length)} kurulum, ${sayi(veri.E.length)} olay (son ${ham.eventDays} gün), ${sayi(veri.alanlar.length)} düğün alanı · ${tarihTam(ham.at)}`);
}

function hazirla(h) {
  const tok = new Map();
  for (const t of h.tokens || []) if (t.install_id && (!tok.has(t.install_id) || t.updated_at > tok.get(t.install_id).updated_at)) tok.set(t.install_id, t);
  const I = (h.installs || []).map(r => {
    const t = tok.get(r.id), c = r.c || {};
    const ev = {};
    for (const [k, v] of Object.entries(c)) if (k.startsWith("ev.")) ev[k.slice(3)] = v;
    return {
      ...r, c, ev, token: t || null,
      appVersion: r.app_version || "", lastSeen: r.last_seen, firstSeen: r.first_seen,
      pro: r.premium === 1 || r.premium === true, tester: r.tester === 1 || r.tester === true,
      signedIn: !!(r.user_id || t?.linked), fcm: t ? t.platform : "",
      notif: r.notif == null ? (t ? true : undefined) : r.notif === 1 || r.notif === true,
      oturum: +c.sessions || 0, sureT: +c["ev.session_sec"] || 0,
    };
  });
  const E = (h.events || []).map(e => ({ ...e, _t: ms(e.t) })).filter(e => e._t).sort((a, b) => a._t - b._t);
  const stat = {};
  for (const s of h.stats || []) (stat[s.day] ||= {})[s.key] = (stat[s.day][s.key] || 0) + (+s.value || 0);
  const evKur = new Map();
  for (const e of E) { if (!evKur.has(e.i)) evKur.set(e.i, []); evKur.get(e.i).push(e); }
  const uye = {}, kayit = {}, link = {}, yayin = {}, tarih = {}, hak = {}, hediye = {}, yukl = {};
  for (const m of h.members || []) (uye[m.space_id] ||= []).push(m);
  for (const r of h.records || []) (kayit[r.s] ||= []).push(r);
  for (const l of h.links || []) (link[l.space_id] ||= []).push(l);
  for (const p of h.published || []) (yayin[p.space_id] ||= []).push(p);
  for (const d of h.eventDates || []) (tarih[d.s] ||= []).push(d);
  for (const e of h.entitlements || []) (hak[e.space_id] ||= []).push(e);
  for (const g of h.gifts || []) (hediye[g.space_id] ||= []).push(g);
  for (const u of h.uploads || []) (yukl[u.space_id] ||= []).push(u);
  const kurAlan = {};
  for (const i of I) if (i.space_id) (kurAlan[i.space_id] ||= []).push(i);
  const kullanici = new Map((h.users || []).map(u => [u.id, u]));
  const alanlar = (h.spaces || []).map(s => {
    const rs = kayit[s.id] || [], say = {}, alt = {}, sil = {};
    let medyaB = 0, misafirM = 0, ciftM = 0, video = 0, sonHar = "";
    for (const r of rs) {
      if (r.d) { sil[r.k] = (sil[r.k] || 0) + r.n; continue; }
      say[r.k] = (say[r.k] || 0) + r.n;
      const a = (alt[r.k] ||= {}); const anahtar = r.v ?? "-"; a[anahtar] = (a[anahtar] || 0) + r.n;
      if (r.k === "attendance" && r.w) { const b = (alt.attSrc ||= {}); b[r.w] = (b[r.w] || 0) + r.n; }
      if (r.k === "invitationDesign" && r.w) { const b = (alt.davetiye ||= {}); b[r.w] = (b[r.w] || 0) + r.n; }
      if (r.k === "media") { medyaB += +r.b || 0; const w = String(r.w || ""); if (w.startsWith("video:")) video += r.n; if (w.endsWith("web")) misafirM += r.n; else ciftM += r.n; }
      if (r.last > sonHar) sonHar = r.last;
    }
    const m = uye[s.id] || [];
    const tarihler = (tarih[s.id] || []).map(x => x.date).filter(x => /^\d{4}-\d{2}-\d{2}/.test(x || "")).sort();
    const bugun = istGun(Date.now());
    const dugun = (tarih[s.id] || []).filter(x => x.type === "wedding" && x.date).map(x => x.date).sort()[0] || tarihler.find(x => x >= bugun) || tarihler.at(-1) || null;
    const kota = (s.premium ? 10 * 1024 ** 3 : 1024 ** 3) + (+s.storage_extra || 0);
    return {
      ...s, say, alt, sil, medyaB, misafirM, ciftM, video, sonHar: sonHar || null, uyeler: m,
      yonetici: m.filter(x => x.role === "admin").length, yardimci: m.filter(x => x.role === "helper").length,
      linkler: link[s.id] || [], yayin: (yayin[s.id] || []).map(x => x.kind), dugun,
      kalan: dugun ? Math.round((Date.parse(dugun.slice(0, 10) + "T12:00:00+03:00") - Date.now()) / DAY) || 0 : null,
      haklar: hak[s.id] || [], hediyeler: hediye[s.id] || [], yuklemeler: yukl[s.id] || [], kurulumlar: kurAlan[s.id] || [], kota,
    };
  });
  return {
    ham: h, I, E, stat, evKur, alanlar, kullanici,
    kullanicilar: h.users || [], uyeler: h.members || [], tokenlar: h.tokens || [], gonderimler: h.pushes || [],
    haklar: h.entitlements || [], hediyeler: h.gifts || [], altyapi: h.infra, satis: h.sales, push: h.push || {},
  };
}

// ---------- Donem, surum ----------
const D = () => donem(K.aralik);
const donemAdi = () => K.aralik === 0 ? "tüm zamanlar" : K.aralik === 1 ? "bugün" : `son ${K.aralik} gün`;
const oncekiVar = () => D().oncekiBas != null;
const Isec = () => surumSuz(veri.I, K.surum);
function Esec() {
  if (!K.surum) return veri.E;
  const s = new Set(Isec().map(i => i.id));
  return veri.E.filter(e => s.has(e.i));
}
const arada = (t, a, b) => t >= a && t < b;
function iki(liste, f) {
  const d = D();
  const simdi = liste.filter(x => arada(f(x), d.bas, d.son + 1));
  const once = d.oncekiBas == null ? null : liste.filter(x => arada(f(x), d.oncekiBas, d.oncekiSon));
  return { simdi, once };
}
const fk = (simdi, once, ters) => (once == null ? null : { simdi, once, ters });
const evler = (ad, liste = Esec()) => iki(liste.filter(e => e.e === ad), e => e._t);
const tekil = l => new Set(l.map(e => e.i)).size;
/* Gunluk stats sayaclari UTC gunu: gunun ogle saati donemdeyse sayilir. */
function statTop(key, a, b) {
  let t = 0;
  for (const [g, o] of Object.entries(veri.stat)) { const m = Date.parse(g + "T12:00:00Z"); if (m >= a && m < b) t += +o[key] || 0; }
  return t;
}
function statIki(key) {
  const d = D();
  return { simdi: statTop(key, d.bas || 0, d.son + DAY), once: d.oncekiBas == null ? null : statTop(key, d.oncekiBas, d.oncekiSon) };
}
function statOnek(onek, a, b) {
  const o = {};
  for (const [g, x] of Object.entries(veri.stat)) {
    const m = Date.parse(g + "T12:00:00Z"); if (!(m >= a && m < b)) continue;
    for (const [k, v] of Object.entries(x)) if (k.startsWith(onek)) o[k.slice(onek.length)] = (o[k.slice(onek.length)] || 0) + (+v || 0);
  }
  return o;
}
function ilkZaman() {
  let m = Date.now();
  for (const i of veri.I) { const t = ms(i.first_seen); if (t && t < m) m = t; }
  for (const g of Object.keys(veri.stat)) { const t = Date.parse(g + "T00:00:00Z"); if (t < m) m = t; }
  return m;
}
/* Grafik gunleri: donem; "Bugün" seciliyse son 7 gun (tek cubuk okunmuyor). */
function grafikAralik() {
  const d = D();
  let bas = d.bas || ilkZaman();
  if (K.aralik === 1) bas = istGunBasi() - 6 * DAY;
  return [istGun(bas), istGun(Date.now())];
}
function gunHaritasi(liste, f, alan = "v", deger = () => 1) {
  const m = {};
  for (const x of liste) { const g = istGun(f(x)); if (!g) continue; const o = (m[g] ||= {}); o[alan] = (o[alan] || 0) + deger(x); }
